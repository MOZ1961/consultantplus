    - TM-MEAS measurement register for each de-identified real episode
    - TECH-BMA life cycle concepts containing D08 scenario-library view
    - TM-MEAS measurement report containing D09 structured-feedback view
    - TECH-VER verification report
    - TECH-OP operation report
    - derived participant-facing rendering from exact verified aggregate ArtifactVersions
  canary_output: TECH-VER verification report containing synthetic normalized packets, clusters, D08/D09 renderings and check results; synthetic evidence is not persisted as real TM-MEAS evidence.
  enablers: [ChatGPT engineering actor, GitHub connector, MOZ1961/consultantplus repository, MOZ1961/se request execution]
ordered_steps:
  - id: IMP-RICX-01
    actor: SE actor
    action: Confirm unchanged dialogue purpose, one request-level TECH-OP, bounded RIC scope, execution authority and BIND-CPLUS-SE-001; exclude the parallel Proposal package from inputs.
  - id: IMP-RICX-02
    actor: SE actor
    action: Create execution_set_id and stable episode_id for each admitted episode; record bounded_sample_size and source identity.
  - id: IMP-RICX-03
    actor: SE actor
    action: Apply E0/S01 intake and minimization rules to each episode; mark missing values not_established and remove unnecessary identifiers before persistence.
  - id: IMP-RICX-04
    actor: SE actor
    action: Preserve evidence class per material field, including RIC_account_of_client_episode; never relabel a provider-side account as direct client evidence.
  - id: IMP-RICX-05
    actor: TM-MEAS
    action: Persist each real normalized episode in measurement register; retain synthetic fixture only in TECH-VER.
  - id: IMP-RICX-06
    actor: SE actor
    action: Add comparable codes for decision/problem, trigger, RIC intervention, gap and workaround/handoff and mark inferred coding explicitly.
  - id: IMP-RICX-07
    actor: SE actor
    action: Group episodes only with explicit grouping basis; store cluster_id, exact member_episode_ids, observed_count, bounded_sample_size, evidence-class summary and unresolved variation.
  - id: IMP-RICX-08
    actor: SE actor
    action: Use recurring_within_sample only for clusters with at least two members; keep singletons separate and never infer population prevalence.
  - id: IMP-RICX-09
    actor: TECH-BMA
    action: Persist life cycle concepts containing D08 scenario-library content traced to exact cluster and episode IDs.
  - id: IMP-RICX-10
    actor: TM-MEAS
    action: Persist measurement report containing D09 structured feedback with scenario, decision, gap, workaround, recurrence count, sample size, evidence classes and member episode IDs.
  - id: IMP-RICX-11
    actor: SE actor
    action: Keep proposed product, service, training, access and organizational responses as candidates; do not automatically promote them to requirements or roadmap commitments.
  - id: IMP-RICX-12
    actor: TECH-VER
    action: Verify exact inputs, produced products, evidence classes, sample bounds, traces and prohibited claims; unresolved required evidence remains explicit.
  - id: IMP-RICX-13
    actor: SE actor
    action: Create participant-facing D08/D09 renderings only after TECH-VER pass or pass_with_explicit_limitations.
  - id: IMP-RICX-14
    actor: TECH-OP
    action: Finalize the operation report with actual IOPEC, exact product addresses, ExecutionContour, verification state, delivery state, feedback and unresolved items.
  - id: IMP-RICX-15
    actor: TM-MEAS
    action: Retain accumulated evidence for later improvement and comparison.
  - id: IMP-RICX-16
    actor: SE actor
    action: Route E4 cross-RIC synthesis or external commercial execution through a separate authorized lifecycle path.
error_and_problem_resolution:
  - condition: fewer_than_three_usable_episodes_for_intended_E3_run
    action: obtain more authorized episodes or execute a limited diagnostic with explicit limitation
  - condition: more_than_five_episodes_supplied_for_first_bounded_run
    action: select an authorized subset or create a separate execution scope
  - condition: required_episode_field_absent
    action: mark not_established and block only dependent synthesis
  - condition: sensitive_or_secret_input_supplied
    action: do not persist it; retain only a minimized authorized paraphrase if needed
  - condition: evidence_class_ambiguous
    action: use interviewer_coding_or_inference or not_established; never upgrade evidence class
  - condition: cluster_basis_weak_or_conflicting
    action: keep episodes separate or record unresolved_variation
  - condition: recurrence_claim_exceeds_bounded_sample
    action: fail verification and rewrite as an observed count within supplied sample
  - condition: TECH_VER_fails
    action: do not deliver aggregate result as verified; correct and re-verify
  - condition: request_expands_to_E4_or_multiple_RICs
    action: route extension through TECH-SYSREQ, TECH-ARCH, TECH-DES, TECH-IMP and TECH-VER before claiming coverage
  - condition: external_Proposal_package_is_needed
    action: hand off to the separate concurrent Proposal-package workstream without modifying it here
completion_and_verification_conditions:
  implementation_exists_when: this exact procedure plus exact RICX requirements, architecture and design are addressable in MOZ1961/consultantplus
  operational_capability_when: synthetic 3-episode canary passes TECH-VER and applicable exact-head external-client structural verification passes
  real_RIC_use_validated_when: separate authorized real RIC episode-set evidence demonstrates intended usefulness
  commercial_offer_when: separate owner, Network or RIC authority establishes external service scope and terms
  proposal_package_dependency: none_for_internal_capability_construction
  merge_or_deployment: separate owner authority
  canary_fixture_rule: synthetic fixture is non-client and non-RIC evidence and shall not enter real TM-MEAS evidence products
glossary:
  bounded_RIC_set: first designed multi-episode execution unit containing 3-5 de-identified RIC service episodes
  recurring_within_sample: evidence-supported cluster with at least two member episodes inside the bounded set
  D08: scenario-library view of TECH-BMA life cycle concepts
  D09: structured-feedback view of TM-MEAS measurement report
  verified_delivery: participant aggregate rendering issued only after subject TECH-VER of exact canonical bases
  synthetic_canary: fabricated non-client and non-RIC episode set used to test mechanics and constraints
