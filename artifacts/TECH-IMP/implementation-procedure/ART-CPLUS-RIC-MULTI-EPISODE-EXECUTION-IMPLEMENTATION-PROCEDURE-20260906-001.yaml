artifact_instance_purpose: >-
  Реализовать многоэпизодный контур РИЦ как точную исполнимую процедуру текущего SE-актора поверх
  существующей E0/S01 процедуры: обработать bounded-набор 3-5 эпизодов, сохранить поэпизодную
  доказательную трассу, сформировать D08 и D09 через существующие канонические продукты,
  выполнить обязательную TECH-VER и зафиксировать результат без зависимости от параллельного
  внешнего пакета Предложения.
