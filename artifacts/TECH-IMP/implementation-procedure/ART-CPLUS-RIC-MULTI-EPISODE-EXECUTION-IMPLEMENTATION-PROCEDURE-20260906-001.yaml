ordered_steps:
  - id: IMP-RICX-01
    actor: SE actor
    action: Confirm unchanged dialogue purpose, one request-level TECH-OP identity, bounded RIC scope, execution authority and BIND-CPLUS-SE-001; confirm the parallel Proposal-package workstream is not an execution input.
  - id: IMP-RICX-02
    actor: SE actor
    action: Create a non-identifying execution_set_id and stable episode_id for each admitted episode; record bounded_sample_size and source identity.
  - id: IMP-RICX-03
    actor: SE actor
    action: For each episode apply the exact E0/S01 intake semantics IN-01..IN-13 and minimization rules; mark missing values not_established and reject secrets or unnecessary identifiers before persistence.
  - id: IMP-RICX-04
    actor: SE actor
    action: Preserve evidence class per material field, including the distinct RIC_account_of_client_episode class; never relabel provider-side account as direct client evidence.
  - id: IMP-RICX-05
    actor: SE actor
    action: For each real episode persist normalized evidence through TM-MEAS measurement register; in synthetic canary mode retain fixture only inside TECH-VER.
  - id: IMP-RICX-06
    actor: SE actor
    action: Add cross-episode comparable codes for decision/problem, trigger, RIC intervention, gap and workaround/handoff; tag these codes interviewer_coding_or_inference unless directly supplied as a controlled participant category.
  - id: IMP-RICX-07
    actor: SE actor
    action: Group comparable episodes only when an explicit grouping basis exists; create cluster_id, exact member_episode_ids, observed_count, bounded_sample_size, evidence-class summary and unresolved variation.
  - id: IMP-RICX-08
    actor: SE actor
    action: Use recurring_within_sample only for clusters with at least two exact member episodes; retain singleton cases as singleton_candidate and do not infer population prevalence.
  - id: IMP-RICX-09
    actor: TECH-BMA
    action: For a real execution persist TECH-BMA life cycle concepts containing D08 scenario-library content traced to exact cluster and episode IDs; every analytical synthesis is explicitly tagged where it is inference.
  - id: IMP-RICX-10
    actor: TM-MEAS
    action: For a real execution persist a measurement report containing D09 structured-feedback content with scenario, decision, gap, workaround, observed recurrence count, sample size, criticality basis, evidence classes, exact member episode IDs and candidate response type.
  - id: IMP-RICX-11
    actor: SE actor
    action: Keep candidate product/service/training/access/organization responses as candidates only; do not automatically promote them into stakeholder requirements, change requests, roadmap items or official commitments.
  - id: IMP-RICX-12
    actor: TECH-IMP
    action: Create training materials only when a separate owner-authorized S04 execution actually produces them; otherwise record training_materials_not_produced.
  - id: IMP-RICX-13
    actor: TECH-VER
    action: Execute VC-RICX-01..16 and SR-RICX-01..19 against exact inputs and produced/canary content; unresolved required evidence yields fail or pass_with_explicit_limitations, never silent completion.
  - id: IMP-RICX-14
    actor: SE actor
    action: Only after TECH-VER pass/pass_with_explicit_limitations create participant-facing D08/D09 renderings from exact verified canonical ArtifactVersions and include the mandatory sample-bound and non-commercial limitations footer.
  - id: IMP-RICX-15
    actor: SE actor
    action: Finalize the single TECH-OP operation report with actual IOPEC, exact product addresses, ExecutionContour, verification state, delivery state, participant feedback if available and unresolved items.
  - id: IMP-RICX-16
    actor: SE actor
    action: Retain accumulated evidence for later TM-MEAS/TECH-BMA improvement; expansion to E4 cross-RIC synthesis or external commercial execution requires a separate lifecycle path and authority.
error_and_problem_resolution:
  - {condition: fewer_than_three_usable_episodes_for_intended_E3_run, action: do not claim full E3 sample completion; either obtain more authorized episodes or execute a limited non-E3 diagnostic with explicit limitation}
  - {condition: more_than_five_episodes_supplied_for_first_bounded_run, action: select an owner-authorized bounded subset or create a separately scoped execution; do not silently change the designed sample boundary}
  - {condition: required_episode_field_absent, action: mark not_established and block only dependent synthesis}
  - {condition: sensitive_or_secret_input_supplied, action: do not persist it; retain only a minimized paraphrase if needed and authorized}
  - {condition: evidence_class_ambiguous, action: use interviewer_coding_or_inference or not_established; never upgrade to direct evidence}
  - {condition: cluster_basis_weak_or_conflicting, action: keep episodes separate or record unresolved_variation rather than forcing a recurring cluster}
  - {condition: recurrence_claim_exceeds_bounded_sample, action: fail verification and rewrite as observed count within supplied sample}
  - {condition: participant_or_actor_requests_automatic_requirement_or_roadmap_promotion, action: preserve feedback as evidence and route any specific authorized change separately through the responsible process}
  - {condition: TECH_VER_fails, action: do not deliver aggregate result as verified; correct dependent product/procedure and re-verify}
  - {condition: client_authority_or_binding_unresolved, action: stop dependent cross-environment persistence or delivery}
  - {condition: request_expands_to_E4_or_multiple_RICs, action: record capability gap and route extension through TECH-SYSREQ/ARCH/DES/IMP/VER before claiming coverage}
  - {condition: external_Proposal_package_is_needed, action: hand off to the separate concurrent Proposal-package workstream; do not modify it here}
completion_and_verification_conditions:
  implementation_exists_when: this exact procedure plus exact RICX requirements/architecture/design ArtifactVersions are addressable in MOZ1961/consultantplus
  operational_capability_when: synthetic 3-episode end-to-end canary passes TECH-VER on exact versions and applicable exact-head structural verification passes
  real_RIC_use_validated_when: separate authorized real RIC episode-set evidence demonstrates intended usefulness; not inferred from canary
  commercial_offer_when: separate owner/Network/RIC authority establishes external service scope and terms
  proposal_package_dependency: none_for_internal_capability_construction
  merge_or_deployment: separate owner authority
  canary_fixture_rule: synthetic fixture is explicitly non-client/non-RIC evidence and shall not enter TM-MEAS real evidence products
glossary:
  bounded_RIC_set: first designed multi-episode execution unit containing 3-5 de-identified RIC service episodes
  recurring_within_sample: evidence-supported cluster with at least two member episodes inside the bounded supplied set
  D08: scenario-library view of TECH-BMA life cycle concepts
  D09: structured-feedback view of TM-MEAS measurement report
  verified_delivery: participant aggregate rendering may be issued only after subject TECH-VER of exact canonical bases
  synthetic_canary: fabricated non-client/non-RIC episode set used to test mechanics and constraints
