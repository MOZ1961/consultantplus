  produced_outputs_when_real:
    - TM-MEAS measurement register containing de-identified episode evidence
    - TECH-BMA business or mission analysis report containing D02 plus preliminary D03/D04
    - TECH-VER verification report
    - TECH-OP operation report
    - derived participant-facing rendering from exact verified TECH-BMA ArtifactVersion
  canary_output: TECH-VER verification report containing synthetic fixture, transformed packet, requirement/check results and capability disposition; no synthetic TM-MEAS/client evidence product is created
  enablers: [ChatGPT engineering actor, GitHub connector, MOZ1961/consultantplus repository, MOZ1961/se request execution]
ordered_steps:
  - id: IMP-OEX-01
    actor: SE actor
    action: Confirm current dialogue purpose, one request-level TECH-OP identity, E0/S01 scope, participant/owner authority and BIND-CPLUS-SE-001.
  - id: IMP-OEX-02
    actor: SE actor
    action: Extract IN-01..IN-09 and optional IN-10..IN-13 from the supplied episode; mark missing values not_established and do not infer hidden facts.
  - id: IMP-OEX-03
    actor: SE actor
    action: Minimize before persistence by removing unnecessary names, third-party identifiers, credentials, secrets, privileged raw materials and unsupported direct quotations.
  - id: IMP-OEX-04
    actor: SE actor
    action: Assign evidence class to every material field; participant wording/paraphrase remains distinct from analyst coding or inference.
  - id: IMP-OEX-05
    actor: SE actor
    action: For a real episode persist the normalized evidence through TM-MEAS measurement register; in synthetic canary mode keep fixture only inside TECH-VER.
  - id: IMP-OEX-06
    actor: SE actor
    action: Build D02 strictly from traceable intake fields, using not_established for unavailable content.
  - id: IMP-OEX-07
    actor: SE actor
    action: Build preliminary D03 by separately describing ConsultantPlus, RIC, client-organization and other-source contribution; analyst classification is explicitly tagged interviewer_coding_or_inference.
  - id: IMP-OEX-08
    actor: SE actor
    action: Build preliminary D04 only from reported uncertainty/workarounds/barriers/handoffs or explicit analyst inference; do not infer ROI, avoided losses, prevalence or causal risk reduction.
  - id: IMP-OEX-09
    actor: SE actor
    action: For a real episode persist D02/D03/D04 in a TECH-BMA business or mission analysis report with field-level evidence trace and limitations.
  - id: IMP-OEX-10
    actor: TECH-VER
    action: Check VC-01..VC-10 and SR-OEX-01..15 against exact inputs/products; unresolved required evidence yields fail or pass_with_explicit_limitations, never silent completion.
  - id: IMP-OEX-11
    actor: SE actor
    action: Only after TECH-VER pass/pass_with_explicit_limitations create a participant-facing rendering from the exact verified TECH-BMA ArtifactVersion and include the mandatory limitations footer.
  - id: IMP-OEX-12
    actor: SE actor
    action: Finalize the TECH-OP operation report with actual IOPEC, exact product addresses, verification, delivery state, participant feedback if available and unresolved items.
  - id: IMP-OEX-13
    actor: SE actor
    action: Use accumulated evidence only as input to later TM-MEAS/TECH-BMA improvement; do not automatically promote one participant observation to requirement, roadmap or commercial offer.
error_and_problem_resolution:
  - {condition: minimum field absent, action: mark not_established and block only dependent D02/D03/D04 claim}
  - {condition: sensitive or secret input supplied, action: do not persist it; ask for or retain only a minimized paraphrase if needed and authorized}
  - {condition: evidence class ambiguous, action: use interviewer_coding_or_inference or not_established rather than participant fact}
  - {condition: participant asks for legal correctness opinion, action: keep E0 output to decision-path analysis and state that legal correctness is outside this capability}
  - {condition: TECH-VER fails, action: do not deliver as verified result; correct dependent product/procedure and re-verify}
  - {condition: client authority/interface unresolved, action: stop cross-environment persistence/delivery dependent on that boundary}
  - {condition: request expands beyond E0/S01, action: record capability gap and route extension through TECH-SYSREQ/ARCH/DES/IMP/VER before claiming coverage}
completion_and_verification_conditions:
  implementation_exists_when: this exact procedure plus requirements/architecture/design exact ArtifactVersions are addressable in MOZ1961/consultantplus
  operational_capability_when: synthetic end-to-end canary passes TECH-VER on the exact versions and exact-head structural external-client verification passes
  real_service_validated_when: separate participant use evidence demonstrates intended usefulness; not inferred from canary
  commercial_offer_when: separate owner/Network/RIC authority establishes official service scope and terms
  merge_or_deployment: separate owner authority
  canary_fixture_rule: synthetic fixture must be clearly marked non-client evidence and cannot enter TM-MEAS measurement register as real episode data
glossary:
  implementation_procedure: ordered actor-executable control implementing the E0/S01 design without requiring new application software
  verified_delivery: participant rendering may be issued only after subject TECH-VER of its canonical analysis basis
  synthetic_canary: fabricated non-client episode used to test the mechanics and constraints of the execution path
