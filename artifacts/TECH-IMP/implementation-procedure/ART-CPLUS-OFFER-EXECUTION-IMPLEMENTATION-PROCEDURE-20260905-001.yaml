inputs_outputs:
  required_inputs:
    - explicit execution authority for one E0/S01 episode
    - participant group or non-identifying role
    - episode narrative sufficient to disposition IN-01..IN-09
    - ARTVER-CPLUS-OFFER-EXECUTION-SYSTEM-REQUIREMENTS-20260905-001-V1
