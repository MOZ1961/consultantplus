body:
  information_status_and_version_description:
    register_id: CPLUS-RIC-POSITIONING-METHOD-SOURCES-20260907-V1
    capture_date: '2026-09-07'
    capture_rule: >-
      Фиксировать только источники, фактически использованные для методики или предметного утверждения.
      Для внешнего защищенного текста хранить библиографическую идентичность, устойчивый URL/DOI и
      краткую русскоязычную парафразу доступной аннотации/официальной страницы; полный текст не копировать.
      Для уже process-owned источников использовать exact ArtifactVersion как вход и не дублировать их тело.
    copyright_and_reuse_disposition: paraphrased_source_bodies_no_full_copyrighted_text_replication
    source_records:
      - source_id: SRC-KELLER-STERNTHAL-TYBOUT-2002
        title: Three Questions You Need to Ask About Your Brand
        authors: [Kevin Lane Keller, Brian Sternthal, Alice M. Tybout]
        year: 2002
        source_type: practitioner_research_article
        stable_locator: https://hbr.org/2002/09/three-questions-you-need-to-ask-about-your-brand
        body_capture_mode: paraphrased_from_public_article_summary_and_product_description
        source_body_summary_ru: >-
          Эффективное позиционирование требует сначала установить конкурентную рамку или категорию,
          затем обеспечить необходимые точки паритета с участниками категории и только после этого
          формулировать значимые, правдоподобные и отличительные точки различия. Одних отличий недостаточно.
        supports_claims: [POS-CLM-01-frame_required, POS-CLM-02-parity_and_difference_both_required, POS-CLM-03-difference_must_be_relevant_and_believable]
        limitations: general_brand_positioning_framework_not_ConsultantPlus_specific_evidence
      - source_id: SRC-SMITH-1956
        title: Product Differentiation and Market Segmentation as Alternative Marketing Strategies
        authors: [Wendell R. Smith]
        year: 1956
        source_type: peer_reviewed_marketing_article
        doi: 10.1177/002224295602100102
        stable_locator: https://doi.org/10.1177/002224295602100102
        body_capture_mode: paraphrased_from_bibliographic_and_available_publisher_material
        source_body_summary_ru: >-
          Работа различает рыночную сегментацию и продуктовую дифференциацию как самостоятельные
          стратегические способы согласования предложения с неоднородным спросом. Для текущей задачи это
          означает, что единая формула позиционирования не должна механически подменять различия сегментов и ролей.
        supports_claims: [POS-CLM-04-segmentation_separate_from_differentiation, POS-CLM-05-universal_message_requires_testing]
        limitations: historic_general_marketing_framework_not_direct_evidence_of_current_Russian_legal_information_market
      - source_id: SRC-WEBSTER-WIND-1972
        title: A General Model for Understanding Organizational Buying Behavior
        authors: [Frederick E. Webster Jr., Yoram Wind]
        year: 1972
        source_type: peer_reviewed_B2B_marketing_article
        doi: 10.1177/002224297203600204
        stable_locator: https://doi.org/10.1177/002224297203600204
        body_capture_mode: paraphrased_from_publisher_abstract
        source_body_summary_ru: >-
          Промышленная и институциональная покупка рассматривается как организационный процесс принятия
          решений, а не как изолированный выбор одного пользователя. Следовательно, пользователь, владелец
          функции, экономический заказчик и технический участник могут иметь разные критерии ценности и выбора.
        supports_claims: [POS-CLM-06-B2B_buying_is_organizational, POS-CLM-07-role_specific_value_and_criteria_needed]
        limitations: general_B2B_model_not_empirical_map_of_ConsultantPlus_buying_centers
      - source_id: SRC-BETTMAN-LUCE-PAYNE-1998
        title: Constructive Consumer Choice Processes
        authors: [James R. Bettman, Mary Frances Luce, John W. Payne]
        year: 1998
        source_type: peer_reviewed_consumer_decision_review
        doi: 10.1086/209535
        stable_locator: https://doi.org/10.1086/209535
        body_capture_mode: paraphrased_from_public_abstract
        source_body_summary_ru: >-
          Предпочтения нередко не существуют заранее в полностью определенном виде, а формируются в
          зависимости от задачи выбора и ограничений обработки информации. Поэтому исследование
          позиционирования должно опираться не только на прямой вопрос «что для вас важно», но и на
          конкретный контекст, альтернативы, критерии и эпизод принятия решения.
        supports_claims: [POS-CLM-08-preferences_can_be_constructed, POS-CLM-09-contextual_episode_over_abstract_preference_only]
        limitations: consumer_choice_review_not_direct_B2B_ConsultantPlus_effect_evidence
      - source_id: SRC-CPLUS-OFFICIAL-ABOUT-20260907
        title: Компания «КонсультантПлюс» — официальная страница о компании и продуктах
        source_type: official_product_source
        stable_locator: https://www.consultant.ru/about/
        accessed_at: '2026-09-07'
        body_capture_mode: paraphrased_from_official_page
        source_body_summary_ru: >-
          Официальная страница определяет КонсультантПлюс как справочную правовую систему, содержащую
          федеральное и региональное законодательство, судебную практику, фирменные аналитические материалы,
          консультации, комментарии и другие информационные банки. Это надежное свидетельство текущей
          продуктовой категории и состава предложения, но не доказательство того, какое позиционирование
          сильнее воспринимается клиентом.
        supports_claims: [POS-CLM-10-current_category_is_legal_reference_system, POS-CLM-11-official_product_scope_is_broader_than_document_search]
        limitations: provider_self_description_not_customer_perception_evidence
      - source_id: SRC-CPLUS-OFFICIAL-PURCHASE-20260907
        title: Купить систему КонсультантПлюс — официальное описание возможностей и профессиональных профилей
        source_type: official_product_source
        stable_locator: https://www.consultant.ru/about/purchase/
        accessed_at: '2026-09-07'
        body_capture_mode: paraphrased_from_official_page
        source_body_summary_ru: >-
          Официальная страница покупки описывает готовые решения по профессиональным профилям, быстрый
          поиск, оперативное обновление, аналитику, судебную практику, конструкторы и иные инструменты.
          Формулировки связывают систему не только с нахождением документов, но и с пониманием того, как
          действовать в конкретной ситуации. Это поддерживает наличие нескольких правдоподобных территорий
          позиционирования, но не выбирает победителя между ними.
        supports_claims: [POS-CLM-12-current_message_contains_action_orientation, POS-CLM-13-role_profiles_are_existing_product_pattern, POS-CLM-14-multiple_positioning_territories_are_plausible]
        limitations: provider_owned_marketing_source_not_independent_customer_validation
      - source_id: SRC-CPLUS-RIC-PILOT-METHOD-REGISTER-V1
        title: Existing RIC pilot method source register
        source_type: process_owned_internal_source_register
        artifact_version_id: ARTVER-CPLUS-RIC-PILOT-METHOD-SOURCE-REGISTER-20260907-001-V1
        body_capture_mode: exact_process_owned_reference_no_duplication
        source_body_summary_ru: >-
          Существующая запись уже фиксирует Flanagan Critical Incident Technique, Klein Critical Decision
          Method, customer journey, service blueprinting, contribution analysis, evidence-based management и
          другие основания эпизодного исследования и дисциплины причинной атрибуции. Новый регистр не
          дублирует эти тела, а повторно использует exact ArtifactVersion.
        supports_claims: [POS-CLM-15-episode_reconstruction_has_method_basis, POS-CLM-16-contribution_must_be_separated, POS-CLM-17-evidence_strength_bounds_claim_strength]
        limitations: internal_source_synthesis_requires_subject_use_verification_for_new_positioning_context
  claim_catalog:
    POS-CLM-01-frame_required: конкурентная рамка или категория должна быть установлена до утверждения различий
    POS-CLM-02-parity_and_difference_both_required: позиционирование требует как точек паритета, так и точек различия
    POS-CLM-03-difference_must_be_relevant_and_believable: заявляемое отличие должно быть значимым и правдоподобным для целевой аудитории
    POS-CLM-04-segmentation_separate_from_differentiation: сегментация и дифференциация не являются одной и той же операцией
    POS-CLM-05-universal_message_requires_testing: единое ядро не отменяет необходимость проверки ролевых и сегментных вариантов
    POS-CLM-06-B2B_buying_is_organizational: выбор B2B-решения является организационным процессом
    POS-CLM-07-role_specific_value_and_criteria_needed: участники организационного выбора могут иметь разные критерии ценности и доказательства
    POS-CLM-08-preferences_can_be_constructed: предпочтения могут формироваться в контексте конкретной задачи выбора
    POS-CLM-09-contextual_episode_over_abstract_preference_only: контекст и конкретный эпизод должны дополнять прямые декларации предпочтений
    POS-CLM-10-current_category_is_legal_reference_system: официальная продуктовая категория КонсультантПлюс остается справочной правовой системой
    POS-CLM-11-official_product_scope_is_broader_than_document_search: официальный состав включает аналитику и профессиональные материалы помимо поиска документов
    POS-CLM-12-current_message_contains_action_orientation: официальные материалы уже содержат язык «понять, как действовать»
    POS-CLM-13-role_profiles_are_existing_product_pattern: профессиональные профили являются частью текущего продуктового представления
    POS-CLM-14-multiple_positioning_territories_are_plausible: из официального состава не следует единственная обязательная территория позиционирования
    POS-CLM-15-episode_reconstruction_has_method_basis: конкретный эпизод и реконструкция решения имеют отдельное методическое основание
    POS-CLM-16-contribution_must_be_separated: вклад КонсультантПлюс, РИЦ, клиента и иных источников следует кодировать раздельно
    POS-CLM-17-evidence_strength_bounds_claim_strength: сила позиционирующего обещания не должна превышать силу доказательств
  distribution_record_and_security_classification:
    intended_users: [TECH-BMA, TM-MEAS, TECH-VER, owner, RIC positioning authors]
    distribution_status: internal_engineering_source_register
    security_classification: public_and_process_owned_non_secret_sources_only
