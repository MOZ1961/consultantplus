scope: >-
  Методические и предметные источники, необходимые для перехода от одной decision-centric гипотезы к
  сравнительной модели позиционирования: сегменты и роли, ситуация выбора, конкурентная категория,
  реальные альтернативы, points of parity, points of difference, reason to believe, язык ценности,
  вклад КонсультантПлюс и вклад РИЦ, а также доказательные границы.
