artifact_instance_purpose: >-
  Зафиксировать управляемую доказательную базу методики позиционирования КонсультантПлюс для РИЦ:
  источники по сегментации, конкурентной рамке, точкам паритета и различия, организационному B2B-выбору,
  конструктивному формированию предпочтений, эпизодному исследованию и текущему официальному описанию
  КонсультантПлюс. Для каждого источника сохранить устойчивый локатор, проверяемую парафразу поддерживаемого
  содержания, применимые суждения и ограничения, не превращая внешний защищенный текст в параллельный мастер-источник.
