artifact_instance_purpose: >-
  Зафиксировать устойчивое определение состава пилотного пакета информационных продуктов для РИЦ.
  Пакет является управляемой совокупностью существующих process-owned продуктов и не создает новый
  canonical O. Эта версия является upstream-определением состава: Предложение, внутренний План и
  верификация пакетной модели должны ссылаться на нее, а не образовывать циклическую зависимость версий.
