date_and_status: {date: '2026-09-06', status: package_definition_not_executed_not_delivered}
scope: >-
  Один пилотный пакет продуктов для РИЦ по одному обезличенному сервисному эпизоду. Определяет состав,
  назначение, обязательность и видимость продуктов; не означает фактическое создание результатов по
  реальному эпизоду, внешнюю выдачу, принятие РИЦ или коммерческий статус услуги.
subject_or_category: RIC recipient product package definition
issuing_organization: owner-authorized engineering environment
