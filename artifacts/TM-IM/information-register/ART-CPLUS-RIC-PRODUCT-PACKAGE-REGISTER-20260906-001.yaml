schema_version: se.process_artifact.v1
record_kind: process_artifact_instance
artifact_instance_id: ART-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001
artifact_version_id: ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001-V2
supersedes_artifact_version_id: ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001-V1
artifact_label: information register
project_contour: client_system_consultantplus
lifecycle_status: owner_directed_candidate_package_definition_subject_verified
acceptance_status: package_model_defined_subject_verified_external_issue_and_RIC_acceptance_separate
artifact_instance_purpose: >-
  Зафиксировать как process-owned информационный продукт состав пакета продуктов, который инженерная
  среда предлагает поставить РИЦ в пилоте E0/S01. Пакет является агрегированным представлением
  нескольких канонических информационных продуктов и не создает нового canonical O. Реестр разделяет
  продукты ценности для РИЦ, преддоговорную/передаточную оболочку и внутренние продукты производства,
  а также связывает точные версии Предложения, внутреннего Плана и предметной верификации пакетной модели.
producer:
  process_type_id: TM-IM
  process_instance_id: PI-CPLUS-TM-IM-RIC-PRODUCT-PACKAGE-20260906-001
  activity_instance_id: AI-CPLUS-TM-IM-DEFINE-RIC-PRODUCT-PACKAGE-20260906-001
  methodic_instance:
    methodic_id: METH-CPLUS-TM-IM-PRODUCT-PACKAGE-COMPOSITION
    methodic_version_id: METHVER-CPLUS-TM-IM-PRODUCT-PACKAGE-COMPOSITION-V1
    methodic_version: runtime-provisional-v1
    status: provisional_runtime_not_adopted
request_operation_ref:
  repository: MOZ1961/se
  process_type_id: TECH-OP
  process_instance_id: PI-SE-TECH-OP-CPLUS-RIC-PRODUCT-PACKAGE-20260906-001
  required_output_label: operation report
interface_binding_ref:
  repository: MOZ1961/consultantplus
  artifact_version_id: ARTVER-CPLUS-SE-INTERFACE-BINDING-20260904-001-V3
  binding_instance_id: BIND-CPLUS-SE-001
date_and_status: {date: '2026-09-06', status: candidate_package_definition_subject_verified_not_delivered}
scope: >-
  Один пилотный пакет продуктов для РИЦ по одному обезличенному сервисному эпизоду; определяет
  состав и видимость продуктов, но не означает фактическое создание результатов по реальному эпизоду,
  внешнюю выдачу, принятие РИЦ или коммерческий статус услуги.
subject_or_category: RIC recipient product package composition
issuing_organization: owner-authorized engineering environment
references:
  - ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-PROPOSAL-20260906-001-V2
  - ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-SEMP-20260906-001-V2
  - ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-COVER-LETTER-20260906-001-V1
  - ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-MODEL-VERIFICATION-REPORT-20260906-001-V1
  - ARTVER-CPLUS-BMA-PARTICIPANT-OFFER-INFORMATION-EXCHANGE-20260905-001-V1
body:
  information_status_and_version_description:
    package_id: RIC-PKG-E0-S01-001
    package_title_ru: Пилотный пакет продуктов «Диагностика клиентского случая РИЦ»
    package_version: V2
    package_state: defined_subject_verified_not_executed_not_delivered
    proposal_ref: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-PROPOSAL-20260906-001-V2
    internal_plan_ref: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-SEMP-20260906-001-V2
    package_model_verification_ref: ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-MODEL-VERIFICATION-REPORT-20260906-001-V1
    aggregation_rule: >-
      Пакет не является новым информационным элементом или canonical O. Его состав сохраняется в
      TM-IM → information register как управляемая совокупность существующих канонических продуктов.
      Каждый член пакета сохраняет собственного producer ProcessType, canonical O, нормативный состав,
      ArtifactInstance/ArtifactVersion и отдельный статус верификации/приемки.
    recipient_value_package:
      - member_id: RIC-PKG-E0-S01-RESULT-01
        information_product_name_ru: Отчет
        deliverable_title_ru: Отчет о диагностике клиентского сценария
        canonical_output: TECH-BMA → business or mission analysis report
        normative_basis: ГОСТ Р 58609-2019 §7.6 + §10.27
        status: planned_not_instantiated_real_episode_required
        inclusion: mandatory_after_real_execution
        recipient_purpose: >-
          Дать РИЦ основной содержательный результат: реконструкцию клиентской ситуации и решения,
          разделенный вклад КонсультантПлюс, сервиса РИЦ, клиента и иных источников, подтвержденные
          разрывы и явно неустановленные сведения.
        recipient_views_inside_product:
          - паспорт критичного сценария решения
          - карта покрытия сценария КонсультантПлюс и сервисом РИЦ
          - карта разрывов, задержек и обходных путей
      - member_id: RIC-PKG-E0-S01-RESULT-02
        information_product_name_ru: Отчет о верификации
        deliverable_title_ru: Отчет о верификации результата диагностики
        canonical_output: TECH-VER → verification report
        normative_basis: ГОСТ Р 58609-2019 §7.6 + §10.93
        status: planned_not_instantiated_real_episode_required
        inclusion: mandatory_after_real_execution
        recipient_purpose: >-
          Показать, что основной отчет проверен на трассируемость к исходным сведениям, полноту
          заявленного состава, разделение фактов/оценок/выводов и отсутствие недоказанных причинных,
          финансовых или правовых утверждений.
    pre_delivery_envelope:
      - member_id: RIC-PKG-E0-S01-PRE-01
        information_product_name_ru: Предложение
        canonical_output: AGR-SUP → supply response
        normative_basis: ГОСТ Р 58609-2019 §7.2 + §10.56
        exact_artifact_version_id: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-PROPOSAL-20260906-001-V2
        role: согласовать состав пакета, работы, участие РИЦ, срок, стоимость, риски и условия до исполнения
      - member_id: RIC-PKG-E0-S01-PRE-02
        information_product_name_ru: Запись
        canonical_output: AGR-SUP → supply records/artifacts
        normative_basis: ГОСТ Р 58609-2019 §9.1 + R9-CONFIGURATION
        exact_artifact_version_id: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-COVER-LETTER-20260906-001-V1
        role: управляемая запись предполагаемой передачи с человекочитаемым сопроводительным письмом
    internal_production_products_not_delivered_by_default:
      - information_product_name_ru: План
        canonical_output: TM-PLAN → SEMP
        normative_basis: ГОСТ Р 58609-2019 §7.3 + §10.55
        exact_artifact_version_id: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-SEMP-20260906-001-V2
        reason_not_delivered: полный внутренний план и WBS нужны среде для производства пакета, а не РИЦ для использования результата
      - information_product_name_ru: Запись
        canonical_output: TM-MEAS → measurement register
        normative_basis: ГОСТ Р 58609-2019 §9.1, specific profile отсутствует по exact crosswalk
        status: planned_not_instantiated_real_episode_required
        reason_not_delivered: исходная доказательная запись является внутренней основой анализа; РИЦ получает ее существенное содержание в основном отчете
      - information_product_name_ru: Отчет
        canonical_output: TECH-OP → operation report
        normative_basis: ГОСТ Р 58609-2019 §7.6
        status: request_level_internal_product
        reason_not_delivered: фиксирует исполнение инженерной среды и контур, а не ценность для РИЦ
      - information_product_name_ru: Отчет о верификации
        canonical_output: TECH-VER → verification report
        exact_artifact_version_id: ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-MODEL-VERIFICATION-REPORT-20260906-001-V1
        role: внутренняя проверка самой пакетной модели до реального пилота; не подменяет будущий recipient TECH-VER по реальному результату
    conditional_expansion_products:
      - condition: подтверждена повторяемость нескольких эпизодов и требуется количественный/агрегированный вывод
        information_product_name_ru: Отчет
        canonical_output: TM-MEAS → measurement report
        disposition: separate_future_package_version_or_proposal
      - condition: подтверждена необходимость изменить повторяемый порядок работы РИЦ
        information_product_name_ru: Процедура
        canonical_output: unresolved_until_exact_existing_ProcessType_O_resolution
        disposition: resolve_exact_ProcessType_and_O_before_inclusion; no orphan product
      - condition: подтверждена необходимость обучения по повторяемым сценариям
        information_product_name_ru: Описание
        canonical_output: TECH-IMP → training materials
        normative_basis: ГОСТ Р 58609-2019 §7.2 + §10.85
        disposition: separate_future_package_version_or_proposal
    physical_rendering_rule: >-
      Семантический пакет может быть выдан одним или несколькими файлами. Физическое объединение в один
      PDF/DOCX не объединяет канонические идентичности продуктов; каждое представление должно трассироваться
      к точным ArtifactVersion включенных продуктов.
  distribution_record_and_security_classification:
    intended_recipient_category: руководитель или уполномоченный сотрудник РИЦ КонсультантПлюс
    actual_recipient: not_established
    distribution_status: package_definition_internal_not_delivered
    recipient_visible_by_default: [RIC-PKG-E0-S01-RESULT-01, RIC-PKG-E0-S01-RESULT-02]
    pre_delivery_visible: [RIC-PKG-E0-S01-PRE-01, RIC-PKG-E0-S01-PRE-02]
    internal_only_by_default: [TM-PLAN → SEMP, TM-MEAS → measurement register, TECH-OP → operation report, package-model TECH-VER, full internal verification controls]
    security_classification: de_identified_minimum_information_only_for_pilot
    rule: внешний пакет не должен включать внутренние продукты только потому, что они участвовали в производстве
record_identifier: ART-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001-V2
owner_product_request:
  exact_visible_text: 'меняй и приступай'
  request_specific_requirements:
    - изменить назначение диалога с предложений как главного объекта на нормативные пакеты информационных продуктов для РИЦ
    - пакет должен состоять из реальных продуктов процессов по ГОСТ, а не из псевдопродуктов-карт или услуг
    - Предложение должно описывать состав пакета и структуру работ по его производству
    - полный внутренний План и WBS остаются внутри инженерной среды
    - РИЦ получает только продукты, имеющие для него самостоятельную ценность или подтверждающие качество результата
    - пакетная модель должна иметь отдельную предметную верификацию до реального пилота
