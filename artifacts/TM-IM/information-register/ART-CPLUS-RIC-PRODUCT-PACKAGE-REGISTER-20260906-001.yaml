  - ARTVER-CPLUS-OFFER-EXECUTION-SYSTEM-REQUIREMENTS-20260905-001-V2
  - ARTVER-CPLUS-OFFER-EXECUTION-ARCHITECTURE-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-DESIGN-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-IMPLEMENTATION-PROCEDURE-20260905-001-V1
body:
  information_status_and_version_description:
    package_id: RIC-PKG-E0-S01-001
    package_title_ru: Пилотный пакет продуктов «Диагностика клиентского случая РИЦ»
    package_version: V3
    package_state: defined_not_executed_not_delivered
    aggregation_rule: >-
      Пакет не является новым информационным элементом или canonical O. Его состав сохраняется в
      TM-IM → information register как управляемая совокупность существующих канонических продуктов.
      Каждый член пакета сохраняет собственного producer ProcessType, canonical O, нормативный состав,
      ArtifactInstance/ArtifactVersion и отдельный статус верификации/приемки.
    dependency_direction_rule: >-
      Эта Запись определяет состав пакета до формирования Proposal/SEMP/verification products. Downstream
      продукты ссылаются на эту exact версию. Реальный прогон создает successor package-register version,
      в которой planned member identities заменяются/дополняются точными ArtifactVersion результатов.
    recipient_value_package:
      - member_id: RIC-PKG-E0-S01-RESULT-01
        information_product_name_ru: Отчет
        deliverable_title_ru: Отчет о диагностике клиентского сценария
        canonical_output: TECH-BMA → business or mission analysis report
        normative_basis: ГОСТ Р 58609-2019 §7.6 + §10.27
        status: planned_not_instantiated_real_episode_required
        inclusion: mandatory_after_real_execution
        recipient_purpose: >-
          Дать РИЦ основной содержательный результат: реконструкцию клиентской ситуации и решения,
          разделенный вклад КонсультантПлюс, сервиса РИЦ, клиента и иных источников, подтвержденные
          разрывы и явно неустановленные сведения.
        recipient_views_inside_product:
          - паспорт критичного сценария решения
          - карта покрытия сценария КонсультантПлюс и сервисом РИЦ
          - карта разрывов, задержек и обходных путей
      - member_id: RIC-PKG-E0-S01-RESULT-02
        information_product_name_ru: Отчет о верификации
        deliverable_title_ru: Отчет о верификации результата диагностики
        canonical_output: TECH-VER → verification report
        normative_basis: ГОСТ Р 58609-2019 §7.6 + §10.93
        status: planned_not_instantiated_real_episode_required
        inclusion: mandatory_after_real_execution
        recipient_purpose: >-
          Показать, что основной отчет проверен на трассируемость к исходным сведениям, полноту
          заявленного состава, разделение фактов/оценок/выводов и отсутствие недоказанных причинных,
          финансовых или правовых утверждений.
    pre_delivery_envelope_definition:
      proposal:
        information_product_name_ru: Предложение
        canonical_output: AGR-SUP → supply response
        normative_basis: ГОСТ Р 58609-2019 §7.2 + §10.56
        role: согласовать состав пакета, работы, участие РИЦ, срок, стоимость, риски и условия до исполнения
      transmittal:
        information_product_name_ru: Запись
        canonical_output: AGR-SUP → supply records/artifacts
        normative_basis: ГОСТ Р 58609-2019 §9.1 + R9-CONFIGURATION
        role: зафиксировать фактическую/предполагаемую передачу и дать человекочитаемое сопроводительное письмо
    internal_production_products_not_delivered_by_default:
      - {information_product_name_ru: План, canonical_output: 'TM-PLAN → SEMP', normative_basis: 'ГОСТ Р 58609-2019 §7.3 + §10.55', reason_not_delivered: 'полный внутренний план и WBS нужны среде для производства пакета'}
      - {information_product_name_ru: Запись, canonical_output: 'TM-MEAS → measurement register', normative_basis: 'ГОСТ Р 58609-2019 §9.1; specific profile отсутствует по exact crosswalk', reason_not_delivered: 'исходная доказательная запись является внутренней основой анализа'}
      - {information_product_name_ru: Отчет, canonical_output: 'TECH-OP → operation report', normative_basis: 'ГОСТ Р 58609-2019 §7.6', reason_not_delivered: 'фиксирует исполнение инженерной среды, а не ценность для РИЦ'}
    conditional_expansion_products:
      - condition: подтверждена повторяемость нескольких эпизодов и требуется агрегированный измерительный вывод
        information_product_name_ru: Отчет
        canonical_output: TM-MEAS → measurement report
        disposition: separate_future_package_version_or_proposal
      - condition: подтверждена необходимость изменить повторяемый порядок работы РИЦ
        information_product_name_ru: Процедура
        canonical_output: unresolved_until_exact_existing_ProcessType_O_resolution
        disposition: resolve_exact_ProcessType_and_O_before_inclusion; no orphan product
      - condition: подтверждена необходимость обучения по повторяемым сценариям
        information_product_name_ru: Описание
        canonical_output: TECH-IMP → training materials
        normative_basis: ГОСТ Р 58609-2019 §7.2 + §10.85
        disposition: separate_future_package_version_or_proposal
    package_completion_rule: >-
      Пакет результата считается сформированным только когда оба mandatory recipient members созданы как
      exact process-owned ArtifactVersion, основной Отчет прошел предметную TECH-VER, а successor этой
      Записи фиксирует точные версии и статус выдачи. Наличие внутренних продуктов не означает комплектность
      внешнего пакета.
    physical_rendering_rule: >-
      Пакет может быть выдан одним или несколькими файлами. Физическое объединение в один PDF/DOCX не
      объединяет канонические идентичности продуктов; каждое представление трассируется к exact ArtifactVersion.
  distribution_record_and_security_classification:
    intended_recipient_category: руководитель или уполномоченный сотрудник РИЦ КонсультантПлюс
    actual_recipient: not_established
    distribution_status: package_definition_internal_not_delivered
    recipient_visible_by_default: [RIC-PKG-E0-S01-RESULT-01, RIC-PKG-E0-S01-RESULT-02]
    pre_delivery_visible: [Предложение, сопроводительное письмо]
    internal_only_by_default: [TM-PLAN → SEMP, TM-MEAS → measurement register, TECH-OP → operation report, package-model verification internals]
    security_classification: de_identified_minimum_information_only_for_pilot
    rule: внешний пакет не включает внутренние продукты только потому, что они участвовали в производстве
