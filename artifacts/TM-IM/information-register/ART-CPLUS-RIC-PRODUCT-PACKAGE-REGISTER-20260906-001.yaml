owner_product_request:
  exact_visible_text: 'меняй и приступай'
  request_specific_requirements:
    - изменить назначение диалога на выработку и поставку нормативных пакетов информационных продуктов для РИЦ
    - пакет должен состоять из реальных продуктов процессов по ГОСТ, а не из псевдопродуктов-карт или услуг
    - Предложение должно описывать состав пакета и структуру работ по его производству
    - полный внутренний План и WBS остаются внутри инженерной среды
    - РИЦ получает только продукты, имеющие для него самостоятельную ценность или подтверждающие качество результата
    - package register должен быть устойчивым upstream-определением, исключающим циклическую exact-version зависимость
