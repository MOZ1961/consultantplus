  methodic_instance: {methodic_id: METH-CPLUS-TECH-VAL-RIC-DIAGNOSTIC, methodic_version_id: METHVER-CPLUS-TECH-VAL-RIC-DIAGNOSTIC-V1, methodic_version: real_use_validation_v1, status: provisional_runtime_not_adopted}
