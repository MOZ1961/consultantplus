artifact_instance_purpose: >-
  Определить, как после реального использования проверить пригодность продукта «Диагностика клиентского случая РИЦ»
  для намеченного применения в конкретном РИЦ. Валидация должна проверять фактологическую пригодность и поддержку
  управленческого решения РИЦ, а не подменяться структурной верификацией, положительной оценкой пользователя или
  недоказанным финансовым/сетевым эффектом.
