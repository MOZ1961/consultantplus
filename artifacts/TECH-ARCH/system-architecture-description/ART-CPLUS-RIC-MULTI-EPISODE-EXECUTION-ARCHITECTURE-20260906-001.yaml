context:
  architecture_problem: E0/S01 handles one episode, but RIC E3 semantics require governed aggregation of several episodes into reusable scenarios and structured feedback.
  architecture_scope: one bounded RIC episode set, S02/S03/S04/S07 and E3 semantics only; E4 and external Proposal-package work are excluded.
  constraints:
    - reuse the existing E0/S01 episode path instead of duplicating its intake semantics
    - no RIC account becomes direct client evidence
    - aggregation must retain exact membership and source-field trace
    - D08 and D09 remain views of existing canonical products
    - participant-facing rendering is derived only from exact verified ArtifactVersions
    - client semantic persistence remains in MOZ1961/consultantplus
  designation: CPLUS-RIC-MULTI-EPISODE-EXECUTION-ARCH-V1
body:
  fundamental_concept:
    purpose: compose several verified or verifiable E0/S01 episode packets into a bounded RIC scenario-and-feedback result.
    qualities: [traceable, sample-bounded, evidence-preserving, authority-preserving, reusable, replayable, fail-visible]
    architecture_decisions:
      - {id: AD-RICX-01, decision: each real episode is first persisted through TM-MEAS measurement register using the E0/S01 field/evidence rules, rationale: episode truth and aggregation must stay separable}
      - {id: AD-RICX-02, decision: aggregation owns no new pseudo-product; D08 is a view of TECH-BMA life cycle concepts, rationale: current product alignment already resolves D08 to that canonical O}
      - {id: AD-RICX-03, decision: D09 is a view of TM-MEAS measurement report, rationale: structured feedback is measured cross-episode evidence and current alignment resolves it there}
      - {id: AD-RICX-04, decision: every scenario/gap cluster stores exact episode membership and grouping basis, rationale: recurrence and synthesis must be auditable}
      - {id: AD-RICX-05, decision: observed recurrence is sample count only, rationale: bounded RIC episodes do not establish population prevalence}
      - {id: AD-RICX-06, decision: training materials are conditional TECH-IMP outputs only when separately produced, rationale: candidate improvement is not automatically a delivered training artifact}
      - {id: AD-RICX-07, decision: TECH-VER gates participant-facing aggregate delivery, rationale: cross-episode synthesis introduces additional overclaim and evidence-class risks}
      - {id: AD-RICX-08, decision: parallel Proposal-package PR is not a runtime dependency of this internal capability, rationale: owner explicitly separated the workstreams}
  stakeholders_and_concerns:
    - {stakeholder: RIC participant, concerns: [minimal data burden, useful reusable scenarios, confidentiality, accurate representation of service contribution]}
    - {stakeholder: RIC manager, concerns: [repeatable patterns, service gaps, training opportunities, non-anecdotal feedback]}
    - {stakeholder: owner, concerns: [independent progress toward practical delivery, evidence accumulation, no hidden dependency on proposal formatting]}
    - {stakeholder: verifier, concerns: [episode membership trace, sample-bound recurrence, evidence-class preservation, product routing]}
    - {stakeholder: Network recipient, concerns: [structured evidence rather than unqualified wishes, no automatic requirement promotion]}
  viewpoints:
    - {id: VP-RICX-FLOW, purpose: episode set to verified D08/D09, procedure: inspect stage ownership and canonical product flow}
    - {id: VP-RICX-EVIDENCE, purpose: preserve evidence class from source episode through cluster and feedback, procedure: follow episode IDs and field-level traces}
    - {id: VP-RICX-SAMPLE, purpose: distinguish observed recurrence from prevalence, procedure: inspect denominator and wording of every aggregate claim}
    - {id: VP-RICX-AUTHORITY, purpose: preserve client and external-communication authority, procedure: inspect BIND-CPLUS-SE-001 and delivery state}
    - {id: VP-RICX-REPLAY, purpose: reconstruct aggregate result, procedure: replay exact input episode ArtifactVersions plus grouping rules}
  views:
    end_to_end_flow:
      - {stage: authorize_and_bound_set, owner: TECH-OP, result: one RIC execution request with 3-5 episode scope}
      - {stage: episode_intake_and_persistence, owner: TM-MEAS, result: one measurement-register record per real episode}
      - {stage: normalize_and_compare, owner: TECH-BMA_and_TM-MEAS, result: comparable dimensions retaining source wording and evidence classes}
      - {stage: synthesize_scenarios, owner: TECH-BMA, result: life cycle concepts containing D08 scenario-library view}
      - {stage: synthesize_feedback, owner: TM-MEAS, result: measurement report containing D09 structured-feedback view}
      - {stage: optionally_prepare_training, owner: TECH-IMP, result: training materials only when separately authorized and produced}
      - {stage: verify, owner: TECH-VER, result: exact-version aggregate verification report}
      - {stage: deliver_and_record, owner: TECH-OP, result: derived human-readable rendering and operation report}
      - {stage: retain_and_improve, owner: TM-MEAS_and_TECH-BMA, result: evidence for later improvement without automatic requirement promotion}
    canonical_product_ownership:
      per_episode_evidence: TM-MEAS -> measurement register
      scenario_library: TECH-BMA -> life cycle concepts
      structured_feedback: TM-MEAS -> measurement report
      optional_training_output: TECH-IMP -> training materials
      verification: TECH-VER -> verification report
      request_execution: TECH-OP -> operation report
    aggregation_information_flow:
      source_unit: exact episode ID plus E0/S01 fields and evidence classes
      comparable_dimensions: [client_problem_or_decision, trigger, information_path, ConsultantPlus_contribution, RIC_intervention, final_status, remaining_gap, workaround_or_handoff]
      cluster_record: [cluster_id, grouping_basis, member_episode_ids, observed_count, evidence_class_summary, unresolved_variation]
      D08_fields: [scenario_id, client_problem_or_decision, typical_trigger_within_sample, evidence_path, ConsultantPlus_contribution, RIC_contribution, participant_action, member_episode_ids, limitations]
      D09_fields: [feedback_id, scenario_id, required_decision, gap, workaround, observed_recurrence_count, bounded_sample_size, criticality_basis, evidence_classes, member_episode_ids, candidate_response_type]
      forbidden_default_inference: [Network_wide_prevalence, client_population_prevalence, ROI, avoided_loss, causal_risk_reduction, legal_correctness]
    delivery_boundary:
      canonical_results: [exact TECH-BMA life cycle concepts ArtifactVersion, exact TM-MEAS measurement report ArtifactVersion, optional exact TECH-IMP training materials ArtifactVersion]
      participant_view: derived rendering only after TECH-VER
      external_contact_authority: separate owner authority
      commercial_status: not established by this capability
      proposal_package_dependency: none for internal engineering execution
  requirements_traceability:
    SR-RICX-01: [views.end_to_end_flow]
    SR-RICX-02: [AD-RICX-01, views.aggregation_information_flow.source_unit]
    SR-RICX-03: [views.aggregation_information_flow.source_unit]
    SR-RICX-04: [VP-RICX-EVIDENCE, views.aggregation_information_flow]
    SR-RICX-05: [AD-RICX-01, views.canonical_product_ownership]
    SR-RICX-06: [views.aggregation_information_flow.comparable_dimensions]
    SR-RICX-07: [AD-RICX-04, views.aggregation_information_flow.cluster_record]
    SR-RICX-08: [AD-RICX-05, VP-RICX-SAMPLE]
    SR-RICX-09: [AD-RICX-02, views.canonical_product_ownership, views.aggregation_information_flow.D08_fields]
    SR-RICX-10: [AD-RICX-03, views.canonical_product_ownership, views.aggregation_information_flow.D09_fields]
    SR-RICX-11: [views.end_to_end_flow.retain_and_improve]
    SR-RICX-12: [AD-RICX-06, views.canonical_product_ownership.optional_training_output]
    SR-RICX-13: [AD-RICX-07, views.end_to_end_flow]
    SR-RICX-14: [views.delivery_boundary]
    SR-RICX-15: [views.canonical_product_ownership.request_execution]
    SR-RICX-16: [VP-RICX-AUTHORITY, interface_binding_ref]
    SR-RICX-17: [AD-RICX-08, views.delivery_boundary.proposal_package_dependency]
    SR-RICX-18: [VP-RICX-REPLAY, stage: verify]
    SR-RICX-19: [context.architecture_scope]
  partitioning_principles:
    - per-episode evidence acquisition remains separate from cross-episode synthesis
    - scenario synthesis and measurement synthesis use separate canonical owners
    - candidate service/training actions remain separate from actually produced training materials
    - analysis remains separate from verification
    - canonical persistence remains separate from participant rendering
    - internal execution remains separate from external commercial/proposal authority
  important_elements_and_relations:
    - {element: EpisodeEvidence, type: TM-MEAS_measurement_register, relation: many-to-one input to bounded aggregation}
    - {element: ScenarioCluster, type: structured content inside TECH-BMA life cycle concepts, relation: lists exact member episode IDs}
    - {element: ScenarioLibrary, type: D08 derived view, relation: rendered from exact TECH-BMA life cycle concepts}
    - {element: FeedbackSynthesis, type: D09 derived view, relation: rendered from exact TM-MEAS measurement report}
    - {element: AggregateVerifier, type: TECH-VER process, relation: checks sample bounds, evidence classes, traces and prohibited claims}
    - {element: RequestExecution, type: TECH-OP operation report, relation: records actual run and delivery state}
    - {element: ParallelProposalTrack, type: concurrent configuration work, relation: explicitly not a runtime dependency}
  architecture_significant_requirement_satisfaction:
    - all aggregate conclusions retain exact source episode membership
    - sample-bounded recurrence cannot silently become prevalence
    - D08 and D09 resolve to existing canonical outputs
    - no new persistent semantic carrier is introduced
    - E0/S01 rules are reused rather than duplicated inconsistently
    - external proposal/commercial authority is independent from internal capability construction
summary:
  conclusion: architecture resolves the multi-episode RIC execution path without touching the parallel Proposal-package work and without adding a new canonical O.
  remaining_gap: exact design, implementation procedure and synthetic multi-episode TECH-VER are required before E3/S02/S03/S04/S07 operational capability may be claimed.
glossary:
  EpisodeEvidence: de-identified process-owned evidence for one RIC service episode
  ScenarioCluster: bounded grouping of comparable episodes with explicit grouping basis and exact membership
  observed_recurrence: count inside the supplied bounded episode set, not population prevalence
  D08: scenario-library view of TECH-BMA life cycle concepts
  D09: structured-feedback view of TM-MEAS measurement report
  ParallelProposalTrack: separate concurrent workstream producing external Proposal/work-structure/cover-letter package
