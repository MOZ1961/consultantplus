artifact_instance_purpose: >-
  Определить архитектуру внутренней многоэпизодной способности РИЦ поверх уже верифицированного E0/S01:
  каждый эпизод проходит существующий односценарный контур, затем измерительные и аналитические продукты
  агрегируются в D08/D09 с сохранением episode-level evidence trace, без зависимости от параллельно формируемого
  внешнего пакета Предложения и без переноса authority из MOZ1961/consultantplus.
