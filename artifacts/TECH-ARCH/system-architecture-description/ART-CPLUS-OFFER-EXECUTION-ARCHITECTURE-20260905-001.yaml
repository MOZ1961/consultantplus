artifact_instance_purpose: >-
  Определить архитектуру минимальной E0/S01 способности исполнения предложений участникам: разделить прием
  и минимизацию входа, доказательную запись, аналитическое преобразование, предметную верификацию, выдачу
  производного результата и накопление доказательств так, чтобы все долговременное состояние оставалось
  process-owned в MOZ1961/consultantplus и не возникал новый неуправляемый семантический носитель.
