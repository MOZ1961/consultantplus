artifact_instance_purpose: >-
  Задать системные требования к расширению уже верифицированной минимальной E0/S01 способности
  до внутреннего многоэпизодного контура РИЦ: принять 3-5 обезличенных сервисных эпизодов,
  нормализовать и сопоставить их без смешения доказательных классов, сформировать библиотеку
  повторяемых сценариев и структурированную обратную связь, верифицировать результат и накопить
  доказательства для последующего улучшения. Формирование конкретного внешнего Предложения,
  структуры работ и сопроводительного письма исключено из этого продукта и выполняется параллельно.
