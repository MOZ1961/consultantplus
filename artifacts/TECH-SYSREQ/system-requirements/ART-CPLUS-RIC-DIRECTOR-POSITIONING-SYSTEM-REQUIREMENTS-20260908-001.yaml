  Установить проверяемые системные требования к директорскому продукту РИЦ по позиционированию
  КонсультантПлюс, преобразовав уже определенные по контуру ГОСТ потребности заинтересованных сторон
  в требования к продукту и применив полный профиль качества INCOSE Guide to Writing Requirements:
  характеристики C1-C15, атрибуты A1-A49 и правила R1-R42 с явной применимостью и трассируемостью.
