      A1-A49 и R1-R42. INCOSE не заменяет нормативный ГОСТ-контур и не является runtime authority.

body:
  transformation_basis:
    source_process: TECH-STK
    target_process: TECH-SYSREQ
    source_artifact_version_id: ARTVER-CPLUS-RIC-POSITIONING-PREMEASUREMENT-STAKEHOLDER-NEEDS-20260908-001-V1
    target_entity: director-facing RIC positioning information product
    transformation_rule: >-
      Каждое требование должно быть трассируемо к одной или нескольким зафиксированным потребностям
      или ограничениям, иметь проверяемый критерий и не усиливать уровень доказательности источника.

  requirements:
    - id: SR-CPLUS-RIC-DIR-POS-001
      statement: >-
        Продукт должен обеспечивать директору РИЦ возможность принять решение о целесообразности
        проверки предлагаемого позиционирования на реальных клиентских и сервисных эпизодах.
      rationale: Директорский продукт должен поддерживать конкретное управленческое решение.
      source_trace: [N-CPLUS-PM-01, N-CPLUS-PM-02]
      verification: inspection; explicit director decision and proceed/stop gate are present

    - id: SR-CPLUS-RIC-DIR-POS-002
      statement: >-
        Продукт должен представлять ценность КонсультантПлюс через профессиональные ситуации клиента,
        принимаемые клиентом решения и результаты, необходимые клиенту для выполнения работы.
      rationale: Перечень возможностей СПС сам по себе не устанавливает клиентскую ценность.
      source_trace: [N-CPLUS-PM-02, N-CPLUS-PM-07]
      verification: inspection; value statements are anchored to situation, decision and required result

    - id: SR-CPLUS-RIC-DIR-POS-003
      statement: >-
        Для каждого рассматриваемого клиентского эпизода продукт должен устанавливать связь между
        профессиональной ситуацией клиента, требуемым решением, информационным путем, вкладом
        КонсультантПлюс, вкладом РИЦ и наблюдаемым результатом.
      rationale: Цепочка позволяет проверять происхождение заявленной ценности.
      source_trace: [N-CPLUS-PM-02, N-CPLUS-PM-07, N-CPLUS-PM-08]
      verification: trace audit of every material client episode

    - id: SR-CPLUS-RIC-DIR-POS-004
      statement: Продукт должен представлять вклад КонсультантПлюс и вклад РИЦ раздельно.
      rationale: Нельзя приписывать одной стороне эффект другой стороны.
      source_trace: [N-CPLUS-PM-08]
      verification: inspection; separate contribution fields or explicit not_established value are present

    - id: SR-CPLUS-RIC-DIR-POS-005
      statement: >-
        Продукт должен различать результаты, обеспечиваемые возможностями КонсультантПлюс, результаты
        сервисного воздействия РИЦ и результаты, зависящие от действий клиента или иных участников.
      rationale: Разделение причинных вкладов ограничивает необоснованное присвоение эффекта продукту или сервису.
      source_trace: [N-CPLUS-PM-04, N-CPLUS-PM-08]
      verification: attribution-boundary inspection across all material claims

    - id: SR-CPLUS-RIC-DIR-POS-006
      statement: >-
        Для каждого существенного утверждения о клиентской ценности продукт должен указывать основание
        утверждения, класс свидетельства, границу доказательности, статус подтверждения и следующую
        требуемую проверку.
      rationale: Позиционирование должно оставаться проверяемым и управляемым.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-04]
      verification: trace audit of all material claims

    - id: SR-CPLUS-RIC-DIR-POS-007
      statement: >-
        Продукт должен обозначать как непроверенную гипотезу утверждение о конечном клиентском или
        организационном эффекте, если для него отсутствуют достаточные эмпирические свидетельства.
      rationale: Статус утверждения должен соответствовать силе имеющегося свидетельства.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-09]
      verification: adversarial review of effect claims and evidence statuses

    - id: SR-CPLUS-RIC-DIR-POS-008
      statement: >-
        Продукт не должен представлять экономию, предотвращенные потери или штрафы, снижение риска,
        повышение эффективности либо иной причинный эффект как установленный результат исключительно
        на основании наличия или использования возможностей КонсультантПлюс либо действий РИЦ.
      rationale: Экономический и причинный эффект требует отдельного эмпирического основания.
      source_trace: [N-CPLUS-PM-09]
      verification: adversarial text review for unsupported causal or economic claims

    - id: SR-CPLUS-RIC-DIR-POS-009
      statement: >-
        Продукт должен явно обозначать предлагаемое позиционирование как кандидатную формулировку до
        получения полномочий на ее принятие в качестве официального позиционирования Сети КонсультантПлюс.
      rationale: Инженерный кандидат не равен принятой позиции Сети.
      source_trace: [N-CPLUS-PM-01, N-CPLUS-PM-06]
      verification: inspection of status and authority statements

    - id: SR-CPLUS-RIC-DIR-POS-010
      statement: >-
        Продукт должен позволять начать эмпирическую проверку позиционирования с одного обезличенного
        фактического клиентского или сервисного эпизода.
      rationale: Первый шаг должен дешево проверять полезность модели до масштабирования.
      source_trace: [N-CPLUS-PM-02]
      verification: inspection; one-episode test gate and requested evidence are explicit

    - id: SR-CPLUS-RIC-DIR-POS-011
      statement: >-
        Продукт должен предусматривать проверку повторяемости выявленных связей и результатов на
        нескольких независимых эпизодах до решения об их использовании как устойчивой модели позиционирования.
      rationale: Повторяемость нельзя выводить из единичного случая.
      source_trace: [N-CPLUS-PM-05]
      verification: inspection against multi-episode measurement plan; target sample is three to five episodes

    - id: SR-CPLUS-RIC-DIR-POS-012
      statement: >-
        Продукт должен различать меры эффективности достижения требуемого клиентского эффекта, меры
        результативности продукта или сервиса, технические показатели функционирования и показатели
        продвижения к требуемому результату соответственно MoE, MoP, TPM и MoS, когда соответствующий
        класс измерения применим.
      rationale: Показатели разных уровней не должны подменять друг друга.
      source_trace: [N-CPLUS-PM-02, N-CPLUS-PM-03]
      verification: metric taxonomy audit; MoE, MoP, TPM and MoS are classified by decision use and not conflated

    - id: SR-CPLUS-RIC-DIR-POS-013
      statement: >-
        Для каждой применяемой меры продукт должен определять измеряемый объект, показатель, способ
        получения данных, критерий оценки и решение, для поддержки которого используется результат измерения.
      rationale: Метрика полезна только при определенных объекте, данных, критерии и управленческом применении.
      source_trace: [N-CPLUS-PM-02, N-CPLUS-PM-03]
      verification: measurement-definition inspection for every used measure

    - id: SR-CPLUS-RIC-DIR-POS-014
      statement: >-
        Если директорское решение требует экономической оценки, продукт должен обеспечивать расчет ROI
        как отдельной экономической меры с явным указанием периода расчета, полного состава учитываемых
        затрат, состава монетизируемых выгод и формулы расчета.
      rationale: ROI является отношением экономического эффекта к инвестициям и не должен смешиваться с MoE, MoP, TPM или MoS.
      source_trace: [N-CPLUS-PM-02, N-CPLUS-PM-09]
      verification: inspection; ROI record contains period, cost basis, benefit basis and explicit formula

    - id: SR-CPLUS-RIC-DIR-POS-015
      statement: >-
        Для каждого значения ROI продукт должен указывать источники исходных данных, границу атрибуции
        выгод КонсультантПлюс и РИЦ, допущения, неопределенность и статус установленности результата.
      rationale: Числовой ROI без границы атрибуции и качества исходных данных создает ложную точность.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-04, N-CPLUS-PM-09]
      verification: ROI evidence audit; unsupported inputs or attribution produce hypothesis/not_established status

    - id: SR-CPLUS-RIC-DIR-POS-016
      statement: >-
        Продукт должен позволять отличать свидетельство существования возможности КонсультантПлюс от
        свидетельства использования этой возможности клиентом и от свидетельства достижения клиентом
        требуемого результата.
      rationale: Возможность, использование и эффект являются различными уровнями доказательства.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-04, N-CPLUS-PM-07]
      verification: evidence-level separation audit

    - id: SR-CPLUS-RIC-DIR-POS-017
      statement: >-
        Продукт должен сохранять различия и противоречия между свидетельствами директора РИЦ,
        сотрудников РИЦ, клиентов, других РИЦ, Сети и инженерного анализа до получения достаточного
        основания для их разрешения.
      rationale: Усреднение разнородных свидетельств создает ложную определенность.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-04]
      verification: contradiction-preservation audit

    - id: SR-CPLUS-RIC-DIR-POS-018
      statement: >-
        Продукт должен позволять преобразовать повторяющийся подтвержденный клиентский или сервисный
        разрыв в структурированную обратную связь для Сети с указанием контекста, наблюдаемого проявления,
        частоты, критичности, существующего обходного пути и имеющихся свидетельств.
      rationale: Обратная связь должна быть пригодна для продуктового решения Сети.
      source_trace: [N-CPLUS-PM-05, N-CPLUS-PM-06]
      verification: inspection of feedback output schema and evidence trace

    - id: SR-CPLUS-RIC-DIR-POS-019
      statement: >-
        Основное представление продукта должно быть понятно директору РИЦ без знания системно-инженерной
        терминологии и внутренней структуры инженерной среды.
      rationale: Адресат продукта — руководитель РИЦ.
      source_trace: [N-CPLUS-PM-01]
      verification: director-facing readability review

    - id: SR-CPLUS-RIC-DIR-POS-020
      statement: >-
        Основное представление продукта должно отделять информацию, необходимую директору для принятия
        решения, от инженерных данных, предназначенных для трассируемости и последующей проверки.
      rationale: Управленческое представление и инженерная доказательная база имеют разные задачи.
      source_trace: [N-CPLUS-PM-01, N-CPLUS-PM-03]
      verification: presentation-layer inspection plus trace-link audit

    - id: SR-CPLUS-RIC-DIR-POS-021
      statement: >-
        Каждое системное требование к продукту должно иметь уникальный идентификатор, источник или
        основание, критерий проверки и состояние проверки.
      rationale: Требования должны оставаться управляемыми и трассируемыми на протяжении жизненного цикла.
      source_trace: [N-CPLUS-PM-03]
      verification: schema inspection against required INCOSE attribute subset

    - id: SR-CPLUS-RIC-DIR-POS-022
      statement: >-
        Набор требований к продукту должен обеспечивать трассируемость от потребностей заинтересованных
        сторон к требованиям, элементам директорского представления, свидетельствам и результатам проверки.
      rationale: Качество отдельных требований не обеспечивает полноту инженерного контура без сквозной трассируемости.
      source_trace: [N-CPLUS-PM-03, N-CPLUS-PM-04]
      verification: end-to-end trace audit and C10-C15 set review

  roi_definition:
    role: economic_decision_measure
    relation_to_engineering_measures: >-
      ROI не является заменой MoE, MoP, TPM или MoS. Он используется как отдельная экономическая мера,
      если директорское решение требует сопоставить монетизируемый эффект с инвестициями.
    default_formula: '(monetized_benefits - attributable_costs) / attributable_costs'
    reporting_rule: >-
      Значение ROI представляется только вместе с периодом, валютой, составом затрат и выгод, источниками
      данных, границей атрибуции, допущениями, неопределенностью и статусом установленности.
    unsupported_data_rule: >-
      При отсутствии достаточных данных продукт может показать структуру будущего расчета или диапазон
      сценариев, но не должен маркировать числовой ROI как установленный факт.

  incose_car_profile:
    source_status: local_additive_quality_profile_not_normative_GOST_replacement
    characteristics:
      individual:
        C1: необходимое
        C2: соответствующее_уровню_и_сущности
        C3: однозначное
        C4: полное
        C5: единичное_по_мысли
        C6: реализуемое
        C7: проверяемое_или_валидируемое
        C8: корректное_относительно_источника
        C9: соответствующее_установленным_правилам_формы
      set:
        C10: полный_набор
        C11: непротиворечивый_набор
        C12: реализуемый_набор
        C13: понятный_набор
        C14: набор_допускает_валидацию_относительно_потребностей
        C15: набор_корректно_представляет_источники
      applicability: all_mandatory_for_this_requirements_set

    attributes:
      policy: >-
        В модели доступны все A1-A49. Для каждого требования обязательный минимум заполняется;
        остальные атрибуты получают значение, ссылку либо explicit_not_applicable с причиной.
        Атрибуты являются сопровождающей информацией и не создают скрытых дополнительных требований.
      catalog:
        A1: обоснование
        A2: трасса_к_родительскому_требованию
        A3: трасса_к_источнику
        A4: состояния_и_режимы
        A5: распределение_или_бюджетирование
        A6: критерий_успеха_верификации_или_валидации
        A7: стратегия_верификации_или_валидации
        A8: метод_верификации_или_валидации
        A9: ответственная_организация_верификации_или_валидации
        A10: уровень_верификации_или_валидации
        A11: стадия_верификации_или_валидации
        A12: условие_применения
        A13: результаты_верификации_или_валидации
        A14: статус_верификации_или_валидации
        A15: уникальный_идентификатор
        A16: уникальное_имя
        A17: автор_или_инициатор
        A18: дата_ввода
        A19: владелец
        A20: заинтересованные_стороны
        A21: орган_управления_изменениями
        A22: предлагаемое_изменение
        A23: номер_версии
        A24: дата_одобрения
        A25: дата_последнего_изменения
        A26: стабильность_или_изменчивость
        A27: ответственное_лицо
