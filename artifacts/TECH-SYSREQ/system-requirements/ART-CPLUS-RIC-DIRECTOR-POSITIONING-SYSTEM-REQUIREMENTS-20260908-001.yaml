scope: >-
  Требования относятся к информационному продукту для директора РИЦ, который помогает решить,
  как проверять и применять позиционирование КонсультантПлюс через реальные клиентские решения,
  вклад СПС и вклад РИЦ. Требования не устанавливают официальную позицию Сети, коммерческие обещания,
  причинный эффект или принятие продукта директором РИЦ.
