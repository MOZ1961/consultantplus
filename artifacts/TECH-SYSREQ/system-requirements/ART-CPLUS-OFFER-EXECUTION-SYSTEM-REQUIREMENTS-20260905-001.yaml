  process_type_id: TECH-SYSREQ
  process_instance_id: PI-CPLUS-TECH-SYSREQ-OFFER-EXECUTION-COMPOSITION-REPAIR-20260906-001
  activity_instance_id: AI-CPLUS-TECH-SYSREQ-COMPLETE-S10-84-20260906-001
