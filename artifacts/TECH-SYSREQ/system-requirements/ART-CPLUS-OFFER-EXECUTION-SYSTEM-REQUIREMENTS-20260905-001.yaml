acceptance_status: requirements_candidate_not_baselined_or_deployed
artifact_instance_purpose: >-
  Сохранить нормативно полный состав системных требований к минимальной способности инженерной среды исполнять
  предложение E0/S01: принять разрешенную информацию об одном эпизоде решения, минимизировать данные, сформировать
  D02 и предварительные D03/D04, верифицировать результат, выдать трассируемое представление и сохранить доказательства.
