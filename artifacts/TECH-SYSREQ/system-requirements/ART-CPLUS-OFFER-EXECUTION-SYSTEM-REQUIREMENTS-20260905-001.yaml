artifact_instance_purpose: >-
  Задать проверяемые системные требования к минимальной способности инженерной среды практически исполнять
  предложения участникам Сети КонсультантПлюс, начиная с E0/S01: принять разрешенную информацию об одном
  реальном эпизоде решения, минимизировать данные, сформировать D02 и предварительные D03/D04, провести
  предметную верификацию, выдать участнику трассируемый результат и сохранить доказательства без создания
  параллельного источника истины.
