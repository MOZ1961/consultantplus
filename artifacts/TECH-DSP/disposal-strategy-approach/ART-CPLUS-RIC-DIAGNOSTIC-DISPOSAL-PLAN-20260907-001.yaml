project_contour: client_system_consultantplus
lifecycle_status: owner_directed_candidate_disposal_plan_defined_not_due
acceptance_status: disposal_plan_candidate_actual_retirement_and_owner_acceptance_separate
artifact_instance_purpose: >-
  Определить безопасное завершение жизненного цикла продукта «Диагностика клиентского случая РИЦ»:
  прекращение активного предложения/исполнения, уведомление затронутых сторон, прекращение поддержки,
  disposition активных копий и защищенной информации, сохранение требуемой инженерной/аудитной истории,
  отключение ненужных обеспечивающих связей и формирование доказательств фактического списания только тогда,
  когда решение о выводе из применения действительно принято.
