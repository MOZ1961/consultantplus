  process_type_id: TECH-DSP
  process_instance_id: PI-CPLUS-TECH-DSP-RIC-DIAGNOSTIC-PLAN-20260907-001
  activity_instance_id: AI-CPLUS-TECH-DSP-PLAN-RIC-DIAGNOSTIC-RETIREMENT-20260907-001
  methodic_instance: {methodic_id: METH-CPLUS-TECH-DSP-RIC-DIAGNOSTIC, methodic_version_id: METHVER-CPLUS-TECH-DSP-RIC-DIAGNOSTIC-V1, methodic_version: controlled_retirement_v1, status: provisional_runtime_not_adopted}
request_operation_ref: {repository: MOZ1961/se, process_type_id: TECH-OP, process_instance_id: PI-SE-TECH-OP-CPLUS-RIC-DIAGNOSTIC-FULL-LIFECYCLE-20260907-001, required_output_label: operation report}
interface_binding_ref: {repository: MOZ1961/consultantplus, artifact_version_id: ARTVER-CPLUS-SE-INTERFACE-BINDING-20260904-001-V3, binding_instance_id: BIND-CPLUS-SE-001}
issued_at_and_status: {issued_at: '2026-09-07', status: disposal_plan_defined_actual_disposal_not_due}
scope: retirement/disposition of active diagnostic service configuration, issued copies and protected operational data; Git audit history is retained according to governance and is not falsely called deleted
issuing_organization: owner-authorized MOZ1961/consultantplus client engineering environment
approving_authority: owner
applicable_references:
  - ARTVER-CPLUS-RIC-DIAGNOSTIC-FULL-LIFECYCLE-CONCEPTS-20260907-001-V1
  - ARTVER-CPLUS-RIC-DIAGNOSTIC-FULL-LIFECYCLE-SEMP-20260907-001-V1
  - ARTVER-CPLUS-RIC-DIAGNOSTIC-MAINTENANCE-PLAN-20260907-001-V1
  - ARTVER-CPLUS-RIC-DIAGNOSTIC-LIFECYCLE-MEASUREMENT-PLAN-20260907-001-V1
  - ARTVER-SE-GOST58609-FULL-NORMATIVE-CONTENT-CATALOG-20260904-001-V3
introduction:
  purpose: define end-of-life actions before disposal becomes necessary, without claiming the product is currently retired
  audience: owner, engineering actor, future RIC recipient/user and information/configuration managers as applicable
  coverage: service retirement, external notification, records/data disposition, enabling-system bindings, verification and final evidence
planned_activities_and_tasks:
  - establish explicit retirement authority and scope: whole product, version, pilot, client relationship or operational copy
  - stop new external issue/execution for the retiring configuration
  - identify affected RIC recipients/users and open commitments or support obligations
  - identify active operational copies, distribution records, measurement/episode data and protected information
  - notify affected resolved users of end-of-support, replacement/successor or no-replacement state where applicable
  - preserve canonical engineering/audit history required for traceability while disposing of protected/temporary operational data according to authority
  - revoke or stop product-specific active access/bindings/configurations that are no longer required without disabling shared generic enablers unnecessarily
  - verify closure of open delivery/maintenance/change items or record explicit residual disposition
  - create TECH-DSP disposed-system evidence wrapper only after actual actions complete
  - issue final operation/maintenance/disposal reporting as applicable; do not infer client acceptance from retirement notice
tools_methods_and_techniques:
  methods: [configuration inventory, distribution-record review, retention/disposition classification, access/binding review, closure checklist, TECH-VER of disposal evidence]
  tools: [GitHub process-owned history, information/configuration records, ChatGPT engineering actor, structural worker]
schedule:
  trigger: owner-authorized retirement, supersession with no continued support, unacceptable maintainability/risk, or terminated pilot/service scope
  preparation: before end-of-support date when external users exist
  execution: after commitments/notification arrangements permit retirement
  final_verification: after applicable disposal actions and before complete status is claimed
budget_and_cost_estimate: {disposal_budget_rub: not_established, rule: no paid migration or external disposal service is authorized by this plan}
resources_and_allocation:
  owner: retirement authority and exceptions
  engineering_actor: inventory, controlled disposition records and verification coordination
  RIC_recipient_when_resolved: acknowledge migration/end-of-support information and manage its own local copies under its authority
  information_configuration_management: support exact inventory and retention classification where applicable
responsibilities_and_authorities:
  owner: decides retirement scope/date/replacement policy and approves exceptions
  engineering_actor: executes authorized product-side disposition; cannot delete or alter RIC-owned data/systems without authority
  RIC: controls its local operational/adopted copies and internal retention; supplier records only what is evidenced
participant_interfaces:
  supplier_to_RIC: end-of-support/replacement/data-return-or-disposition communication where applicable
  TM_IM_TM_CM_to_disposal: exact information/configuration/distribution inventory
  TECH_MNT_to_disposal: open maintenance/problems and migration recommendation
  disposal_to_TECH_VER: exact performed-actions evidence for completion verification
risk_assessment_and_mitigation:
  - {risk: Git history is falsely described as deleted, mitigation: distinguish active/protected-data disposition from retained canonical audit history}
  - {risk: recipient still relies on retired version, mitigation: identify distribution and notify resolved recipients before end-of-support when applicable}
  - {risk: protected episode data retained without purpose, mitigation: explicit retention/disposition classification and minimum necessary archival}
  - {risk: shared SE/GitHub infrastructure is disabled for one product, mitigation: dispose only product-specific binding/configuration not shared enablers unless separately authorized}
  - {risk: open agreement/support obligation ignored, mitigation: closure checklist includes commitments/agreement state}
quality_and_effectiveness_measures:
  disposal_evidence_coverage: {metric: G07, target: 100_percent_applicable_actions}
  unresolved_open_commitments_at_complete: {target: 0_or_explicit_owner_accepted_residual}
  notified_known_affected_external_recipients: {target: 100_percent_when_applicable}
  protected_data_items_without_disposition: {target: 0_applicable_items}
environment_infrastructure_security:
  canonical_history: retain exact process-owned ArtifactVersion lineage required for audit/engineering trace; do not rewrite historical truth
  active_data: minimize/archive/delete only according to actual authority and retention basis
  shared_enablers: ChatGPT/GitHub generic availability is outside product disposal unless separately affected
  security_privacy: secure removal/disposition of protected operational data and access references as applicable
training:
  engineering_actor: distinguish retirement, archival, protected-data disposition and immutable historical records
  external_users: replacement/migration instructions only if a successor or migration path exists
technical_management_review_reporting:
  pre_disposal_review: confirm scope, commitments, users, configuration, data, storage and replacement status
  completion_evidence: TECH-DSP disposed system record with R9-DISPOSAL and R9-CONFIGURATION when actual disposal occurs
  verification: verify applicable actions, residuals and version/state before declaring complete
related_plans_and_task_descriptions:
  lifecycle_SEMP: ARTVER-CPLUS-RIC-DIAGNOSTIC-FULL-LIFECYCLE-SEMP-20260907-001-V1
  maintenance_plan: ARTVER-CPLUS-RIC-DIAGNOSTIC-MAINTENANCE-PLAN-20260907-001-V1
  measurement_plan: ARTVER-CPLUS-RIC-DIAGNOSTIC-LIFECYCLE-MEASUREMENT-PLAN-20260907-001-V1
disposition_or_removal_activities:
  active_offer: stop issue/execution of retired exact configuration
  external_copies: identify issued versions and communicate replacement/end-support where applicable; recipient-controlled copies remain under recipient authority
  operational_data: classify and disposition temporary/protected episode data according to retention authority
  canonical_artifacts: retain controlled historical versions and their truth/verification/distribution lineage unless repository governance separately requires lawful removal
  bindings: retire only product-specific active bindings/configurations no longer needed
affected_stakeholders_notifications_replacement:
  current_known_external_recipients: none_established_for_actual_product_issue_at_plan_time
  future_rule: derive affected list from AGR-SUP/TM-IM distribution records, not assumptions
  replacement_state: not_established; successor must be exact ArtifactVersion if one exists
  end_support_notice: required for known affected active recipients when retirement affects their supported use
protected_information_disposition:
  classify: [protected_personal_or_confidential_episode_data, temporary_working_material, canonical_minimized_evidence, distribution_and_verification_history]
  rule: authority/retention basis controls each class; no blanket claim that all historical repository data can or must be erased
schedule_actions_resources_for_disposal:
  sequence: [authorize_scope, inventory, resolve_commitments, notify, stop_new_use, migrate_or_archive_or_delete_as_authorized, retire_bindings, verify, record_disposed_state]
  resources: owner plus engineering actor plus affected client/information roles when applicable
safety_security_privacy_environmental_obligations:
  safety: no special physical safety obligation currently identified for information-service product
  security_privacy: protect identifiers/secrets and dispose of protected operational data only through authorized means
  environmental: no material physical disposal/environmental burden identified; shared infrastructure remains outside product-specific disposal
adverse_effect_prevention:
  - do not strand a known active RIC without notice when supported use is being ended
  - preserve evidence necessary to understand prior decisions/version states
  - do not delete or modify client-owned external systems/data without explicit authority
  - do not leave obsolete version presented as current after retirement
affected_enabling_systems_and_storage:
  enabling_systems: [ChatGPT engineering actor, GitHub connector, SE-GENERIC-ENVIRONMENT]
  product_specific_effect: stop product-specific execution/configuration references only; shared enablers continue unless separate decision
  storage: MOZ1961/consultantplus canonical artifacts plus any separately authorized operational communication/work storage
  current_actual_external_storage: not_established
glossary:
  disposal: controlled cessation/removal/disposition actions at end of supported lifecycle
  retirement: decision to stop supported use/issue of a product or configuration; precedes evidence of completed disposal
  canonical_history: controlled historical ArtifactVersions retained to preserve engineering/audit truth
  protected_operational_data: client/participant information whose retention/disposition requires explicit basis and minimization
change_procedure_and_history:
  change_rule: retirement scope, replacement, retention or privacy disposition change requires successor plan or controlled change
  history: [{version: V1, date: '2026-09-07', change: establish product retirement/disposal plan before actual end-of-life}]
closure:
  plan_closes_when: actual disposal completion is evidenced and verified or this plan is superseded; current state remains not_due
owner_product_request:
  exact_visible_text: |-
    какие метрики? пройди полный ЖЦ для этого продукта. ЖЦ как этой среды, так и клиентской
    поменяй назначение под это. декомпозируй. все своди к стандартным продуктам с составом по ГОСТ
  request_specific_requirements: [cover disposal stage, standard product/GOST composition, truthful not-due state, protect client authority and history]
