  повторно использовать односценарный E0/S01 intake/evidence contract, задать правила нормализации и
  кластеризации 3-5 эпизодов, структуры D08/D09, sample-bounded recurrence, верификационные проверки,
  производное представление результата и точную трассу к каноническим продуктам.
