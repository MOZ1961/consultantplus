  Спроектировать исполнимую вручную/LLM-поддерживаемую процедуру E0/S01 без нового приложения: точные входные поля,
  правила минимизации и классификации доказательств, структуру D02/D03/D04, трассу к каноническим продуктам,
  проверочный чек-лист и производное представление для участника.
