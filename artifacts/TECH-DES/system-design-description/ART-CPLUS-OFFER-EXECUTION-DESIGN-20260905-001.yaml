context:
  design_problem: turn the E0/S01 architecture into a precise repeatable actor procedure while keeping templates inside process-owned design/procedure products rather than new semantic sidecars
  design_assumption: ChatGPT engineering actor can perform structured extraction, classification and synthesis from participant text; GitHub connector persists exact process-owned products
  design_limits: no external contact, no commercial promise, no automated legal correctness analysis, no full E1-E4/S02-S08 coverage
  designation: CPLUS-OFFER-EXECUTION-DESIGN-V1
body:
  execution_unit:
    name: E0_S01_single_episode_execution
    admission:
      - owner or authorized participant input explicitly requests/permits analysis of one episode
      - participant group or role is known at a non-identifying level
      - data can be minimized before persistence
    completion:
      - minimum input fields are dispositioned
      - canonical evidence/result/verification/operation products are identified or explicit no-real-evidence canary mode is used
      - D02, preliminary D03 and D04 are generated with evidence trace
      - TECH-VER result is pass or pass_with_explicit_limitations before delivery
  intake_contract:
    required_fields:
      - {id: IN-01, name: participant_group_or_role, evidence_default: direct_episode_fact_reported_by_participant}
      - {id: IN-02, name: trigger, evidence_default: direct_episode_fact_reported_by_participant}
      - {id: IN-03, name: required_decision_or_action, evidence_default: direct_episode_fact_reported_by_participant}
      - {id: IN-04, name: deadline_or_pressure, evidence_default: direct_episode_fact_reported_by_participant, allow_not_established: true}
      - {id: IN-05, name: information_path, evidence_default: direct_episode_fact_reported_by_participant}
      - {id: IN-06, name: consultantplus_contribution, evidence_default: participant_interpretation_or_judgment, allow_none: true}
      - {id: IN-07, name: ric_contribution, evidence_default: participant_interpretation_or_judgment, allow_none: true}
      - {id: IN-08, name: final_action_or_status, evidence_default: direct_episode_fact_reported_by_participant}
      - {id: IN-09, name: remaining_uncertainty, evidence_default: participant_interpretation_or_judgment, allow_none: true}
    optional_fields:
      - {id: IN-10, name: recurrence_or_typicality}
      - {id: IN-11, name: perceived_consequence_of_error_or_delay}
      - {id: IN-12, name: handoffs_or_other_participants}
      - {id: IN-13, name: retained_reasoning_or_evidence}
    normalization_rules:
      - missing required field is represented as not_established, never invented
      - names of natural persons and counterparties are removed unless indispensable and separately authorized
      - free-text participant judgments remain participant judgments after paraphrase
      - direct quotes are not retained unless consent is explicit
      - credentials, secrets and privileged raw materials are rejected from canonical persistence
  evidence_record_design:
    canonical_owner_when_real: TM-MEAS -> measurement register
    record_fields:
      - episode_id
      - participant_group_or_role
      - trigger
      - required_decision_or_action
      - deadline_or_pressure
      - information_path
      - consultantplus_contribution
      - ric_contribution
      - final_action_or_status
      - remaining_uncertainty
      - optional_context
      - evidence_class_by_field
      - minimization_actions
      - unresolved_fields
    identifier_rule: use non-identifying execution-local IDs; no participant name required
  analysis_design:
    canonical_owner: TECH-BMA -> business or mission analysis report
    D02_critical_scenario_passport:
      fields:
        - trigger
        - participant_role
        - decision_or_action
        - time_pressure
        - evidence_path
        - final_action_or_status
        - retained_basis_if_known
        - unresolved_uncertainty
      trace_rule: every field traces to IN-* or is not_established
    D03_preliminary_coverage_map:
      dimensions:
        - ConsultantPlus
        - RIC_service
        - client_organization_or_colleagues
        - other_sources
      allowed_contribution_labels: [find, applicability, interpret, compare, justify, monitor, setup, training, consultation, support, other, none, not_established]
      inference_rule: analyst may classify contribution only from participant-described action; classification is interviewer_coding_or_inference
    D04_preliminary_gap_map:
      allowed_gap_types: [remaining_uncertainty, duplicated_search, manual_workaround, access_barrier, escalation, missing_evidence, process_handoff, other, none, not_established]
      inference_rule: gap exists only if supported by participant statement or explicitly marked analyst inference
    prohibited_output_claims:
      - ROI or payback
      - avoided fine or loss
      - causal reduction of legal/regulatory risk
      - statistical prevalence from one episode
      - official ConsultantPlus/RIC service promise
      - correctness of the participant legal or professional decision
  verification_design:
    required_checks:
      - {id: VC-01, check: every IN-01..IN-09 has present/none/not_established disposition}
      - {id: VC-02, check: no credentials/secrets/unnecessary identifiers persisted}
      - {id: VC-03, check: every D02 field traces to an intake field or not_established}
      - {id: VC-04, check: each D03/D04 analytical classification is tagged analyst inference when not direct participant wording}
      - {id: VC-05, check: ConsultantPlus and RIC contributions remain separate}
      - {id: VC-06, check: prohibited output claims absent}
      - {id: VC-07, check: unresolved data block only dependent conclusions}
      - {id: VC-08, check: participant rendering references exact verified TECH-BMA ArtifactVersion}
      - {id: VC-09, check: client authority and BIND-CPLUS-SE-001 preserved}
      - {id: VC-10, check: exactly one TECH-OP operation report exists for a real execution request}
  participant_rendering_design:
    title_pattern: 'Разбор рабочего эпизода — <role/context without identifying details>'
    sections:
      - Что произошло и какое решение требовалось
      - Как шел поиск основания и принятие решения
      - Где помог КонсультантПлюс
      - Где участвовал РИЦ или сопровождение
      - Что осталось неопределенным или потребовало обходного пути
      - Что можно проверить или улучшить дальше
      - Ограничения вывода
    mandatory_footer: 'Результат основан на описанном эпизоде; это не юридическое заключение, не оценка ROI и не официальное коммерческое обязательство КонсультантПлюс/РИЦ.'
    authority_note: rendering is derived from exact verified TECH-BMA ArtifactVersion and is not canonical on its own
  persistence_design:
    real_execution_products:
      - TM-MEAS -> measurement register
      - TECH-BMA -> business or mission analysis report
      - TECH-VER -> verification report
      - TECH-OP -> operation report
    capability_definition_products:
      - TECH-SYSREQ -> system requirements
      - TECH-ARCH -> system architecture description
      - TECH-DES -> system design description
      - TECH-IMP -> implementation procedure
    canary_mode: synthetic fixture may be embedded in TECH-VER and shall not be persisted as client evidence or measurement register
  requirement_traceability:
    SR-OEX-01: [body.execution_unit.admission]
    SR-OEX-02: [body.intake_contract.required_fields]
    SR-OEX-03: [body.intake_contract.normalization_rules]
    SR-OEX-04: [body.evidence_record_design, body.intake_contract.required_fields]
    SR-OEX-05: [body.evidence_record_design.canonical_owner_when_real]
    SR-OEX-06: [body.analysis_design]
    SR-OEX-07: [body.analysis_design.D02_critical_scenario_passport.trace_rule, body.analysis_design.D03_preliminary_coverage_map.inference_rule, body.analysis_design.D04_preliminary_gap_map.inference_rule]
    SR-OEX-08: [body.verification_design]
    SR-OEX-09: [body.participant_rendering_design]
    SR-OEX-10: [body.persistence_design.real_execution_products]
    SR-OEX-11: [body.analysis_design.prohibited_output_claims]
    SR-OEX-12: [body.intake_contract.normalization_rules, body.verification_design]
    SR-OEX-13: [interface_binding_ref, body.verification_design]
    SR-OEX-14: [context.design_assumption]
    SR-OEX-15: [body.persistence_design.canary_mode, body.verification_design]
