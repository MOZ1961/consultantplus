  criteria_results:
    VER-PROP-01: {criterion: D01-D10 complete parent-product coverage, result: pass, evidence: 10 of 10 D IDs mapped; none declared as independent canonical product}
    VER-PROP-02: {criterion: S01-S08 complete process/output coverage, result: pass, evidence: 8 of 8 S IDs list executing ProcessTypes and durable canonical outputs}
    VER-PROP-03: {criterion: E0-E4 are not misclassified as products, result: pass, evidence: 5 of 5 E IDs explicitly execution_scope_not_information_product}
    VER-PROP-04: {criterion: referenced parent outputs have existing canonical identities, result: pass, evidence: TECH-BMA business or mission analysis report/life cycle concepts; TM-MEAS measurement register/report; TECH-STK stakeholder needs and requirements; TECH-SYSREQ system requirements; TECH-IMP training materials; OPE-HR training documentation; TM-PAC change request; TM-DEC decision register; TECH-VER verification report; TECH-OP operation report exist in current process-owned catalog/crosswalk}
    VER-PROP-05: {criterion: implemented E0/S01 mapping remains consistent, result: pass, evidence: D02/D03/D04 remain views in TECH-BMA and real episode evidence remains TM-MEAS measurement register}
    VER-PROP-06: {criterion: no unjustified output-catalog addition, result: pass, evidence: every current durable semantic result fits existing canonical O as product content/view or existing successor output}
    VER-PROP-07: {criterion: impossible future mapping is fail-visible, result: pass, evidence: global procedure requires explicit candidate addition and separate owner/catalog/crosswalk adoption}
    VER-PROP-08: {criterion: owner-facing naming boundary preserved, result: pass, evidence: descriptive labels карта/паспорт/пакет/библиотека/матрица are not used as Информационный продукт labels; parent product uses controlled Russian ГОСТ nomenclature plus separate canonical O}
  detailed_results: {D_views_checked: 10, D_views_passed: 10, services_checked: 8, services_passed: 8, engagement_scopes_checked: 5, engagement_scopes_passed: 5, current_canonical_additions_required: 0, orphan_proposals_found: 0}
  problems_encountered:
    - {id: VER-PROP-P01, problem: prior terminology candidate_delivery_products could be read as ten new product identities, disposition: treat D01-D10 as descriptive views/deliverables and record exact parent products in new BMA report}
    - {id: VER-PROP-P02, problem: some services can mature into different downstream products depending on evidence/authority, disposition: record primary current products plus conditional successor products rather than claiming successor already required or accepted}
  verification_decisions:
    overall: pass_for_current_proposal_set
    rationale: complete coverage with no orphan durable result and no need to extend canonical output catalog today
    future_rule: any new proposal must repeat resolution; unresolved independent durable result becomes explicit candidate addition
conclusions_and_recommendations:
