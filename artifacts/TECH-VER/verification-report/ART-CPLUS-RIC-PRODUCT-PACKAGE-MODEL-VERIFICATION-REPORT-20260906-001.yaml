artifact_instance_purpose: >-
  Проверить новую пакетную модель поставки для РИЦ: пакет должен состоять из самостоятельных
  process-owned информационных продуктов по ГОСТ, Proposal должен описывать их состав и внешнюю
  структуру работ, внутренний SEMP должен планировать их производство, а internal-only продукты
  не должны попадать в пакет РИЦ по умолчанию.
