glossary:
  пакет продуктов: агрегированное представление набора самостоятельных process-owned информационных продуктов для РИЦ
  продукт ценности для РИЦ: самостоятельный информационный продукт, которым РИЦ пользуется как результатом поставки либо для подтверждения его качества
  внутренний продукт: process-owned продукт, необходимый для производства/контроля, но не включаемый во внешний пакет по умолчанию
  представление: форма/раздел внутри канонического продукта, не самостоятельный информационный продукт
