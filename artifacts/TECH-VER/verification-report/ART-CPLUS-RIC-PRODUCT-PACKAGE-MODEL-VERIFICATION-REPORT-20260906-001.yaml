  Проверить reconciled пакетную модель поставки для РИЦ на exact package definition V3, Proposal V3,
  internal SEMP V3 и cover/transmittal V2: пакет состоит из самостоятельных process-owned продуктов по ГОСТ,
  Proposal описывает состав и внешнюю структуру работ, SEMP планирует производство, а internal-only
  продукты не попадают в пакет РИЦ по умолчанию.
