glossary:
  proof_design: схема утверждений, измерений, свидетельств и критериев, еще не являющаяся empirical proof
  falsifiable_claim: утверждение, для которого заранее определено наблюдение, способное его не поддержать
  empirical_blocker: отсутствующее реальное свидетельство, без которого claim не может получить supported
  subject_TECH_VER: проверка предметной корректности/границ продукта, отличная от structural worker и TECH-VAL
