    - successor supply record uses generic record §9.1 plus R9-CONFIGURATION and preserves full PPR trace
    - owner input authorizes progression to external issue readiness but is not evidence of an actual recipient or completed send
    - recipient and channel remain explicit unresolved facts rather than inferred values
    - actual_sent_at remains not_sent until a real external action occurs
    - cover-letter rendering does not add ROI, prevented-fine, general-risk-reduction, Network-representativeness, KC-adoption or client-outcome claims
