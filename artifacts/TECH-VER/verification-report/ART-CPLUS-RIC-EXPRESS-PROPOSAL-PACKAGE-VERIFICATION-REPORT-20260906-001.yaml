artifact_instance_purpose: >-
  Проверить комплект подготовки пилотного предложения РИЦ: внешний AGR-SUP → supply response как продукт
  «Предложение» по §10.56, внутренний TM-PLAN → SEMP как План управления проектом по §10.55 и
  AGR-SUP → supply records/artifacts как запись передачи с представлением «сопроводительное письмо».
  Проверить, что внешняя структура работ присутствует в Предложении, но внутренний SEMP не передается адресату.
