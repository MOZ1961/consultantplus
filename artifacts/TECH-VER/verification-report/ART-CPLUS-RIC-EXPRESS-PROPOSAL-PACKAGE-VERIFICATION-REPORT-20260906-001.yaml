summary: >-
  Предметная проверка пройдена: Предложение содержит обязательные условия §10.56 и внешнюю структуру W01–W08;
  внутренний SEMP содержит полную WBS и остается внутри среды; сопроводительное письмо является rendering
  AGR-SUP supply record, а активный exact crosswalk для этого O использует R9-CONFIGURATION. Цена 0 руб. относится
  только к одному кандидатному пилоту и не является внешним обязательством до отдельного owner approval.
