summary: >-
  Предметная проверка готовности к выдаче пройдена как кандидат. Proposal V4 остается неизменным и
  находится в merged main; supply record V3 ссылается именно на V4, сохраняет §9.1 + R9-CONFIGURATION,
  использует директорскую ценность V4 без новых сильных утверждений и фиксирует owner authority из
  «сливай. продолжай». Получатель и канал явно остаются not_established, actual_sent_at=not_sent,
  поэтому фактическая отправка корректно заблокирована только до их определения.
