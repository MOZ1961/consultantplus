glossary:
  verified_candidate: analytically verified result whose external intended-use usefulness is still unvalidated
  R3_used_for_decision: real RIC uses the result in a recorded management/service decision
  R4_effect_observed_and_validated: post-decision effect is observed and, where claimed, validated in intended context
  verification: objective evidence that specified requirements/criteria are fulfilled; not intended-use validation
  validation: evidence that stakeholder needs/intended use are satisfied in the relevant operational context
