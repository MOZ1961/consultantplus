  verification_purpose: establish whether any material stakeholder/method/evidence design gap remains that should be closed before measurement execution
  audience: [owner, initiating RIC, peer RIC reviewers, SE analysts, measurement executor]
  acceptance_boundary: subject design verification does not establish structural worker PASS, external-contact authority, empirical value, market prevalence or positioning adoption
