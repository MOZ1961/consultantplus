  evidence_state: repository ArtifactVersions and owner instruction are inspected; no new respondent data is claimed
  structural_boundary: exact field/reference/coverage conformance remains for deterministic external-client structural worker
  interpretation_boundary: requirements derived here constrain research design but remain candidates until empirical stakeholder evidence/authorized decisions where applicable
body:
  verified_items_and_dates:
    - {item: ARTVER-CPLUS-RIC-POSITIONING-PREMEASUREMENT-STAKEHOLDER-NEEDS-20260908-001-V1, date: '2026-09-08', verification_scope: four stakeholder domains, needs, decision uses, evidence rights/limits, non-substitution, privacy and claim boundaries}
    - {item: ARTVER-CPLUS-RIC-POSITIONING-MULTI-STAKEHOLDER-MEASUREMENT-PLAN-20260908-001-V1, date: '2026-09-08', verification_scope: common evidence contract, modules, sampling/sequence, triangulation/conflicts, privacy, readiness and downstream products}
  verification_requirements_and_criteria:
    - {id: PMR-01, criterion: stakeholder_completeness, required: true, expected: initiating RIC, SE, peer RICs and clients explicitly represented}
    - {id: PMR-02, criterion: stakeholder_decision_use, required: true, expected: each stakeholder class has decisions/use for the evidence and bounded evidence authority}
    - {id: PMR-03, criterion: client_role_coverage, required: true, expected: professional user, functional owner, economic buyer/sponsor and technical enabler remain explicit C1-C6 subroles}
    - {id: PMR-04, criterion: non_substitution, required: true, expected: RIC-side, direct-client and SE-inference evidence cannot silently substitute for each other}
    - {id: PMR-05, criterion: common_evidence_unit, required: true, expected: source class, role/context, episode/decision, alternatives, contributions, result/status, uncertainty and evidence class are fixed}
    - {id: PMR-06, criterion: contamination_control, required: true, expected: unaided episode/frame/alternatives/value language precedes aided positioning prompts}
    - {id: PMR-07, criterion: transferability_design, required: true, expected: initiating RIC and peer RIC evidence stays distinct and peer-RIC module explicitly tests local constraints/transferability}
    - {id: PMR-08, criterion: contradiction_policy, required: true, expected: conflicting stakeholder evidence preserved and reported by domain rather than averaged}
    - {id: PMR-09, criterion: privacy_and_consent, required: true, expected: data minimization, consent, audio/quotation and retention rules explicit before collection}
    - {id: PMR-10, criterion: strong_claim_boundary, required: true, expected: no ROI, prevented-fine, general-efficiency, general-risk-reduction or prevalence claim treated as established by this qualitative design}
    - {id: PMR-11, criterion: entry_stop_revision_gates, required: true, expected: pre-use TECH-VER/structural/authority/orientation/privacy gates and stop/revise criteria explicit}
    - {id: PMR-12, criterion: downstream_persistence, required: true, expected: no empty data register before collection; actual data to measurement register, synthesis to measurement report, BMA/TM-DEC only by their own conditions}
  composition_verification_matrix:
    stakeholder_needs:
      artifact_version_id: ARTVER-CPLUS-RIC-POSITIONING-PREMEASUREMENT-STAKEHOLDER-NEEDS-20260908-001-V1
