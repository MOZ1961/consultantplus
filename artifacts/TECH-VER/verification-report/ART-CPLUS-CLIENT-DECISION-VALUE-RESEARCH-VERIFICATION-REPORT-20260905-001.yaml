artifact_instance_purpose: >-
  Проверить предметную пригодность уточненной модели клиентской ценности и плана первой волны исследования:
  границы клиентских/поставщицких решений, проверяемость гипотез через конкретные эпизоды, нейтральность сбора данных,
  отделение фактов от оценок и отсутствие недоказанной причинной, финансовой или требований-ориентированной атрибуции.
