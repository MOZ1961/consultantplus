  semantic_verification: проверка смысла, границ вывода и пригодности к заявленному назначению, отдельная от структурного наличия полей
  candidate_pilot_use: разрешенный предметной верификацией уровень зрелости дизайна, не означающий разрешение владельца на внешнее взаимодействие
  field_level_evidence_class: классификация происхождения конкретного записанного утверждения, а не интервью целиком
  causal_attribution: утверждение, что продукт вызвал бизнес-исход; в первой волне не устанавливается
