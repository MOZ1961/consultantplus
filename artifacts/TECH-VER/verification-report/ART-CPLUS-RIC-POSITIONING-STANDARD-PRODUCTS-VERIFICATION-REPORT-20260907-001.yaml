glossary:
  subject_verification: предметная проверка корректности и достаточности содержания относительно заданных критериев
  structural_verification: детерминированная проверка обязательных полей, нормативного состава и трассировки без вывода о предметной истинности
  controlled_measurement_testing: ограниченная проверка гипотез по утвержденному Плану без принятия их как официальной позиции
  adoption: отдельное полномочное решение о принятии позиционирования, не следствие TECH-VER или worker PASS
