artifact_instance_purpose: >-
  Предметно верифицировать новый стандартный комплект позиционирования КонсультантПлюс для РИЦ:
  источник-доказательство, сравнительный TECH-BMA Отчет V3 и TM-MEAS План V2. Проверить, что C1-C6
  корректно ограничены одной кодировочной осью, альтернативные территории действительно различаются,
  методика содержит frame/alternatives/PoP/PoD/reason-to-believe и B2B-роли, сильные утверждения не
  превышают доказательства, а План пригоден для контролируемой эмпирической проверки без преждевременного принятия позиционирования.
