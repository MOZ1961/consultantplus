  Семантическая проверка подтверждает, что ядро текущего состояния опирается на официальные страницы ConsultantPlus,
  а opportunity/alternative/future-state propositions явно маркированы как аналитические кандидаты или неизвестные данные.
  Проверка не подтверждает структурную полноту worker-ом, не устанавливает внутреннюю бизнес-проблему и не является owner acceptance.
introduction:
  verification_subject: exact BMA ArtifactVersions listed in body.verified_items
  verification_context: current owner request to connect client system and populate public-source BMA lifecycle products
  verification_date: '2026-09-05'
context_and_assumptions:
  source_class: official consultant.ru pages retrieved during the current run
  semantic_rule: fact requires direct source support; inference must be labeled; absence of public internal data remains unresolved
  structural_rule: semantic review does not substitute verify_information_product_subset.py or validate_information_product_completeness.py
body:
