  Предметно проверить два новых продукта для руководителя РИЦ: TM-MEAS План с встроенным опросником и
  AGR-SUP краткое объяснение взаимодействия/пользы. Убедиться, что опросник не наводит на заранее выбранное
  позиционирование, факты и реакции разделены, объяснение пользы не усиливает утверждения сверх текущей
