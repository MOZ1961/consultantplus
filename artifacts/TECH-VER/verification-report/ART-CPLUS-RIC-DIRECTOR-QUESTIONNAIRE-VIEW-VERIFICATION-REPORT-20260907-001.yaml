    - {criterion: DIRV3-01, result: PASS, evidence: producer ProcessType and canonical O remain AGR-SUP/supply response}
    - {criterion: DIRV3-02, result: PASS_SUBJECT_INSPECTION, evidence: exact generic/specific/PPR/dual-trace sets are materialized; local deterministic resolution pending}
