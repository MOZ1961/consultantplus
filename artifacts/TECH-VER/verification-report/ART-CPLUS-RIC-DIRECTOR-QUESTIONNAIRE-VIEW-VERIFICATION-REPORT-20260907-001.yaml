glossary:
  subject_verification: содержательная проверка продукта и применимости его требований; не равна локальной структурной верификации
  evidence_boundary: явная граница между тем, что поддерживается данными, и более сильным утверждением, требующим новых данных
  falsifiable_claim: утверждение, для которого заранее допустимы как подтверждающие, так и опровергающие результаты
  local_exact_head_verification: детерминированная проверка конечного commit SHA в локальной среде владельца
