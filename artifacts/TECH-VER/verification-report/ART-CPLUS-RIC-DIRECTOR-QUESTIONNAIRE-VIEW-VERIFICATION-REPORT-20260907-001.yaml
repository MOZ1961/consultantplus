scope: >-
  Semantic verification of ARTVER-CPLUS-RIC-DIRECTOR-QUESTIONNAIRE-MEASUREMENT-PLAN-20260907-001-V1 and
  ARTVER-CPLUS-RIC-DIRECTOR-INTERACTION-BENEFIT-SUPPLY-RESPONSE-20260907-001-V1 against current positioning,
  measurement and evidence-boundary products. Structural ГОСТ/PPR completeness is checked separately by workers.
