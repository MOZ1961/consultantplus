summary: >-
  SUBJECT_PASS_PENDING_OWNER_LOCAL_EXACT_HEAD_VERIFICATION. V3 remains canonical AGR-SUP → supply response,
  materializes generic description §7.2 9/9, proposal §10.56 6/6 plus explicit S10.56-O01 disposition, PPR-001..012
  and paired ISO/ГОСТ trace. The three director concerns are explicitly addressed. The potentially unsafe claim
