  subject_verification: semantic verification against stated criteria independent of structural field checks
  unaided_evidence: evidence collected before candidate provider framing is shown
  aided_reaction: participant reaction after exact candidate explanation is presented
  discussion_readiness: fitness to use the instrument in a controlled conversation; not acceptance adoption or proven effect
  evidence_gap: empirically missing information that the future measurement process is expected to obtain
