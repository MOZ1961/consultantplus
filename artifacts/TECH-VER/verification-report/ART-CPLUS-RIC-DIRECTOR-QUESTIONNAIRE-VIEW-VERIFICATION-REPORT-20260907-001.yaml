artifact_instance_purpose: >-
  Верифицировать V3 директорского ответа поставщика после превращения его в верхнеуровневое предложение
  «доказательное управление клиентской ценностью РИЦ». Проверка устанавливает: сохранен ли канонический
  AGR-SUP → supply response и полный состав ГОСТ Р 58609 §7.2 + §10.56; действительно ли продукт адресует
  три заботы директора; не превращено ли отсутствие готовой прикладной поддержки у конкретного РИЦ в
  недоказанное утверждение об отсутствии стратегии у Сети; связаны ли доказательные тезисы с метриками и
  допускают ли неподтверждение. Детальная пригодность для реального директора и локальная структурная
  верификация exact-head остаются отдельными состояниями.
