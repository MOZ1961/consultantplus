    - {id: DIRV3-02, criterion: complete_standard_composition, required: true, expected: exact §7.2 9/9 plus §10.56 6 required and optional tailoring disposition plus PPR-001..012 and paired trace}
    - {id: DIRV3-03, criterion: three_director_concerns, required: true, expected: explicit response to client positioning, verified benefit communication and lack of ready applicable Network support/formulations}
    - {id: DIRV3-04, criterion: network_strategy_claim_boundary, required: true, expected: no assertion that the Network has no strategy; only a concrete RIC-side applicability gap may be proposed for confirmation}
    - {id: DIRV3-05, criterion: evidence_first_positioning, required: true, expected: claim → evidence → boundary → counterevidence/measurement logic rather than unsupported advertising}
    - {id: DIRV3-06, criterion: metric_linked_proof, required: true, expected: selected C metrics tied to falsifiable states including NOT_SUPPORTED and INSUFFICIENT_EVIDENCE}
    - {id: DIRV3-07, criterion: upper_level_offer, required: true, expected: evidence-based management of RIC client value is the main offer; one-episode diagnosis is an entry method rather than terminal product}
    - {id: DIRV3-08, criterion: unaided_before_aided_compatibility, required: true, expected: candidate positioning is shown only after unaided evidence where governed by the interview plan}
    - {id: DIRV3-09, criterion: local_verification_gate, required: true, expected: subject PASS remains pending until owner-local exact-head deterministic suite returns PASS}

