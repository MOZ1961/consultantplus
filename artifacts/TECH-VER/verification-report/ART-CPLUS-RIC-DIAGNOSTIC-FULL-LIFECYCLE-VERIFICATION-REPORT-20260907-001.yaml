artifact_instance_purpose: >-
  Предметно проверить текущий комплект полного жизненного цикла продукта «Диагностика клиентского случая РИЦ»:
  двухконтурную декомпозицию, связь каждого персистируемого результата со стандартным ProcessType/O и применимым
  составом ГОСТ Р 58609, измерительные определения, границы полномочий SE-среды и клиентской системы, планы
  валидации/сопровождения/списания и отсутствие ложных утверждений о еще не состоявшихся клиентских переходах.
