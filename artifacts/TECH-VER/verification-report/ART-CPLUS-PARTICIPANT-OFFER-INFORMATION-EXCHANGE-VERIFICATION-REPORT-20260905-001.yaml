glossary:
  semantic_verification: verification of model meaning, boundary consistency and evidence discipline distinct from structural field checks
  reciprocal_offer: participant evidence exchange for a concrete participant-useful engineering output
  participant_desirability: participant judgment that the proposed return is worth the effort/data exchange; not established by this verification
  candidate_communication_basis: internally verified content suitable for owner-approved drafting, not external-contact authority
  evidence_class: source category preserving participant report, participant judgment, RIC account, analyst inference or not-established state
change_history:
  - {version: V1, date: '2026-09-05', change: initial semantic verification of participant offers and information exchange}
subject_unresolved:
