  Зафиксировать для текущего комплекта продуктов позиционирования обязательный режим: каждый долговременный
  выход имеет полный применимый состав ГОСТ Р 58609/ISO/IEC/IEEE 15289 и PPR, а все детерминированные
  верификации выполняются локально через действующий Git Bash runner SE-среды. Отчет не подменяет локальный
  прогон: он фиксирует входы, ожидаемый состав, exact-head контракт, запрет удаленной подмены и текущий
  блокер — в данном исполнении отсутствует доступный runnable local shell, поэтому итоговый PASS не заявляется.
