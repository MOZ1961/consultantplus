glossary:
  canary: controlled synthetic execution proving mechanics but not participant truth usefulness or demand
  bounded_sample: explicitly limited set whose observed counts are not generalized to a population
  recurring_within_sample: at least two comparable episode members in this bounded set; not population prevalence
  RIC_account_of_client_episode: provider-side account of a client episode, never direct client evidence
  external_condition: evidence produced outside this client TECH-VER product but required before final capability claim
change_history:
