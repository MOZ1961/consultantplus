  resolved_referent: continue the full independent RIC execution-capability chain while leaving the external Proposal package to concurrent work.
  request_specific_requirements: [do not duplicate Proposal/work-structure/cover-letter work, continue toward practical RIC delivery, verify before capability claim, preserve client/evidence authority]
