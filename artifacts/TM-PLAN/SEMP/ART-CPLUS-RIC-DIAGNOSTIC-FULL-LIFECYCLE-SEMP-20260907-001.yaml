work_breakdown_structure:
  - {id: L00, work: establish dual lifecycle and exact standard-product map, process: TECH-BMA, output: life cycle concepts, state: current}
  - {id: L01, work: establish lifecycle measurement definitions and gates, process: TM-MEAS, output: measurement strategy/approach, state: current}
  - {id: L02, work: establish full lifecycle management plan/WBS, process: TM-PLAN, output: SEMP, state: current}
  - {id: L03, work: establish real-use validation plan, process: TECH-VAL, output: validation strategy/approach, state: current}
  - {id: L04, work: establish maintenance/improvement plan, process: TECH-MNT, output: maintenance and logistics strategy/approach, state: current}
  - {id: L05, work: establish retirement/disposal plan, process: TECH-DSP, output: disposal strategy/approach, state: current}
  - {id: L06, work: verify current lifecycle package against standards, purpose and truth boundaries, process: TECH-VER, output: verification report, state: current}
  - {id: L10, work: resolve named RIC/acquirer/recipient/channel, process: AGR-ACQ+AGR-SUP, output: request/agreement/supply records as applicable, state: blocked_external}
  - {id: L11, work: execute one real pilot under subordinate SEMP V3, process: TM-MEAS+TECH-BMA+TECH-VER+AGR-SUP, output: real evidence and two recipient reports plus delivery record, state: blocked_real_episode}
  - {id: L12, work: validate intended usefulness in actual RIC environment, process: TECH-VAL, output: validation report, state: blocked_real_use}
  - {id: L13, work: disposition any diagnosed change through RIC authority and controlled change lifecycle, process: TM-PAC+applicable technical processes, output: change request and successor products, state: conditional}
  - {id: L14, work: remeasure/revalidate after accepted change, process: TM-MEAS+TECH-VAL, output: measurement report+validation report, state: conditional}
  - {id: L15, work: sustain/reverify or scale only on repeated evidence, process: TECH-MNT+TECH-VER+TM-PAC, output: standard successor products, state: conditional}
  - {id: L16, work: retire/dispose on authority, process: TECH-DSP, output: disposed system record, state: not_due}
replanning_and_service_alternatives:
  triggers: [material package member change, price/scope change, new RIC stakeholder requirement, accepted product capability change, scaling from one episode to multi-episode, measurement/validation design change]
  rule: route each material change to owning ProcessType/O and create successor ArtifactVersions; do not silently broaden E0/S01
closure_and_archival:
  lifecycle_plan_closure: this plan closes when superseded or product disposal is completed
  pilot_closeout: governed by subordinate SEMP V3 after delivery/cancellation and feedback disposition
  archive: preserve canonical ArtifactVersion history and distribution/verification evidence; disposal plan governs protected data and active operational copies
glossary:
  SEMP: Plan that maps lifecycle work, products, authority, resources, risks and verification; not an external recipient deliverable by default
  subordinate_SEMP: existing one-pilot production plan V3 retained for actual E0/S01 execution
  supplier_track: SE-environment production/supply lifecycle whose client semantic state persists in consultantplus
  client_track: acquisition/use/change lifecycle owned by a concrete RIC
  current: product/activity can be truthfully performed in this request
  blocked: required external evidence/authority is absent
  conditional: lifecycle activity becomes applicable only after an upstream decision/event
change_procedure_and_history:
  change_rule: material lifecycle/WBS/authority/product-map changes require successor SEMP and affected plans
  history:
    - {version: V1, date: '2026-09-07', change: establish full dual-track lifecycle plan and standard-product matrix}
completion_process:
  current_request_complete_when: current six lifecycle target products and supporting TECH-VER are persisted and structurally checked; external lifecycle remains blocked explicitly
  lifecycle_complete_when: actual disposal/retirement conditions are fulfilled or the product is formally superseded with transition/retention obligations resolved
