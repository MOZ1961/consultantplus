  client_engineering_environment: ENV-CPLUS-ENGINEERING-001 / MOZ1961/consultantplus
  real_RIC_environment: unresolved_until_specific_RIC_selected
  security: minimum necessary de-identified input, no secrets/credentials, exact distribution lineage, protected data retention/disposal controls
training_and_briefing:
