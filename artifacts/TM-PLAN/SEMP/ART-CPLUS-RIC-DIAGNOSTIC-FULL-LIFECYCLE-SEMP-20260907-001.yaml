artifact_instance_purpose: >-
  Спланировать полный жизненный цикл продукта «Диагностика клиентского случая РИЦ» как двух связанных,
  но не смешиваемых контуров: производство/поставка через SE-среду и приобретение/использование/изменение
  конкретным РИЦ. Декомпозировать работы, стандартные ProcessType/O, нормативные информационные продукты,
  переходы, метрики, проверки и условия завершения; текущий узкий SEMP V3 сохранить как подчиненный план
  выполнения одного пилотного пакета, а не переписывать его назначение.
