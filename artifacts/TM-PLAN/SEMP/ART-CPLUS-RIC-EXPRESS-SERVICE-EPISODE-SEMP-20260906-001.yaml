  process_type_id: TM-PLAN
  process_instance_id: PI-CPLUS-TM-PLAN-RIC-EXPRESS-EPISODE-20260906-001
  activity_instance_id: AI-CPLUS-TM-PLAN-PLAN-RIC-PILOT-20260906-001
  methodic_instance:
    methodic_id: METH-CPLUS-TM-PLAN-RIC-PILOT
