artifact_instance_purpose: >-
  Внутренне спланировать производство и поставку пилотного пакета продуктов «Диагностика клиентского
  случая РИЦ»: определить полную WBS, процессы-производители продуктов пакета, роли, ресурсы, сроки,
  внутренние проверки, риски, информационную безопасность, выдачу и завершение. План является внутренним
  управляющим продуктом инженерной среды; РИЦ видит только состав своего пакета и внешнюю структуру работ
  внутри AGR-SUP → supply response.
