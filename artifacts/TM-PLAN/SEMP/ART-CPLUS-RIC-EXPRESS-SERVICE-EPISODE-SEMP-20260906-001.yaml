artifact_instance_purpose: >-
  Внутренне спланировать производство и поставку exact package definition
  ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001-V3 по Proposal V3: определить полную WBS,
  процессы-производители членов пакета, роли, ресурсы, сроки, проверки, риски, информационную безопасность,
  выдачу и завершение. План является внутренним управляющим продуктом и РИЦ не передается.
