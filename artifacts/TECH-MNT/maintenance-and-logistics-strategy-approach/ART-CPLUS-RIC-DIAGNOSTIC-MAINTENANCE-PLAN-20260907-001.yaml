artifact_instance_purpose: >-
  Установить план сопровождения продукта «Диагностика клиентского случая РИЦ»: какие наблюдения и изменения
  запускают сопровождение, как анализируются проблемы и запросы на изменение, как создаются successor ArtifactVersions,
  как выполняются пост-изменительная верификация и при необходимости повторная валидация, и когда вместо
  сопровождения требуется миграция, масштабирование либо вывод из применения.
