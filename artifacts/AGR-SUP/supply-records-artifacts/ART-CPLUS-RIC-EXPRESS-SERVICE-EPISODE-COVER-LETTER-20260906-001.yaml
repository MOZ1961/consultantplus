    title_ru: Предложение по пилотной поставке «Экспресс-разбор сервисного эпизода РИЦ»
    status: candidate_draft_not_yet_authorized_for_external_issue
    canonical_product: AGR-SUP → supply response
    exclusions_from_external_package:
      - ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-SEMP-20260906-001-V1
      - any internal process controls, work instructions or verification internals not explicitly included in the Proposal
  distribution_record_and_security_classification:
    intended_recipient_category: руководитель или уполномоченный сотрудник РИЦ КонсультантПлюс
    actual_recipient: not_established
    channel: not_established
    actual_sent_at: not_sent
    distribution_status: prepared_pending_owner_approval
    security_classification: recipient_review_no_confidential_client_data_included
    rule: do not send externally until owner explicitly authorizes issue and actual recipient/channel are recorded
  requested_next_action:
    - ознакомиться с Предложением
    - при заинтересованности выбрать одного сотрудника РИЦ и один недавний обезличенный сервисный эпизод
    - согласовать дату 45–60-минутной пилотной сессии
  human_readable_cover_letter: |-
    Уважаемые коллеги!

    Направляем на рассмотрение предложение о проведении пилотного «Экспресс-разбора сервисного эпизода РИЦ».

    Цель пилота — на одном реальном обезличенном случае проверить, как можно описать рабочую задачу клиента целиком: что требовалось решить, какую роль сыграл КонсультантПлюс, что дополнительно сделал РИЦ и где осталась неопределенность, задержка или иной разрыв.

    Для пилота со стороны РИЦ достаточно одного сотрудника, участвовавшего в недавнем клиентском случае, одного обезличенного эпизода и 45–60 минут на рабочую сессию. Выгрузки CRM, персональные данные клиентов, конфиденциальная переписка и коммерческие условия для начала не требуются.

    В приложенном Предложении приведены ожидаемый результат, состав работ, требуемое участие РИЦ, сроки, стоимость пилота, ограничения и порядок завершения.

    Если подход представляет интерес, предлагаем выбрать участника и эпизод и согласовать удобное время пилотной сессии.

    С уважением,
    уполномоченный представитель поставщика
    [ФИО и контакт указываются при внешней выдаче]
