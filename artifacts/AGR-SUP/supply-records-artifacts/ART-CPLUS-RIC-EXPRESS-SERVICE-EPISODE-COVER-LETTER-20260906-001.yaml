  human_readable_cover_letter: |-
    Уважаемые коллеги!

    Направляем на рассмотрение предложение о пилотной поставке пакета продуктов «Диагностика клиентского случая РИЦ».

    На одном реальном обезличенном случае предлагаем подготовить для РИЦ два результата: Отчет о диагностике клиентского сценария и отдельный Отчет о верификации результата. В основном Отчете будет показано, что требовалось решить клиенту, какой информационный путь был пройден, какую наблюдаемую роль сыграли КонсультантПлюс и сервис РИЦ и где сохранились подтвержденные разрывы или неопределенность. Второй Отчет покажет, в каких границах эти выводы проверены.

    Для пилота со стороны РИЦ достаточно одного сотрудника, участвовавшего в недавнем клиентском случае, одного обезличенного эпизода и 45–60 минут на рабочую сессию. Выгрузки CRM, персональные данные клиентов, конфиденциальная переписка и коммерческие условия для начала не требуются.

    В Предложении приведены состав пакета, структура работ, необходимое участие РИЦ, сроки, стоимость пилота, риски и порядок завершения.

    Если такой формат представляет интерес, предлагаем выбрать участника и эпизод и согласовать удобное время пилотной сессии.

    С уважением,
    уполномоченный представитель поставщика
    [ФИО и контакт указываются при внешней выдаче]
