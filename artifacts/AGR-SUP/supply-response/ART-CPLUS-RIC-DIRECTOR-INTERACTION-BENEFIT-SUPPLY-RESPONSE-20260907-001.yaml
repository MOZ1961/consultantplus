context: >-
  Публичная доказательная модель уже показывает, что возможности КонсультантПлюс шире модели «база документов»:
  система поддерживает переход от регулируемой рабочей ситуации к правовой основе, вариантам действий и рабочим
  артефактам, а РИЦ предоставляет комплекс сервисных действий вокруг использования системы. При этом открытые
  данные значительно лучше подтверждают возможности и промежуточные результаты, чем конечные клиентские и
  организационные эффекты. Поэтому директору РИЦ нужен не новый рекламный тезис, а управляемый способ установить,
  что именно его клиенты ценят, что реально добавляет РИЦ, какие формулировки допустимы и как их проверить.
designation: CPLUS-RIC-DIRECTOR-INTERACTION-BENEFIT-20260907-001
summary: >-
  Предлагается не «придумать позиционирование», а построить в РИЦ доказательный контур управления клиентской
  ценностью: клиентская ситуация → решение → вклад КонсультантПлюс → вклад РИЦ → наблюдаемый результат →
  доказательство → формулировка → проверка на клиенте → решение РИЦ об изменении или сохранении подхода.
  Первый бесплатный пилот на одном обезличенном эпизоде проверяет полезность метода для директора; дальнейшая
  работа масштабируется только после появления измеряемых оснований.
body:
  recipient_and_decision:
    recipient: директор или руководитель РИЦ КонсультантПлюс
    decision_supported: >-
      решить, стоит ли РИЦ построить собственный доказательный контур позиционирования и клиентской ценности,
      начиная с одного реального эпизода вместо немедленной разработки масштабной маркетинговой программы
    requested_next_action: выбрать один недавний обезличенный клиентско-сервисный эпизод и сотрудника, который знает его фактический ход

  director_view:
    headline: 'Не еще одна рекламная формулировка. Способ доказательно ответить клиенту: зачем ему КонсультантПлюс и зачем ему РИЦ.'
    three_management_concerns:
      positioning_for_client:
        concern: >-
          Перечень функций системы сам по себе все хуже отвечает на клиентский вопрос «что это меняет в моей работе и решении?». Нужна формулировка ценности через реальную профессиональную ситуацию и требуемое действие.
        response: >-
          Мы связываем конкретную ситуацию клиента с решением, которое он должен принять, фактическим информационным путем, возможностями КонсультантПлюс, вкладом РИЦ и наблюдаемым рабочим результатом.
      effective_and_verified_communication:
        concern: >-
          Сильная формулировка легко превращается в недоказанное обещание: снижение рисков, экономию, предотвращенные штрафы или рост качества решения нельзя автоматически выводить из факта использования продукта.
        response: >-
          Для каждого существенного тезиса фиксируем: что утверждаем, на каких данных, какова сила основания, где заканчивается доказательство, какое контрсвидетельство возможно и что нужно измерить дальше.
      lack_of_ready_network_support:
        concern: >-
          У конкретного РИЦ может не быть полученной от Сети готовой прикладной формулировки, набора доказательств или стратегии, пригодных именно для его клиентских диалогов и управленческих решений.
        response: >-
          РИЦ может построить собственную доказательную модель на реальных эпизодах, не объявляя ее официальной позицией Сети. Повторяющиеся доказательства затем можно передавать в Сеть как структурированный продуктовый сигнал.
        evidence_boundary: >-
          Этот продукт не утверждает, что у Сети в целом отсутствует стратегия. Публичные материалы указывают на стратегическую и технологическую роль Координационного центра; не установлено лишь наличие у конкретного РИЦ готового доказательного контура, решающего перечисленные здесь задачи.

    positioning_principle:
      weak_form: 'У нас есть большая правовая база, готовые решения, поиск, формы, обучение и сервис.'
      stronger_candidate: >-
        КонсультантПлюс помогает специалисту пройти путь от регулируемой рабочей ситуации к актуальной правовой основе, вариантам действий и рабочему результату; РИЦ помогает пройти участки этого пути, где самообслуживания недостаточно.
      status: analytical_candidate_supported_by_open_source_capability_evidence_not_official_network_positioning

    what_we_can_do_for_RIC:
      - id: CAP-01
        capability: построить карту клиентской ценности по реальным решениям, а не по перечню функций
        output: решение клиента → информационный путь → роль КонсультантПлюс → роль РИЦ → результат → разрыв
      - id: CAP-02
        capability: сформулировать доказуемое позиционирование по ролям, ситуациям и решениям
        output: уровни формулировок с evidence boundary и статусом доказанности
      - id: CAP-03
        capability: установить, где именно РИЦ создает дополнительную ценность
        output: сценарии самообслуживания, сценарии значимого вмешательства РИЦ и повторяющиеся сервисные разрывы
      - id: CAP-04
        capability: превратить доказательную модель в материалы продаж, сопровождения и обучения
        output: карточки «ситуация → решение → КП → РИЦ → результат», сценарии разговора, вопросы диагностики, демонстрации и аргументы продления
      - id: CAP-05
        capability: проверить позиционирование на реальных клиентах
        output: измерения понимания, изменения решения, пригодности к действию, результата вмешательства и повторяемости
      - id: CAP-06
        capability: сформировать доказательную обратную связь в Сеть
        output: повторяющийся клиентский разрыв с контекстом, частотой, критичностью, обходным путем, вкладом сервиса и наблюдаемым результатом вместо общего пожелания

    operating_chain:
      - '1. Зафиксировать исходную заботу директора и решение, для которого нужна лучшая доказательная база.'
      - '2. Взять один недавний обезличенный клиентский эпизод и восстановить фактический путь без подсказки желаемого ответа.'
      - '3. Разделить вклад КонсультантПлюс, РИЦ, клиента и других источников; неизвестное оставить not_established.'
      - '4. Вывести кандидатные тезисы позиционирования только из наблюдаемой цепочки и открытой доказательной базы.'
      - '5. Верифицировать трассируемость тезисов, границы доказательности и отсутствие подмены причинности.'
      - '6. Проверить формулировки на клиенте отдельно от исходного интервью и измерить результат.'
      - '7. После 3–5 эпизодов проверить повторяемость; после достаточной выборки — решать о стандартизации, масштабировании или отказе.'

    proof_metrics:
      purpose: не измерять «красоту презентации», а получать опровержимые доказательства полезности
      selected_metrics:
        - {metric_id: C02, question: изменило ли использование КонсультантПлюс или РИЦ первоначально предполагаемое действие клиента}
        - {metric_id: C06, question: какое вмешательство РИЦ было выполнено и какой наблюдаемый результат последовал}
        - {metric_id: C08, question: способен ли пользователь позже решить сходную задачу самостоятельно после помощи РИЦ}
        - {metric_id: C14, question: позволила ли диагностика директору определить действие, обоснованно ничего не менять или признать недостаточность данных}
        - {metric_id: C15, question: что изменилось после реально выполненного изменения и сопоставимого повторного эпизода}
        - {metric_id: C16, question: использовал ли уполномоченный участник Сети агрегированные доказательства РИЦ в реальном решении или обоснованно отклонил их}
      admissible_claim_states: [SUPPORTED, NOT_SUPPORTED, INSUFFICIENT_EVIDENCE, NOT_APPLICABLE]
      rule: отсутствие эффекта и недостаточность данных являются допустимыми результатами, а не поводом усиливать формулировку

    what_the_director_gets:
      - карта того, за что клиент реально использует КонсультантПлюс в выбранном сценарии
      - отдельная карта вклада РИЦ и точек, где сервис действительно необходим или избыточен
      - набор формулировок с доказательным статусом и запрещенными усилениями
      - список конкретных решений для продаж, обучения, сопровождения и продуктовой обратной связи
      - измерительный план проверки формулировок и изменений
      - трасса «вывод → эпизод/источник → метрика → решение»

    what_we_do_not_promise:
      - не выдаем аналитическую формулировку за официальную позицию КонсультантПлюс или Сети
      - не утверждаем отсутствие стратегии у Сети без внутреннего доказательства; фиксируем лишь прикладной разрыв конкретного РИЦ, если он подтвержден самим РИЦ
      - не обещаем ROI, предотвращенные штрафы, снижение общего риска или рост прибыли без отдельного дизайна и данных
      - не переносим вывод одного эпизода или одного РИЦ на всю Сеть
      - не принимаем профессиональное решение вместо клиента и управленческое решение вместо директора РИЦ

    why_start_small: >-
      Один эпизод не доказывает рынок и не формирует стратегию, но достаточен для дешевой проверки главного:
      дает ли метод директору новое, трассируемое и пригодное к действию знание. Если нет — масштабировать нельзя.
      Если да — 3–5 эпизодов позволяют проверить повторяемость сценариев и только затем расширять выборку.
    pilot_success_for_director: >-
      Успех первого пилота — директор после разбора может назвать как минимум одно управленческое решение,
      которое стало лучше обосновано новым фактом или выявленным разрывом, и проследить основание этого решения
      к конкретному эпизоду/источнику. Это критерий полезности метода, а не доказательство бизнес-эффекта.
    call_to_action: >-
      Выберите один недавний обезличенный случай и сотрудника, который его знает. За одну сессию проверим не
      презентацию, а способность получить для ваших решений новое доказательное знание и из него — допустимую
      клиентскую формулировку.

  relation_to_existing_proposal:
    proposal_version: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-PROPOSAL-20260906-001-V4
    relation: >-
      Это главное директорское представление верхнего уровня. Диагностика одного эпизода — первый метод проверки
      этой способности и вход в последующий доказательный контур, а не конечный предмет предложения.
    no_duplicate_authority: commercial terms and any external issue remain controlled by exact proposal/owner authority

  commercial_and_cost:
    proposed_cost:
      amount_rub: 0
      basis: existing Proposal V4 defines the first one-episode pilot as a candidate zero-cost pilot
      boundary: this supply response does not create an independent commercial commitment
    subsequent_work: not_established; scope and price require separate evidence and agreement

  schedule:
    pilot_entry: one de-identified recent episode plus one knowledgeable RIC participant
    session: approximately 45-60 minutes under Proposal V4
    first_output: evidence-backed reconstruction, candidate value statements, gaps and next measurement decision
    recurrence_check: 3-5 episodes only after first-pilot usefulness is established
    dates: not_established

  proposal_risks:
    - {risk: director reads the candidate as official Network positioning, mitigation: explicit non-official status and authority boundary}
    - {risk: concern about lack of Network support is converted into a claim that the Network has no strategy, mitigation: phrase as a concrete RIC-side applicability gap requiring stakeholder confirmation}
    - {risk: marketing language outruns evidence, mitigation: claim-evidence-counterevidence trace and four-state disposition}
    - {risk: one episode is generalized to clients or the Network, mitigation: one episode tests method usefulness only; recurrence requires multiple observations}
    - {risk: RIC activity is confused with causation of client outcome, mitigation: separate contributions and require post-change observation for stronger claims}
    - {risk: interview is biased by showing our positioning first, mitigation: unaided evidence before aided reaction in the governing measurement plans}

  delivery_methodology:
    approach: decision-centered episode reconstruction plus contribution separation plus evidence trace plus measurement plus independent verification
    source_register_ref: ARTVER-CPLUS-RIC-PILOT-METHOD-SOURCE-REGISTER-20260907-001-V1
    method_justification_ref: ARTVER-CPLUS-BMA-RIC-PILOT-METHOD-JUSTIFICATION-20260907-001-V1
    measurement_plan_ref: ARTVER-CPLUS-RIC-DIRECTOR-QUESTIONNAIRE-MEASUREMENT-PLAN-20260907-001-V2
    positioning_ref: ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V3
    lifecycle_measurement_ref: ARTVER-CPLUS-RIC-DIAGNOSTIC-LIFECYCLE-MEASUREMENT-PLAN-20260907-001-V2
    proof_model_ref: ARTVER-CPLUS-RIC-DIAGNOSTIC-BENEFIT-PROOF-MODEL-20260907-001-V2
    evidence_rule: >-
      unknown remains not_established; unaided evidence is collected before showing candidate positioning; source capability
      evidence is separated from empirical client outcome; causal/financial claims require specific measurement and counterevidence.

  supplier_experience_and_capabilities:
    established:
      - open-source evidence model of ConsultantPlus client value and explicit evidence gaps exists as a standard TECH-BMA product
      - source register preserves stable references, paraphrased source bodies, claim mappings and limitations
      - method-justification report links the diagnostic sequence to source-supported reasoning and explicit boundaries
      - director interview, pilot and lifecycle measurement plans exist as standard TM-MEAS products with unaided-before-aided rules
      - benefit proof model defines falsifiable claim states and links claims to S/C/G evidence
      - one-episode Proposal V4 defines a bounded zero-cost entry point
      - standard-product composition and verification are governed by ГОСТ Р 58609/ISO 15289 plus PPR-001..012
    not_established:
      - usefulness of this exact representation for a real external RIC director
      - whether a specific RIC actually lacks usable Network positioning support
      - Network-wide recurrence or prevalence of the identified gaps
      - willingness to pay for subsequent work
      - causal financial or client-outcome effect
      - official ConsultantPlus/Network adoption of any proposed positioning

  authorization:
    preparation_authority: owner explicitly requested the director-facing representation and its execution in the repository
    local_verification_authority: owner requires verification to be executed locally
    external_issue_state: not_performed
    commercial_commitment: not_created_by_this_product
    official_positioning_adoption: not_granted

  tailoring_proposal:
    applicability: not_applicable
    disposition: no lifecycle-process tailoring is proposed by this supply response
    basis: the product uses the existing process-owned lifecycle and standard information-product mappings

  exclusions:
    - legal or tax opinion
    - client professional decision
    - claim that the Network has no strategy
    - official Network positioning
    - Network-wide market claim from one RIC
    - ROI or prevented-fine guarantee
    - automatic product requirement without decision authority

standard_product_composition:
  generic_profile:
    standard: ГОСТ Р 58609-2019 / ISO/IEC/IEEE 15289:2017
    section: '7.2'
    type: description
    expected_requirement_ids: [U7.2-A,U7.2-B,U7.2-C,U7.2-D,U7.2-E,U7.2-F,U7.2-G,U7.2-H,U7.2-I]
  specific_profile:
    section: '10.56'
    information_item: proposal
    required_requirement_ids: [S10.56-R01,S10.56-R02,S10.56-R03,S10.56-R04,S10.56-R05,S10.56-R06]
