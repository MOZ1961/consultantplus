scope: >-
  Директорское представление перед обсуждением контролируемого пилота. Оно охватывает позиционирование
  КонсультантПлюс и сервиса РИЦ через клиентские решения, доказательную дисциплину формулировок, способ
  компенсировать отсутствие у конкретного РИЦ готового прикладного контура формулировок, проверку на реальных
  эпизодах и превращение повторяющихся наблюдений в структурированную обратную связь. Не охватывает официальное
  принятие позиционирования Сетью, обещание экономического эффекта, договорные обязательства или причинное
  доказательство результата без эмпирических данных.
