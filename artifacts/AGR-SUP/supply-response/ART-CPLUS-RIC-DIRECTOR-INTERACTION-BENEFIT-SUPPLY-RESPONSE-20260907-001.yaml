glossary:
  evidence_based_positioning: позиционирование, существенные тезисы которого имеют явные основания, границы и способ проверки
  client_decision: профессиональное или управленческое решение клиента, ради которого используется информация и сервис
  management_usefulness: способность результата поддержать конкретное решение директора РИЦ трассируемыми данными
  contribution: доказательно ограниченный вклад участника; не равен исключительной причинности результата
  episode: конкретная недавняя клиентско-сервисная ситуация с триггером, решением, информационным путем, действиями и наблюдаемым состоянием
  supply_response: процессный ответ поставщика, представленный здесь как краткое предложение руководителю РИЦ
  official_positioning: формулировка, принятая уполномоченным органом Сети; данным продуктом не устанавливается

