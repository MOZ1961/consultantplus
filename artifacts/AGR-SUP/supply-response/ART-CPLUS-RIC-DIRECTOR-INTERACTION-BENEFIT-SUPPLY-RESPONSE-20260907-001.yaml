  Дать руководителю РИЦ короткое понятное объяснение предлагаемого взаимодействия и его возможной пользы:
  не еще один отчет об активности сервиса, а доказательный разбор реальных клиентских решений и вклада
  КонсультантПлюс/РИЦ, который может дать руководителю более пригодное основание для решений о сервисе,
  обучении, клиентских сценариях и последующих улучшениях. Сохранить ограничения доказуемости и не
