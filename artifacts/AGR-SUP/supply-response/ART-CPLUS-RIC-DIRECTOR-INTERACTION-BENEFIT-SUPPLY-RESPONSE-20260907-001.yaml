scope: >-
  Краткое внешнее объяснение руководителю РИЦ перед обсуждением пилота. Продукт описывает проблему,
  механику взаимодействия, управленческую пользу, стоимость первого пилота, график, риски, метод выполнения,
  релевантные возможности, полномочия и отсутствие предлагаемого tailoring. Он не является официальным
  позиционированием Сети, договором, тарифом, доказательством ROI или гарантией улучшения результата клиента.
issuing_organization: owner-authorized engineering environment
