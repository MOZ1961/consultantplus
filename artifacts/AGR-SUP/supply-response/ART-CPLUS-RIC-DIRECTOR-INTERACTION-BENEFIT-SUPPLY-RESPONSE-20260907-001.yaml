artifact_instance_purpose: >-
  Дать директору РИЦ краткое и проверяемое представление возможностей среды для решения трех связанных
  управленческих забот: как позиционировать КонсультантПлюс для клиента через его реальные решения и
  результаты; как доносить пользу эффективно, не переходя к недоказанным рекламным обещаниям; как действовать,
  если у РИЦ нет полученной от Сети готовой и применимой к конкретному клиентскому диалогу формулировки,
  методики или стратегии. Продукт представляет предложение поставщика, а не официальное позиционирование Сети,
  и полностью материализует применимый состав ГОСТ Р 58609-2019 §7.2 + §10.56, PPR-001..012 и парную ISO/ГОСТ-трассировку.
