  episode: concrete recent client or service situation with trigger required action information path interventions and observable status
  contribution: evidence-bounded role of one participant in the episode and not equivalent to exclusive causality
  supply_response: process-owned supplier response represented here as a concise proposal for the RIC director
  pilot: bounded test of method on real de-identified evidence and not adoption or rollout
