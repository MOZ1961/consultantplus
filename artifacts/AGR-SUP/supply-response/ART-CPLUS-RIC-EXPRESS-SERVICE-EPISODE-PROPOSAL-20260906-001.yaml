      - {canonical_output: 'TM-MEAS → measurement register', reason: 'внутренняя доказательная запись; существенные подтвержденные сведения отражаются в основном Отчете'}
      - {canonical_output: 'TECH-OP → operation report', reason: 'внутренняя фиксация исполнения инженерной среды'}
    package_completion_rule: >-
      Пакет сформирован только после создания exact TECH-BMA и TECH-VER ArtifactVersion по реальному
      эпизоду, успешной требуемой верификации и регистрации их точных версий в successor package register.

  information_required_from_RIC:
