scope: >-
  Однократная пилотная поставка пакета продуктов по одному обезличенному реальному сервисному эпизоду
  РИЦ с одним сотрудником РИЦ: минимальный вход, 45–60-минутная рабочая сессия, реконструкция клиентского
  сценария решения, анализ вклада КонсультантПлюс и сервиса РИЦ, выявление разрывов, формирование
  основного аналитического Отчета, отдельная верификация и обсуждение результата. Методические основания
  и их ограничения включены в краткой форме; сетевой, финансовый и причинный эффект одним пилотом не доказываются.
