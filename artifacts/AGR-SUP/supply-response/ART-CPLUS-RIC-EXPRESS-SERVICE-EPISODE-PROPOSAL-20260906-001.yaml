glossary:
  РИЦ: региональный информационный центр КонсультантПлюс как получатель пакета продуктов инженерной среды
  пакет продуктов: управляемая совокупность самостоятельных process-owned информационных продуктов; пакет не новый canonical O
  сервисный эпизод: конкретный случай взаимодействия РИЦ с клиентом по рабочей задаче или решению
  сценарий решения: последовательность от клиентской задачи и оснований решения до действий участников и наблюдаемого результата
  доказательная база метода: контролируемая совокупность источников, их содержательных парафразов, поддерживаемых суждений и ограничений
  вклад: подтверждаемая роль вмешательства среди других действующих причин; не тождествен полной причинности результата
  паспорт сценария: представление части канонического TECH-BMA Отчета
  карта покрытия: представление вклада СПС РИЦ клиента и иных источников внутри TECH-BMA Отчета
  карта разрывов: представление подтвержденных точек неопределенности задержек передач или обходов внутри TECH-BMA Отчета
  SEMP: внутренний канонический выход TM-PLAN; РИЦ не передается
