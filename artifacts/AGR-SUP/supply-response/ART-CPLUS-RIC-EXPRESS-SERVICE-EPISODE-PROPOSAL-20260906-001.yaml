context: >-
  РИЦ хорошо видит собственные действия — консультации, обучение, сопровождение, настройку, эскалацию,
  — но обычная сервисная запись не показывает, в каком профессиональном решении клиента действие стало
  существенным, что произошло до обращения и после него, какая часть результата связана с СПС, какая —
  с РИЦ, клиентом и иными источниками. Пилот создает именно эту недостающую единицу управленческого знания:
  решение клиента → путь принятия → вклад участников → наблюдаемый результат → подтвержденный разрыв.
designation: CPLUS-RIC-PROP-E0-S01-20260906-001
summary: >-
  Предлагается бесплатно проверить на одном реальном обезличенном случае, можно ли превратить привычную
  сервисную историю РИЦ в проверяемую модель клиентского решения. РИЦ предоставляет одного сотрудника
  и один недавний эпизод; поставщик за 45–60 минут восстанавливает путь решения и в течение до трех
  рабочих дней выдает два самостоятельных продукта: Отчет о диагностике клиентского сценария и Отчет
  о верификации. Методика опирается на Critical Incident/Decision Method, исследования клиентского пути,
  service blueprinting и contribution analysis. Пилот не обещает ROI, предотвращенные штрафы, общее
  снижение риска или репрезентативность по Сети: его задача — проверить полезность самой единицы анализа
  и получить первый управленчески пригодный случай.
body:
  recipient_and_subject:
    recipient: директор или уполномоченный руководитель РИЦ КонсультантПлюс
    subject: пилотная поставка пакета продуктов «Диагностика клиентского случая РИЦ»
    recipient_decision_requested: выбрать одного участника, один недавний обезличенный эпизод и согласовать время пилотной сессии

  recipient_facing_short_version:
    headline: 'Понять не только что сделал РИЦ, а где именно он создал ценность в решении клиента'
    problem: >-
      Звонок, консультация, обучение или использованная функция показывают активность. Для развития сервиса
      директору важнее другое: какое решение должен был принять клиент, где он остановился, что изменилось
      после вмешательства РИЦ и какую часть результата дали КонсультантПлюс, РИЦ, сам клиент и другие источники.
    offer: >-
      Возьмем один недавний обезличенный случай и за одну рабочую сессию восстановим цепочку
      «задача клиента → путь решения → роль КонсультантПлюс → роль РИЦ → результат → разрывы».
      Через два рабочих дня после сессии РИЦ получает основной Отчет и отдельный Отчет о его верификации.
    why_it_matters_for_RIC: >-
      Такой объект позволяет увидеть, какие вмешательства РИЦ действительно нужны в конкретных сценариях,
      какие затруднения повторяются как кандидаты на улучшение, чему обучать сотрудников и пользователей и
      какой конкретный участок клиентского решения можно объяснять как ценность сервиса РИЦ.
    why_it_matters_for_consultantplus: >-
      Накопление однотипных эпизодов потенциально дает Координационному центру более содержательный сигнал,
      чем отдельная просьба «добавить функцию»: фиксируются задача, точка затруднения, использованные
      возможности системы, действие РИЦ, обходной путь и наблюдаемый результат. Использование такого сигнала
      КЦ еще должно быть проверено и не заявляется как установленный эффект.
    why_it_matters_for_client: >-
      Метод делает будущие изменения сервиса привязанными к реальным профессиональным ситуациям клиента,
      а не только к внутренним представлениям поставщика. Измеримое улучшение клиентского результата требует
      последующего цикла «разрыв → изменение → новый эпизод → сравнение» и одним пилотом не доказывается.
    pilot_boundary: >-
      Один эпизод проверяет полезность метода и результата для конкретного РИЦ. Он не доказывает частотность
      паттернов по Сети, финансовый эффект, готовность платить, предотвращенные штрафы или общее снижение риска.
    call_to_action: >-
      От РИЦ требуется один сотрудник, один конкретный недавний случай и 45–60 минут. Стоимость первого пилота — 0 руб.

  method_evidence_basis:
    evidence_products:
      source_register:
        artifact_version_id: ARTVER-CPLUS-RIC-PILOT-METHOD-SOURCE-REGISTER-20260907-001-V1
        exact_address: MOZ1961/consultantplus:artifacts/TM-IM/information-register/ART-CPLUS-RIC-PILOT-METHOD-SOURCE-REGISTER-20260907-001.yaml@5ec3ceb8d77b0815fd9fef7b3281497caf621b58
      method_justification_report:
        artifact_version_id: ARTVER-CPLUS-BMA-RIC-PILOT-METHOD-JUSTIFICATION-20260907-001-V1
        exact_address: MOZ1961/consultantplus:artifacts/TECH-BMA/business-or-mission-analysis-report/ART-CPLUS-BMA-RIC-PILOT-METHOD-JUSTIFICATION-20260907-001.yaml@5ec3ceb8d77b0815fd9fef7b3281497caf621b58
    concise_anchors:
      - id: ME-01
        claim: конкретный недавний эпизод информативнее общего мнения для реконструкции фактического поведения и решения
        source_ids: [SRC-FLANAGAN-CIT-1954, SRC-KLEIN-CDM-1989]
        stable_links: [https://doi.org/10.1037/h0061470, https://doi.org/10.1109/21.31053]
        body_summary: >-
          Critical Incident Technique систематизирует конкретные значимые наблюдения; Critical Decision Method
          развивает incident-based подход для извлечения ключевых признаков и оснований сложного решения.
        supports_works: [W01, W03, W04]
      - id: ME-02
        claim: обращение в РИЦ надо рассматривать как часть полного пути до и после точки контакта
        source_ids: [SRC-LEMON-VERHOEF-2016, SRC-BITNER-OSTROM-MORGAN-2008]
        stable_links: [https://doi.org/10.1509/jm.15.0420, https://doi.org/10.2307/41166446]
        body_summary: >-
          Исследования customer journey показывают множественность точек контакта, а service blueprinting
          связывает действия клиента, сотрудников и технологий и помогает обнаруживать зависимости и точки улучшения.
        supports_works: [W04, W06]
      - id: ME-03
        claim: вклад РИЦ нужно отделять от полного причинного присвоения результата
        source_ids: [SRC-VARGO-LUSCH-2004, SRC-MAYNE-2012]
        stable_links: [https://doi.org/10.1509/jmkg.68.1.1.24036, https://doi.org/10.1177/1356389012451663]
        body_summary: >-
          Сервисная логика рассматривает ценность как совместно создаваемую участниками; contribution analysis
          требует учитывать другие причины и не приписывать вмешательству весь результат без доказательного дизайна.
        supports_works: [W05]
      - id: ME-04
        claim: фактологическая сверка с участником полезна, но не заменяет независимую проверку интерпретации
        source_ids: [SRC-BIRT-ETAL-2016]
        stable_links: [https://doi.org/10.1177/1049732316654870]
        body_summary: >-
          Member checking помогает проверить точность и соответствие опыта участника, однако согласие участника
          не является автоматическим доказательством истинности всей аналитической интерпретации.
        supports_works: [W06, W08]
      - id: ME-05
        claim: для управленческого применения выводы должны сохранять доказательную трассу и границы утверждений
        source_ids: [SRC-ROUSSEAU-2006, SRC-SOPBENCH-2025]
        stable_links: [https://doi.org/10.5465/AMR.2006.20208679, https://arxiv.org/abs/2503.08669]
        body_summary: >-
          Evidence-based management требует опоры на лучшую доступную доказательную базу; SOPBench в своей
          предметной области показывает полезность раздельной оценки результата и корректности процедуры.
        supports_works: [W07]
    evidence_boundary: >-
      Методические источники поддерживают выбор единицы анализа, реконструкцию решения, whole-journey контекст,
      разделение вкладов, поиск разрывов и доказательную дисциплину. Они не являются эмпирическим доказательством
      того, что этот сервис уже улучшает показатели РИЦ, продукт КонсультантПлюс или клиентские outcomes.

  proposed_product_package:
    package_register_ref: ARTVER-CPLUS-RIC-PRODUCT-PACKAGE-REGISTER-20260906-001-V3
    package_id: RIC-PKG-E0-S01-001
    package_title_ru: Пилотный пакет продуктов «Диагностика клиентского случая РИЦ»
    package_purpose: >-
      Дать РИЦ два самостоятельных продукта: содержательный анализ реального клиентского случая и
      отдельное доказательство того, что этот анализ проверен в заявленных границах.
    recipient_value_products:
