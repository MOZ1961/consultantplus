      - {id: W08, work: Передача и обсуждение пакета, content: передать exact версии двух продуктов и зафиксировать замечания и оценку полезности отдельно от фактологической корректировки, required_from_RIC: рассмотреть пакет и сообщить корректировки/оценку, result: переданный пакет и запись обратной связи, duration: не позднее 3-го рабочего дня; обсуждение до 30 минут, responsibility: обе стороны, completion_criterion: exact версии переданы; замечания и дальнейшее решение зафиксированы, method_basis: ME-04}

