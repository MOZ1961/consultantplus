artifact_instance_purpose: >-
  Сформировать нормативно полный внешний продукт «Предложение» для РИЦ на поставку пакета
  информационных продуктов «Диагностика клиентского случая РИЦ». Предложение использует exact upstream
  определение пакета, называет продукты ценности для РИЦ и внешнюю структуру работ по их производству.
  Полный План/SEMP, полная WBS и внутренние доказательные/операционные продукты адресату не передаются.
producer:
  process_type_id: AGR-SUP
  process_instance_id: PI-CPLUS-AGR-SUP-RIC-EXPRESS-EPISODE-PROPOSAL-20260906-001
  activity_instance_id: AI-CPLUS-AGR-SUP-PREPARE-RIC-PROPOSAL-20260906-001
  methodic_instance: {methodic_id: METH-CPLUS-AGR-SUP-RIC-PROPOSAL, methodic_version_id: METHVER-CPLUS-AGR-SUP-RIC-PROPOSAL-V1, methodic_version: runtime-provisional-v1, status: provisional_runtime_not_adopted}
