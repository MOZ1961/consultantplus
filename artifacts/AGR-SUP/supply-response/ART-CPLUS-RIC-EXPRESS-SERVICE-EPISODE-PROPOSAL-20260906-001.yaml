scope: >-
  Однократный пилотный разбор одного обезличенного реального сервисного эпизода РИЦ с одним
  сотрудником РИЦ, включая получение минимальной исходной информации, 45–60-минутную рабочую
  сессию, реконструкцию клиентского сценария, анализ вклада КонсультантПлюс и сервиса РИЦ,
  выявление разрывов, предметную верификацию результата и передачу участнику.
issuing_organization: owner-authorized MOZ1961/consultantplus client engineering environment
references:
  - ARTVER-CPLUS-BMA-PARTICIPANT-OFFER-INFORMATION-EXCHANGE-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-SYSTEM-REQUIREMENTS-20260905-001-V2
  - ARTVER-CPLUS-OFFER-EXECUTION-ARCHITECTURE-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-DESIGN-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-IMPLEMENTATION-PROCEDURE-20260905-001-V1
  - ARTVER-CPLUS-OFFER-EXECUTION-CANARY-VERIFICATION-REPORT-20260905-001-V1
context: >-
  РИЦ рассматривается как сторона, сопровождающая использование КонсультантПлюс и взаимодействующая
  с клиентом. Предложение проверяет практический переход от обслуживания функций системы к анализу
  конкретного рабочего решения клиента. Результаты пилота не являются официальным продуктом Сети,
  коммерческой политикой РИЦ, юридическим заключением или доказательством экономического эффекта.
designation: CPLUS-RIC-PROP-E0-S01-20260906-001
summary: >-
  Предлагается бесплатно провести один пилотный «Экспресс-разбор сервисного эпизода РИЦ».
  РИЦ предоставляет одного сотрудника и один недавний обезличенный эпизод. Инженерная среда
  возвращает верифицированное описание сценария решения, представление вклада КонсультантПлюс/РИЦ
  и представление обнаруженных разрывов. Внешний цикл занимает до трех рабочих дней после получения
  достаточной исходной информации; сама сессия — 45–60 минут. Внутренний план и внутренние
  инженерные продукты адресату не передаются.
body:
  recipient_and_subject:
    recipient: руководитель или уполномоченный сотрудник РИЦ КонсультантПлюс
    subject: пилотная поставка «Экспресс-разбор сервисного эпизода РИЦ»
    recipient_decision_requested: выбрать одного участника, один обезличенный эпизод и согласовать время пилотной сессии
  proposed_result:
    participant_facing_result: >-
      Верифицированный разбор одного сервисного эпизода от клиентской ситуации до фактического статуса решения,
      с разделением вклада КонсультантПлюс, сервиса РИЦ, клиента и иных источников и с явной фиксацией
      оставшейся неопределенности.
    recipient_views:
      - Паспорт критичного сценария решения — представление внутри канонического TECH-BMA отчета.
      - Карта покрытия сценария КонсультантПлюс и сервисом РИЦ — представление внутри того же TECH-BMA отчета.
      - Карта разрывов, задержек и обходных путей — представление внутри того же TECH-BMA отчета.
    canonical_execution_products:
      - TM-MEAS → measurement register — запись фактических исходных сведений и доказательных классов.
      - TECH-BMA → business or mission analysis report — анализ сценария и участнику выдаваемые представления.
      - TECH-VER → verification report — проверка трассируемости, полноты и границ утверждений.
      - TECH-OP → operation report — внутренняя фиксация фактического исполнения запроса.
  information_required_from_RIC:
    minimum:
      - один сотрудник РИЦ, участвовавший в реальном клиентском эпизоде
      - один недавний обезличенный эпизод: что требовалось клиенту решить или сделать
      - что именно сделал РИЦ: консультация, сопровождение, обучение, настройка или эскалация
      - где в эпизоде использовался КонсультантПлюс и какую наблюдаемую роль он сыграл
      - чем закончился эпизод на момент сессии и что осталось нерешенным или неясным
    useful_if_available:
      - сроки или давление времени в эпизоде
      - участники передачи/эскалации без персональных идентификаторов
      - повторяется ли аналогичный запрос у других клиентов
    not_required_for_pilot:
      - ФИО клиента и контактных лиц
      - сырой экспорт CRM
      - точные договорные цены, скидки и маржа
      - конфиденциальная переписка клиента
      - учетные данные, пароли, ключи или подробная схема информационной безопасности
  work_structure_for_recipient:
    derivation_rule: >-
      Это внешнее представление работ, производное от внутреннего TM-PLAN → SEMP. Оно содержит только
      то, что необходимо РИЦ для понимания поставки, участия и приемки; внутренний SEMP не передается.
    works:
      - id: W01
        work: Выбор эпизода и участника
        content: определить один реальный недавний сервисный случай, подходящий для обезличенного разбора
        required_from_RIC: назначить участника и кратко обозначить эпизод
        result: согласованный объект пилота
        duration: до 1 рабочего дня со стороны РИЦ
        responsibility: РИЦ при методической поддержке поставщика
        completion_criterion: участник и эпизод определены, исключенные категории данных не требуются
      - id: W02
        work: Прием и минимизация исходной информации
        content: получить минимальные сведения, удалить/не принимать лишние идентификаторы и секреты, классифицировать доказательную основу
        required_from_RIC: краткое обезличенное описание эпизода
        result: достаточный вход для сессии либо явный перечень недостающих сведений
        duration: до 0.5 рабочего дня после получения описания
        responsibility: поставщик
        completion_criterion: каждый обязательный вход имеет значение, none или not_established; чувствительные данные не нужны
      - id: W03
        work: Рабочая сессия
        content: последовательно восстановить клиентскую ситуацию, требуемое решение, информационный путь, действия РИЦ и фактический статус
        required_from_RIC: участие назначенного сотрудника
        result: фактическая запись эпизода
        duration: 45–60 минут
        responsibility: поставщик и участник РИЦ
        completion_criterion: достаточность фактов подтверждена участником; неизвестное не заменено предположением
      - id: W04
        work: Реконструкция сценария решения
        content: связать триггер, требуемое действие, доказательный путь, передачи и итоговый статус
        required_from_RIC: только точечные уточнения при необходимости
        result: проект паспорта критичного сценария
        duration: до 0.5 рабочего дня
        responsibility: поставщик
        completion_criterion: существенные поля сценария трассируются к фактам эпизода либо помечены как неустановленные
      - id: W05
        work: Анализ покрытия КонсультантПлюс и сервисом РИЦ
        content: отдельно классифицировать вклад СПС, сервиса РИЦ, клиента/коллег и иных источников
        required_from_RIC: при необходимости подтвердить фактические действия РИЦ
        result: проект карты покрытия
        duration: до 0.5 рабочего дня
        responsibility: поставщик
        completion_criterion: вклад сторон разделен; причинный эффект не приписан без доказательств
      - id: W06
        work: Выявление разрывов
        content: зафиксировать неопределенность, задержки, ручные обходы, передачи и барьеры доступа, подтвержденные эпизодом
        required_from_RIC: подтвердить или поправить фактическое описание
        result: проект карты разрывов
        duration: в составе аналитического дня
        responsibility: поставщик с фактологической сверкой РИЦ
        completion_criterion: факт, оценка участника и аналитический вывод различимы
      - id: W07
        work: Формирование и верификация результата
        content: сформировать канонический аналитический продукт и проверить нормативный состав, трассируемость и запрещенные недоказанные выводы
        required_from_RIC: не требуется
        result: верифицированный комплект представлений для РИЦ
        duration: до конца 2-го рабочего дня после сессии
        responsibility: поставщик
        completion_criterion: TECH-VER не содержит обязательных unresolved/failed; финансовые, правовые и причинные выводы не выдуманы
      - id: W08
        work: Передача и обсуждение
        content: передать результат, разобрать наблюдения и зафиксировать фактологические замечания и оценку полезности
        required_from_RIC: рассмотреть результат и сообщить корректировки/оценку полезности
        result: переданный результат и запись обратной связи
        duration: передача не позднее 3-го рабочего дня; обсуждение до 30 минут по согласованию
        responsibility: обе стороны
        completion_criterion: комплект передан, замечания и дальнейшее решение явно зафиксированы
  commercial_and_cost:
    proposed_cost:
      amount_rub: 0
      basis: один пилотный E0/S01 разбор предоставляется без оплаты для проверки полезности и поставочного контура
      boundary: >-
        Это кандидатное условие данного черновика. Оно не становится официальным обязательством РИЦ/Сети
        и не действует до отдельного разрешения владельца на внешнюю выдачу предложения.
    subsequent_work: стоимость последующих работ не установлена и должна определяться отдельным предложением после пилота
  schedule:
    trigger: получение достаточного минимального входа и согласованного времени сессии
    overall_target: до 3 рабочих дней от достаточного входа до передачи результата
    session: 45–60 минут
    result_preparation: не более 2 рабочих дней после сессии
    optional_review: до 30 минут по согласованию после передачи
  proposal_risks:
    - risk: выбранный эпизод слишком общий или недостаточно свежий
      mitigation: до сессии проверить минимальную конкретность W01/W02
    - risk: воспоминания участника неполны или смешивают факты и оценки
      mitigation: раздельно маркировать факт, оценку, аналитический вывод и not_established
    - risk: в описание попадут лишние конфиденциальные или персональные данные
      mitigation: применять минимизацию; не запрашивать исходные документы и идентификаторы по умолчанию
    - risk: наблюдаемый вклад продукта или РИЦ будет ошибочно трактован как причинный экономический эффект
      mitigation: запретить ROI, предотвращенные штрафы и снижение риска без отдельного дизайна доказательств
    - risk: срок сдвинется из-за недоступности участника или недостаточного входа
      mitigation: отсчет внешнего срока начинается только после достаточного входа и согласования сессии
  delivery_methodology:
    approach: >-
      Методика E0/S01 использует нормализованный вход, доказательные классы, реконструкцию фактического эпизода,
      раздельное кодирование вкладов, построение производных представлений D02/D03/D04, затем предметную
      TECH-VER и только после этого выдачу результата участнику.
    evidence_rule: неизвестные сведения остаются not_established; выводы среды не приписываются респонденту
    data_minimization_rule: использовать минимально достаточные обезличенные сведения и не принимать секреты
    internal_plan_boundary: TM-PLAN → SEMP и полная внутренняя WBS используются только для управления исполнением и адресату не передаются
  supplier_experience_and_capabilities:
    established_capability:
      - E0/S01 имеет системные требования, архитектуру, проект и исполнимую процедуру в клиентском репозитории
      - синтетический CANARY-OEX-001 прошел предметную проверку механики и границ утверждений
      - инженерная среда поддерживает process-owned продукты, exact-version трассировку и структурную проверку нормативного состава
    not_established:
      - полезность для реального РИЦ еще не подтверждена реальным пилотом
      - коммерческий спрос и готовность платить не установлены
      - официальный статус услуги в Сети КонсультантПлюс не установлен
  acceptance_and_feedback:
    technical_completion_basis:
      - получен достаточный обезличенный вход
      - сформированы и верифицированы заявленные представления
      - результат передан РИЦ
    factual_review: РИЦ вправе указать ошибки реконструкции фактов; они фиксируются отдельно от оценки полезности
    usefulness_review: оценка полезности пилота собирается как последующее доказательство, а не как условие истинности анализа
    no_automatic_requirement_promotion: замечания РИЦ не становятся требованиями к продукту/сервису без отдельного процесса принятия
  authorization:
    supplier_responsible_approval: owner of MOZ1961/consultantplus engineering contour
    preparation_authority: owner explicitly authorized purpose change and execution in chat on 2026-09-06
    external_issue_state: not_authorized_yet
    rule: черновик не отправляется внешнему РИЦ и не создает обязательство до отдельного owner approval
  tailoring_proposal:
    applicability: not_applicable_for_pilot
    disposition: специального изменения применимых процессов ЖЦ или нормативных требований в этом предложении не предлагается
  exclusions:
    - юридическое или налоговое заключение о корректности профессионального решения клиента
    - обещание экономии, предотвращенного штрафа или измеримого снижения риска
    - изменение официального состава КонсультантПлюс или сервиса РИЦ
    - доступ к CRM, персональным данным или конфиденциальной переписке без отдельной необходимости и полномочий
glossary:
  РИЦ: региональный информационный центр КонсультантПлюс в контексте кандидатного клиентского контура
  сервисный эпизод: конкретный случай взаимодействия РИЦ с клиентом по рабочей задаче или решению
  паспорт сценария: человекочитаемое представление части канонического TECH-BMA отчета, а не самостоятельный информационный продукт
  карта покрытия: представление вклада СПС, РИЦ, клиента и иных источников внутри канонического TECH-BMA отчета
  карта разрывов: представление подтвержденных точек неопределенности, задержек, передач или обходов внутри канонического TECH-BMA отчета
  SEMP: внутренний канонический выход TM-PLAN, используемый как План управления проектом; внешнему РИЦ не передается
