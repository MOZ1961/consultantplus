body:
  methodic_application:
    status: provisional_runtime
    purpose: extract candidate stakeholder roles from owner intent and exact BMA evidence, classify evidence state, and assign decision-validation scope
    known_inputs:
      - owner request for decisions by level and participant
      - ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-MODEL-20260905-001-V1
      - ARTVER-CPLUS-BMA-OPEN-SOURCE-REPORT-20260904-001-V2
    missing_inputs:
      - client organization role maps
      - RIC internal process and responsibility maps
      - actual decision episodes and decision authority evidence
    execution_steps:
      - identify roles explicitly supported by current public BMA
      - add roles required by the owner-directed decision model as candidates rather than facts
      - assign each role to decision levels that require validation
      - keep needs, requirements and authority states unresolved until direct evidence exists
    expected_output: candidate stakeholder identification record
    acceptance_checks:
      - every participant has evidence_class and validation_status
      - inferred roles are not represented as sourced facts
      - no stakeholder need or requirement is accepted by this product
  evidence_classes:
    sourced_public_user_class: role class explicitly present in existing public-source BMA
    sourced_network_role: role of Coordination Center or RIC supported by existing public-source BMA
    owner_analyst_candidate: role required to test the owner-directed decision model but not established as a distinct current client class by reviewed public sources
  stakeholder_groups:
    - id: SG-01
      group: professional end users
      evidence_class: sourced_public_user_class
      members: [бухгалтеры, юристы, аудиторы, финансовые специалисты]
      decision_levels: [L1, L2]
      validation_question: какие конкретные рабочие решения они принимают, где возникает неопределенность и какой вклад фактически дает КонсультантПлюс
      validation_status: direct_client_evidence_required
    - id: SG-02
      group: managers and functional decision owners
      evidence_class: mixed_sourced_and_owner_analyst_candidate
      members:
        - {role: руководители, evidence: sourced_public_user_class_broad}
        - {role: главный бухгалтер, evidence: owner_analyst_candidate}
        - {role: руководитель юридической службы, evidence: owner_analyst_candidate}
        - {role: финансовый руководитель, evidence: owner_analyst_candidate}
      decision_levels: [L2, L3, L4]
      validation_question: какие решения требуют единообразия команды, контроля правовой неопределенности и доказательной основы
      validation_status: direct_client_evidence_required
    - id: SG-03
      group: organizational buyer and economic sponsor
      evidence_class: owner_analyst_candidate
      members: [руководитель организации, собственник, экономический заказчик, закупщик, администратор договора]
      decision_levels: [L4, L5]
      validation_question: по каким критериям выбираются комплект и сервис, что считается результатом и как обосновывается стоимость
      validation_status: direct_client_and_RIC_evidence_required
    - id: SG-04
      group: technical enablers at client
      evidence_class: owner_analyst_candidate
      members: [ИТ, информационная безопасность, администратор доступа]
      decision_levels: [L6]
      validation_question: какие ограничения доступа, администрирования, безопасности и интеграции влияют на фактическое использование продукта
      validation_status: direct_client_evidence_required
    - id: SG-05
      group: education-sector users
      evidence_class: sourced_public_user_class
      members: [преподаватели, студенты, школьники]
      decision_levels: [L1]
      validation_question: требуется ли отдельная модель решений и ценности, отличная от профессиональных коммерческих сценариев
      validation_status: segment_scope_decision_required_before_research
    - id: SG-06
      group: RIC client-facing participants
      evidence_class: sourced_network_role_plus_owner_analyst_role_decomposition
      members:
        - {role: РИЦ как поставщик и сервисный участник, evidence: sourced_network_role}
        - {role: менеджер РИЦ, evidence: owner_analyst_candidate}
        - {role: специалист сопровождения, evidence: owner_analyst_candidate}
        - {role: преподаватель или консультант РИЦ, evidence: owner_analyst_candidate}
      decision_levels: [L5, L7]
      validation_question: как сегодня выявляются клиентские задачи, конфигурируется предложение, проводится обучение и фиксируется результат использования
      validation_status: internal_RIC_evidence_required
    - id: SG-07
      group: Coordination Center and network/product development
      evidence_class: sourced_network_role_plus_owner_analyst_role_decomposition
      members:
        - {role: Координационный центр, evidence: sourced_network_role}
        - {role: продуктовые подразделения, evidence: owner_analyst_candidate}
        - {role: сервисные подразделения, evidence: owner_analyst_candidate}
      decision_levels: [L8]
      validation_question: какие данные о клиентских сценариях и разрывах необходимы для приоритизации развития продукта и сервиса
      validation_status: internal_network_evidence_required
  research_priority:
    first_wave:
      - professional end users
      - functional decision owners
      - organizational buyer/economic sponsor
      - RIC client-facing participants
    rationale: these groups span direct use, team-level process, purchase/value judgment and service delivery and therefore test the largest parts of the current decision-value model
    status: candidate_priority_not_accepted_sampling_plan
  exclusions:
    - this record does not assert stakeholder needs
    - this record does not assert stakeholder requirements
    - this record does not assert purchasing authority or internal job titles in any particular client organization
    - this record does not establish target product architecture or RIC process redesign
