body:
  methodic_application:
    status: provisional_runtime
    purpose: >-
      Reconcile candidate participant identities with the refined C1-C6/P1-P2 decision model and classify which groups
      can receive participant-specific engineering offers without asserting accepted needs or requirements.
    known_inputs:
      - ARTVER-CPLUS-STK-CLIENT-DECISION-STAKEHOLDER-IDENTIFICATION-20260905-001-V1
      - ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-REFINEMENT-20260905-001-V1
      - ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V1
      - owner request for participant proposals, products/services and required information
    missing_inputs:
      - client organization role and authority maps
      - RIC internal process and responsibility maps
      - actual participant decision episodes
      - Coordination Center internal product/service responsibility map
    execution_steps:
      - retain sourced role classes and evidence states
      - replace obsolete L1-L8 notation with current C1-C6/P1-P2 decision scopes
      - keep provider-response roles separate from client decision owners
      - assign engagement priority without asserting stakeholder needs or requirements
    expected_output: evidence-classified participant identification aligned to the current decision-value model
    acceptance_checks:
      - every participant group has evidence class and current C/P scope
      - candidate roles remain explicitly candidate
      - no stakeholder need, requirement, buying authority or internal responsibility is accepted
  stakeholder_groups:
    - id: SG-01
      group: professional end users
      members: [бухгалтеры, юристы, аудиторы, финансовые специалисты]
      evidence_class: sourced_public_user_class
      decision_scopes: [C1, C2]
      engagement_priority: first_wave
      validation_status: direct_client_evidence_required
    - id: SG-02
      group: functional decision owners
      members: [руководители функций, главный бухгалтер, руководитель юридической службы, финансовый руководитель]
      evidence_class: mixed_sourced_broad_and_owner_analyst_candidate
      decision_scopes: [C2, C3, C4]
      engagement_priority: first_wave
      validation_status: direct_client_evidence_required
    - id: SG-03
      group: organizational buyer and sponsor
      members: [руководитель организации, собственник, экономический заказчик, закупщик]
      evidence_class: owner_analyst_candidate
      decision_scopes: [C4, C5]
      engagement_priority: first_wave
      validation_status: direct_client_and_RIC_evidence_required
    - id: SG-04
      group: technical enablers
      members: [ИТ, информационная безопасность, администратор доступа]
      evidence_class: owner_analyst_candidate
      decision_scopes: [C6]
      engagement_priority: second_wave_or_when_access_constraint_is_material
      validation_status: direct_client_evidence_required
    - id: SG-05
      group: education-sector users
      members: [преподаватели, студенты, школьники]
      evidence_class: sourced_public_user_class
      decision_scopes: [C1, C2]
      engagement_priority: deferred_until_segment_scope_decision
      validation_status: segment_scope_decision_required
    - id: SG-06
      group: RIC client-facing participants
      members: [РИЦ, менеджер РИЦ, специалист сопровождения, преподаватель или консультант РИЦ]
      evidence_class: sourced_network_role_plus_candidate_role_decomposition
      decision_scopes: [P1]
      related_client_scope: [C5]
      engagement_priority: first_wave
      validation_status: internal_RIC_evidence_required
    - id: SG-07
      group: Coordination Center and network/product development
      members: [Координационный центр, продуктовые подразделения, сервисные подразделения, РИЦ]
      evidence_class: sourced_network_role_plus_candidate_role_decomposition
      decision_scopes: [P2]
      engagement_priority: second_wave_after_client_episode_evidence
      validation_status: internal_network_evidence_required
  engagement_priority:
    first_wave: [SG-01, SG-02, SG-03, SG-06]
    second_wave_or_conditional: [SG-04, SG-07]
    deferred: [SG-05]
    rationale: >-
      First wave spans direct professional decisions, process ownership, economic/configuration decisions and RIC response;
      technical and network-development participation becomes materially stronger after concrete access or repeated scenario evidence exists.
  exclusions:
    - no stakeholder needs asserted
    - no stakeholder requirements asserted
    - no purchasing authority or internal title asserted for a specific client
    - no target architecture or RIC redesign asserted
    - no external participant contact or commercial commitment authorized by this record
