authorizing_organization: owner
references:
  - ARTVER-CPLUS-STK-CLIENT-DECISION-STAKEHOLDER-IDENTIFICATION-20260905-001-V2
  - ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V3
  - ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V2
  - ARTVER-CPLUS-RIC-DIRECTOR-QUESTIONNAIRE-MEASUREMENT-PLAN-20260907-001-V2
  - ARTVER-CPLUS-SE-INTERFACE-BINDING-20260904-001-V3
  - ARTVER-SE-OWNER-REQUESTED-INFORMATION-PRODUCT-REQUIREMENTS-20260903-001-V1
  - ARTVER-SE-GOST58609-FULL-NORMATIVE-CONTENT-CATALOG-20260904-001-V3
  - ARTVER-SE-GOST58609-NORMATIVE-FIRST-OUTPUT-CROSSWALK-20260904-001-V3
  - ARTVER-SE-DUAL-STANDARD-TRACEABILITY-POLICY-20260905-001-V2
body:
  stakeholder_context:
    subject: evidence-backed positioning of ConsultantPlus and RIC contribution before empirical measurement
    source_correction: >-
      The existing stakeholder-identification product separates client roles and RIC provider roles but explicitly
      does not establish stakeholder needs. The owner now requires the pre-measurement design to account for the
      initiating RIC, SE, peer RICs and clients as distinct stakeholder classes.
    evidence_rule: stakeholder class determines what a statement may evidence; no class is a substitute for another.
  stakeholder_groups:
    - id: STK-PM-01
      group: initiating RIC
      role: sponsor_and_local_provider_context
      decisions_supported:
        - whether the positioning/evidence model is useful for RIC management and client-service work
        - which client scenarios and service interventions merit pilot attention
        - whether and under what constraints to continue the empirical wave
      legitimate_evidence:
        - own management decisions and service processes
        - own recent client-facing episodes reported as RIC-side evidence
        - resource, feasibility, trust and pilot conditions
      evidence_limits:
        - cannot by itself establish client value or client decision criteria
        - cannot establish transferability to other RICs or market prevalence
    - id: STK-PM-02
      group: generic SE environment
      role: engineering_method_and_evidence_consumer
      decisions_supported:
        - whether evidence is traceable, correctly classified and sufficient for the next lifecycle decision
        - which positioning hypotheses, products or methods require refinement after measurements
      legitimate_evidence:
        - process/product composition and traceability
        - methodological consistency, contradiction preservation and explicit unresolved gaps
        - bounded engineering inference from identified source evidence
      evidence_limits:
        - cannot establish lived client or RIC value
        - cannot convert analytical inference into stakeholder testimony or adoption authority
    - id: STK-PM-03
      group: peer RICs
      role: transferability_and_provider_context
      decisions_supported:
        - whether the candidate positioning and service model fit their own client/service context
        - what local constraints, burden, trust criteria and pilot conditions apply
        - which patterns are repeatable versus specific to the initiating RIC
      legitimate_evidence:
        - own RIC operating and management episodes
        - own client-facing observations classified as RIC-side evidence
        - local transferability criteria and constraints
      evidence_limits:
        - cannot substitute for direct client evidence
        - one peer RIC cannot establish network-wide prevalence
    - id: STK-PM-04
      group: clients
      role: direct_client_decision_evidence
      subroles:
        - {id: CL-01, role: professional_end_user, decision_scopes: [C1,C2]}
        - {id: CL-02, role: functional_decision_owner, decision_scopes: [C2,C3,C4]}
        - {id: CL-03, role: economic_buyer_or_sponsor, decision_scopes: [C4,C5]}
        - {id: CL-04, role: technical_enabler, decision_scopes: [C6]}
      decisions_supported:
        - what to do in a concrete professional episode and what basis is required
        - how to justify or institutionalize a professional position or process
        - how to respond organizationally to change/risk and choose/configure information-service support
        - how to provide reliable controlled access where C6 is material
      legitimate_evidence:
        - own recent decision episodes
        - actual alternatives and choice/trust criteria
        - spontaneous value language
        - perceived contribution of ConsultantPlus and RIC kept separate
      evidence_limits:
        - cannot establish provider-internal process facts outside participant knowledge
        - one client cannot establish prevalence across the client population
  needs:
    - {id: N-CPLUS-PM-01, stakeholder: STK-PM-01, statement: initiating RIC needs evidence that separates its own provider perspective from direct client evidence before deciding whether a positioning/service pilot is justified}
    - {id: N-CPLUS-PM-02, stakeholder: STK-PM-01, statement: initiating RIC needs scenario-level results linked to management choices, resource burden, trust conditions and stop/continue criteria rather than slogan preference alone}
    - {id: N-CPLUS-PM-03, stakeholder: STK-PM-02, statement: SE needs every material finding to retain source stakeholder class, role, episode, evidence class, uncertainty and exact downstream claim boundary}
    - {id: N-CPLUS-PM-04, stakeholder: STK-PM-02, statement: SE needs contradictions among RIC, peer-RIC and client evidence preserved rather than averaged into a synthetic truth}
    - {id: N-CPLUS-PM-05, stakeholder: STK-PM-03, statement: peer RICs need the research to distinguish transferable patterns from initiating-RIC-specific practice and to expose local constraints and adoption conditions}
    - {id: N-CPLUS-PM-06, stakeholder: STK-PM-03, statement: peer RICs need their client-facing observations classified separately from direct client testimony and from network-level provider claims}
    - {id: N-CPLUS-PM-07, stakeholder: STK-PM-04, statement: clients need questioning to reconstruct real decisions, actual alternatives and information paths before any candidate positioning language is shown}
    - {id: N-CPLUS-PM-08, stakeholder: STK-PM-04, statement: clients need ConsultantPlus contribution and RIC contribution distinguished so that one is not credited with the other's effect}
    - {id: N-CPLUS-PM-09, stakeholder: all, statement: all stakeholders need unsupported ROI, prevented-fine, general efficiency, risk-reduction and market-prevalence claims excluded until evidence appropriate to those claims exists}
    - {id: N-CPLUS-PM-10, stakeholder: all, statement: all stakeholders need privacy, consent, data-minimization, claim-authority and retention rules established before evidence collection}
    - {id: N-CPLUS-PM-11, stakeholder: all, statement: all stakeholders need a common evidence unit and coding vocabulary that permits comparison without erasing stakeholder-specific meaning}
    - {id: N-CPLUS-PM-12, stakeholder: all, statement: all stakeholders need explicit completion and stop criteria so positive reactions do not automatically become adoption evidence}
  common_evidence_contract:
    evidence_unit:
      required_fields: [stakeholder_class,participant_role,organization_context,decision_scope,episode_trigger,decision_or_action,evidence_path,actual_alternatives,product_contribution,RIC_contribution,observed_status_or_result,uncertainty,evidence_class]
      allowed_not_established: true
    evidence_classes:
      - direct_client_episode_fact
      - client_interpretation_or_judgment
      - client_choice_or_trust_criterion
      - initiating_RIC_episode_fact
      - initiating_RIC_interpretation
      - peer_RIC_episode_fact
      - peer_RIC_interpretation
      - RIC_account_of_client_episode
      - SE_method_or_trace_judgment
      - SE_analytic_inference
      - official_provider_claim
      - aided_reaction_to_positioning_view
      - not_established
    non_substitution_rules:
      - RIC_account_of_client_episode is a provider-side hypothesis until triangulated with direct client evidence where the claim is client-side
      - direct_client evidence may evidence client perception of RIC contribution but not provider-internal process facts
      - SE_analytic_inference is never participant testimony and must trace to evidence units
      - initiating_RIC and peer_RIC evidence remain distinguishable to test transferability
    conflict_rule: preserve conflicting evidence by source domain and report supported, contradicted, mixed, role-specific and untested dispositions.
  measures_of_effectiveness:
    - {id: MOE-CPLUS-PM-01, measure: stakeholder classes with explicit decisions, needs and evidence limits before measurement, target: 4_of_4}
    - {id: MOE-CPLUS-PM-02, measure: material findings retaining stakeholder/evidence-class provenance, target: 100_percent}
    - {id: MOE-CPLUS-PM-03, measure: RIC-side statements silently treated as direct client evidence, target: 0}
    - {id: MOE-CPLUS-PM-04, measure: SE inference silently promoted to stakeholder fact, target: 0}
    - {id: MOE-CPLUS-PM-05, measure: unsupported causal_or_financial claims admitted by premeasurement design, target: 0}
  downstream_system_context:
    technical_characteristics: >-
      Measurement preparation shall use a common evidence contract plus stakeholder-specific modules. Existing RIC-director
      and client-wave plans remain reusable inputs; a cross-stakeholder measurement strategy coordinates them without
      treating SE as an external respondent population.
    intended_human_system_use: >-
      owner/initiating RIC defines decision need -> SE prepares and verifies evidence contract -> initiating RIC, peer RICs
      and clients provide domain-bounded evidence -> TM-MEAS preserves source classes -> TECH-BMA may refine hypotheses ->
      TM-DEC only if an authorized positioning decision is actually made.
    system_functions: [separate stakeholder evidence domains, preserve provenance and contradictions, compare real decision episodes, distinguish ConsultantPlus and RIC contribution, maintain privacy and claim boundaries]
    safety_and_security: [consent, data minimization, no unnecessary client identifiers, no confidential correspondence or credentials, no automatic causal attribution, no authority transfer]
    critical_limits: {stakeholder_domain_substitution: 0, hidden_SE_inference_as_fact: 0, unsupported_ROI_or_prevented_fine_claims: 0, unconsented_audio_or_direct_quotes: 0}
    standards: [ГОСТ Р 57193-2025, ISO/IEC/IEEE 15288:2023, ГОСТ Р 58609-2019/ISO/IEC/IEEE 15289:2017]
conditions_constraints_characteristics:
  applicability: premeasurement design for RIC positioning and evidence-backed client decision-value work
  authority: owner authorizes engineering preparation; participant contact, measurement execution, positioning adoption, deployment and baseline remain separate
  privacy: collect role/context and minimum episode evidence; direct identifiers, raw CRM exports, credentials, privileged/confidential materials and margins are not required by default
  contamination_control: external participants provide unaided episode/category/alternative evidence before candidate positioning views are shown
  downstream_rule: actual observations are persisted only after collection through TM-MEAS measurement register/report products; no empty evidence register is created by this need set
credibility_requirements:
  - each need is bound to a stakeholder class and an identifiable decision/use
  - evidence-domain limits are explicit for all four stakeholder classes
  - existing stakeholder-identification and measurement-plan evidence is reused without converting prior candidate roles into accepted empirical findings
summary:
  conclusion: four stakeholder classes now have explicit premeasurement needs, evidence rights and non-substitution boundaries
  remaining_boundary: empirical adequacy of the positioning remains untested until actual measurements are performed
bibliography:
  - ГОСТ Р 57193-2025 / ISO/IEC/IEEE 15288:2023
  - ГОСТ Р 58609-2019 / ISO/IEC/IEEE 15289:2017
glossary:
  initiating_RIC: РИЦ, из которого инициируется текущая работа и чьи управленческие/сервисные решения являются отдельным источником свидетельств
  peer_RIC: другой РИЦ, используемый для проверки переносимости и вариативности практик
  evidence_domain: предел утверждений, которые данный класс заинтересованной стороны способен обосновать собственной информацией
  non_substitution: запрет использовать свидетельство одной стороны как прямое свидетельство другой стороны
