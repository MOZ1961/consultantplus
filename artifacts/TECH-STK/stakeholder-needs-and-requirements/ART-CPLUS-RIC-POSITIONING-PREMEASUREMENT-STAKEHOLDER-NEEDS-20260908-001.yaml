scope: >-
  Stakeholder needs for evidence-backed RIC positioning work before empirical measurements. The product covers
  the initiating RIC, generic SE environment, peer RICs and client-side roles. It does not assert that any
  positioning hypothesis is true and does not authorize external contact, adoption, deployment or baseline.
