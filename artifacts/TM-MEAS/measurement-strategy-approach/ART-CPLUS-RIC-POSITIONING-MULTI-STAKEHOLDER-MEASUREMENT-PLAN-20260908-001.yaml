glossary:
  evidence_domain: source stakeholder class and claim boundary that determine what a row may legitimately support
  source_domain_substitution: treating one stakeholder's evidence as if directly provided by another stakeholder class
  premeasurement_readiness: design state in which stakeholder, method, evidence, privacy and decision-boundary gaps are closed while empirical data remain future work
  transferability: evidence-supported applicability across RIC contexts rather than assumed network-wide sameness
