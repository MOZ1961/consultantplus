scope: >-
  Coordinating qualitative measurement plan for evidence-backed ConsultantPlus/RIC positioning. External respondent
  populations are initiating RIC participants, peer RIC participants and client participants; SE is an engineering
  stakeholder/analysis-verification participant, not a source of external market testimony. The plan coordinates existing
  director and client-wave plans and does not itself authorize contact, create measurements or choose official positioning.
