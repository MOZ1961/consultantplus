  волны, установив один координирующий План измерений для четырех заинтересованных сторон: инициирующего
  РИЦ, generic SE-среды, других РИЦ и клиентов. План задает общий объект доказательства, раздельные модули,
  последовательность, выборку, правила триангуляции/конфликтов, приватность, критерии входа в измерения и
  последующие стандартные продукты, не создавая измерительные данные до фактического сбора.
