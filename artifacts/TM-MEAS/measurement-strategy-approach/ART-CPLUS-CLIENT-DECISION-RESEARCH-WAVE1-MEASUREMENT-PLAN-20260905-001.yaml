  positioning_report: ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V3
  positioning_source_register: ARTVER-CPLUS-RIC-POSITIONING-METHOD-SOURCE-REGISTER-20260907-001-V1
  refined_model: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-REFINEMENT-20260905-001-V2
  next_expected_products_after_execution:
