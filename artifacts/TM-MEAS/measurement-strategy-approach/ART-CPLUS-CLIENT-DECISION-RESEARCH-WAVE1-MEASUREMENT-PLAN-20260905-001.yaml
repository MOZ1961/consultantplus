introduction:
  purpose: >-
    проверить сравнительное позиционирование через реальные недавние эпизоды и организационный контекст,
    а не через изолированное голосование за рекламные формулировки
  audience: [owner, interviewers, RIC client-facing participants, subsequent TECH-BMA, subsequent TECH-VER, future TM-DEC after evidence]
  coverage: [four participant groups, episode reconstruction, category/frame, alternatives, choice criteria, PoP, PoD, reason to believe, message territory test, evidence classes, storage, cross-case analysis]
  nonpurpose: [не измеряет рыночную долю, не доказывает ROI, не доказывает предотвращенные штрафы, не устанавливает юридическую правильность решений, не дает статистически репрезентативные оценки рынка, не принимает официальное позиционирование]
measurement_needs_and_information_requirements:
  primary_questions:
    - какое конкретное решение или действие участник принимал в недавнем рабочем эпизоде и какой C1-C6 код применим
    - что было триггером, ожидаемым результатом и последствием ошибки или задержки в пределах знания участника
    - какую категорию решения или инструмента участник фактически использовал как frame of reference
    - какие альтернативы реально рассматривались, использовались параллельно или были бы использованы при недоступности КонсультантПлюс
    - какие свойства участник считает обязательными для приемлемого решения в этой категории
    - какое отличие КонсультантПлюс участник считает реально значимым в эпизоде и чем оно подтверждается
    - что отдельно дал КонсультантПлюс и что отдельно дал РИЦ
    - как пользователь, руководитель функции, экономический заказчик и ИТ-участник различаются по критериям выбора
    - какой спонтанный язык ценности возникает до показа кандидатных формулировок
    - как после реконструкции эпизода участник оценивает PT2, PT3, PT6 и PT7 по релевантности, правдоподобию и отличительности
    - какие территории отвергаются, смешиваются или требуют другого frame of reference
    - какие выводы остаются not_established и не должны усиливаться аналитиком
  evidence_unit: >-
    один недавний конкретный decision episode с идентифицируемым триггером, ролью, решением, информационным
    путем, фактическими альтернативами либо explicit not_established, действием/status, вкладом продукта/РИЦ
    и отдельным блоком сравнительной реакции на positioning territories
  evidence_classes:
    - direct_episode_fact_reported_by_participant
    - participant_interpretation_or_judgment
    - participant_stated_choice_criterion
    - participant_stated_alternative
    - participant_message_reaction
    - interviewer_coding_or_inference
    - RIC_account_of_client_episode
    - official_provider_claim
    - not_established
  first_wave_groups:
    - {id: G1, group: professional end user, target_roles: [бухгалтер, юрист, аудитор, финансовый специалист, кадровый специалист, специалист по закупкам], primary_levels: [C1, C2]}
    - {id: G2, group: functional decision owner, target_roles: [главный бухгалтер, руководитель юридической или иной регулируемой функции], primary_levels: [C2, C3, C4]}
    - {id: G3, group: economic buyer or sponsor, target_roles: [руководитель, собственник, экономический заказчик, закупщик], primary_levels: [C4, C5]}
    - {id: G4, group: RIC client-facing participant, target_roles: [менеджер РИЦ, специалист сопровождения, преподаватель, консультант], primary_levels: [P1], relation: provider_response_evidence}
  positioning_territories_under_test:
    primary: [PT2, PT3, PT6]
    control: [PT7]
    secondary_or_spontaneous: [PT1, PT4, PT5]
planned_activities_and_tasks:
  - pilot the V2 protocol with one client-side participant and one RIC participant after owner pilot authority
  - revise wording only where pilot reveals ambiguity, leading questions or category confusion; version material measure changes
  - recruit a purposive first-wave sample spanning all four groups and materially different organization contexts
  - reconstruct each recent episode before mentioning ConsultantPlus value or showing any positioning formulation
  - collect frame of reference and factual alternatives before presenting candidate territory names
  - code each valid episode against role, C/P level, trigger, consequence, information path, alternative set, choice criteria, product contribution, RIC contribution and gap type
  - derive candidate PoP/PoD only from participant evidence plus clearly labeled analyst synthesis
  - test PT2/PT3/PT6/PT7 only after spontaneous value language is captured
  - compare client-side and RIC-side accounts where they refer to similar scenarios without treating one as substitute for the other
  - synthesize supported, contradicted, mixed, role-specific and untested territory hypotheses
  - feed evidence back to TECH-BMA; create TM-DEC only if owner or authorized governance actually makes a positioning decision
tools_methods_techniques:
  method: >-
    semi-structured critical-incident/critical-decision-style interview combined with a positioning comparison module;
    episode reconstruction precedes category/alternative elicitation, which precedes candidate message testing
  techniques:
    - neutral chronological reconstruction before product prompts
    - explicit distinction among fact, participant judgment, stated criterion, stated alternative and interviewer inference
    - counterfactual probe used only as perception evidence, not causal proof
    - unaided category and alternative elicitation before aided territory comparison
    - role-specific probes after a common core
    - points-of-parity and points-of-difference coding as hypotheses, not automatic facts
    - reason-to-believe trace for every claimed difference
    - cross-case coding against a stable measure set
    - preserve contradiction and minority cases rather than averaging them away
  tools: [interview guide derived from this plan, structured episode record, controlled coding representation, repository-backed measurement register after data collection, audio only with explicit participant consent]
schedule:
  sequencing:
    - {stage: pre_pilot_TECH_VER, scope: semantic verification of V2 plan and positioning V3}
    - {stage: pilot, scope: 2 interviews minimum preferably one client-side and one RIC-side; requires separate external execution authority}
    - {stage: instrument_revision, scope: one controlled revision after pilot if needed}
    - {stage: main_wave, scope: '8-12 organizations or comparable client contexts, approximately 12-20 interviews, target at least 25 valid episodes'}
    - {stage: synthesis, scope: cross-case measurement report and recommendation to TECH-BMA/TM-DEC}
  timing_rule: exact calendar dates are not established and depend on owner/participant availability
budget_and_cost_estimate:
  state: not_established
  rule: no research budget, incentive, travel or external commitment is authorized or inferred by this plan
  decision_needed_if_costs_arise: owner authorization before commitment
resources_and_allocation:
  owner: research scope, external pilot authority and acceptance authority
  interviewer: neutral episode reconstruction and later aided positioning test without selling the hypothesis
  analyst: coding, source/evidence separation and cross-case comparison
  RIC_contact: recruitment/coordination only within authorized relationship boundaries
  repository: canonical process-owned products; derived tables are representations and must trace to exact ArtifactVersions
responsibilities_and_authorities:
  owner:
    authority: approve use of plan, external participant contact, scope changes, costs and any eventual positioning decision
  interviewer:
    authority: collect only consented research information; no authority to promise product changes or present candidate territories as approved
  analyst:
    authority: assign provisional codes and hypothesis dispositions; no authority to adopt positioning or promote observations directly to requirements
  participant:
    authority: describe own episode and own interpretation; claims about organization/market remain bounded by participant knowledge
participant_interfaces:
  client_to_interviewer: episode narrative, category, alternatives, criteria, value language and message reactions
  RIC_to_interviewer: service episode, intervention, perceived client response and RIC-language hypotheses
  interviewer_to_analysis: de-identified structured episode record plus evidence-class tags
  analysis_to_TECH_BMA: comparative positioning evidence and unresolved gaps
  analysis_to_TM_DEC: no automatic decision; only decision-support evidence if owner later requests a positioning choice
risk_assessment_and_mitigation:
  - {risk: feature-led or slogan-led interviewing creates confirmation bias, mitigation: reconstruct episode and unaided frame/alternatives before product or territory prompts}
  - {risk: participant gives generic habits instead of real episode, mitigation: require recent identifiable trigger, sequence and action/status for valid episode}
  - {risk: researcher invents competitor set, mitigation: collect actual alternative names/types from participant and allow not_established}
  - {risk: RIC account is mistaken for client evidence, mitigation: classify RIC account separately and triangulate where possible}
  - {risk: provider official message is mistaken for market perception, mitigation: classify as official_provider_claim not participant evidence}
  - {risk: message preference is constructed by the interview task, mitigation: capture spontaneous value language first and preserve aided versus unaided evidence separately}
  - {risk: product gets causal credit for business outcome, mitigation: separate contribution fields and treat counterfactual as perception only}
  - {risk: small sample is treated as statistically representative, mitigation: label wave qualitative/purposive and report sample coverage not population prevalence}
  - {risk: interviewer coding drifts, mitigation: use fixed definitions and second-review a sample before synthesis}
  - {risk: sensitive client facts enter record, mitigation: coded IDs, data minimization, no unnecessary names or privileged case materials}
quality_and_effectiveness_measures:
  quality_criteria:
    - every valid episode has trigger, role, decision, evidence path, action/status and evidence-class tags
    - category/frame and actual alternatives are present or explicitly not_established
    - product contribution and RIC contribution are separate fields
    - spontaneous value language is captured before aided message test
    - PoP/PoD/RTB fields distinguish participant statement from analyst inference
    - every territory disposition traces to episode IDs
    - contradictory cases remain visible
  effectiveness_signals:
    - at least 25 valid episodes across all four groups or explicit evidence-insufficiency stop decision
    - all primary territories PT2/PT3/PT6 and control PT7 tested across more than one client-side role when feasible
    - at least one materially supported, contradicted or role-specific finding per client-side group or explicit insufficiency
    - no unresolved systematic ambiguity between C/P coding and positioning-dimension coding
  noncriteria:
    - territory preference count alone is not adoption evidence
    - theme saturation is informative but not statistical proof
environment_infrastructure_security:
  environment: authorized client/RIC interviews plus MOZ1961/consultantplus process-owned persistence
  infrastructure: interview channel, structured recording template and controlled analysis representation
  privacy_security:
    - coded participant and organization identifiers by default
    - no unnecessary personal data, credentials, client secrets or privileged case materials
    - direct quotations require explicit consent; paraphrase is default
    - audio is optional and requires explicit consent and a defined retention decision
  safety: no legal advice or correctness judgment about the participant's substantive decision is provided by the research interview
training:
  interviewer_orientation:
    - distinguish episode fact, participant judgment, choice criterion, alternative and interviewer inference
    - do not show positioning territories before unaided episode/category/value elicitation
    - avoid converting pain points directly into requirements or positioning decisions
    - maintain same common core across roles before role-specific probes
    - separate feedback on factual reconstruction from preference for candidate wording
technical_management_review_reporting:
  pilot_review: owner or designated reviewer checks neutrality, category/alternative elicitation and coding consistency
  structural_review: exact external-client information-product worker
  semantic_review: TECH-VER of BMA V3, source register V1 and this V2 plan before pilot
  future_reporting: TM-MEAS measurement report after data collection; updated TECH-BMA and optional later TM-DEC only as warranted
