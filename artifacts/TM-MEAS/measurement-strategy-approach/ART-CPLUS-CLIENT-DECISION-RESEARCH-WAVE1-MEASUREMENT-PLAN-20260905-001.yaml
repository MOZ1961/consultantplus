introduction:
  purpose: test the decision-centric value model through recent concrete episodes rather than opinions about product features
  audience: owner, interviewers, RIC client-facing participants, subsequent TECH-BMA/TECH-STK/TECH-VER
  coverage: four first-wave participant groups, episode interview protocol, coding measures, evidence classification, storage, analysis and completion rules
  nonpurpose: this plan does not measure market share, ROI, avoided fines, legal correctness of participant decisions or statistically representative population parameters
measurement_needs_and_information_requirements:
  primary_questions:
    - what concrete decisions do participants actually make and at which C1-C5 client decision level
    - what triggers those decisions and what consequences do participants associate with error or delay
    - what information and evidence are required before the participant considers the decision sufficiently grounded
    - what role ConsultantPlus plays in finding, understanding, comparing, justifying or monitoring information in the episode
    - what separate role the RIC service plays in configuring access, teaching, supporting or resolving the scenario
    - where uncertainty, delay, workaround or missing capability remains
    - how buyer/sponsor language about value differs from end-user language
    - which provider responses P1/P2 are supported by repeated client evidence rather than internal assumption
  evidence_unit: one recent concrete decision episode with identifiable trigger, participant, decision, evidence path, action/status and product/service contribution
  evidence_classes:
    - direct_episode_fact_reported_by_participant
    - participant_interpretation_or_judgment
    - interviewer_coding_or_inference
    - RIC_account_of_client_episode
    - not_established
  first_wave_groups:
    - {id: G1, group: professional end user, target_roles: [бухгалтер, юрист, аудитор, финансовый специалист], primary_levels: [C1, C2]}
    - {id: G2, group: functional decision owner, target_roles: [главный бухгалтер, руководитель юридической или иной регулируемой функции], primary_levels: [C2, C3, C4]}
    - {id: G3, group: economic buyer or sponsor, target_roles: [руководитель, собственник, экономический заказчик, закупщик], primary_levels: [C4, C5]}
    - {id: G4, group: RIC client-facing participant, target_roles: [менеджер РИЦ, специалист сопровождения, преподаватель или консультант], primary_levels: [P1], relation: provider_response_evidence}
planned_activities_and_tasks:
  - pilot the protocol with one client-side participant and one RIC participant
  - revise wording only where pilot reveals ambiguity or leading questions; preserve measure identities or version them explicitly
  - recruit a purposive first-wave sample spanning the four groups and materially different organization contexts
  - reconstruct recent decision episodes before asking about ConsultantPlus or product value
  - code each valid episode against decision level, trigger, consequence, information path, product contribution, RIC contribution and gap type
  - compare client-side and RIC-side accounts where they refer to similar scenarios
  - synthesize confirmed, contradicted and still-unresolved model hypotheses
  - feed confirmed needs/gaps back to TECH-BMA/TECH-STK without converting them automatically into requirements
tools_methods_techniques:
  method: semi-structured critical-incident-style interview centered on the last concrete meaningful episode
  techniques:
    - neutral chronological reconstruction before product prompts
    - separate fact, participant judgment and interviewer inference
    - counterfactual probe without claiming causality
    - role-specific probes after a common core
    - cross-case coding against the same stable measure set
  tools: [interview guide derived from this plan, structured episode record, spreadsheet or repository-backed coding table as a derived representation, audio recording only with explicit participant consent]
schedule:
  sequencing:
    - stage: pilot
      scope: 2 interviews minimum, preferably one client-side and one RIC-side
    - stage: instrument revision
      scope: one controlled revision after pilot if needed
    - stage: main wave
      scope: 8-12 organizations or comparable client contexts, approximately 12-20 interviews, target at least 25 valid episodes
    - stage: synthesis
      scope: cross-case analysis and recommendation to TECH-BMA/TECH-STK
  timing_rule: exact calendar dates are not established in this plan and require owner/participant availability
budget_and_cost_estimate:
  state: not_established
  rule: no client research budget, incentive or travel cost is authorized or inferred by this plan
  decision_needed_if_costs_arise: owner authorization before commitment
resources_and_allocation:
  owner: research scope and acceptance authority
  interviewer: conduct neutral episode reconstruction and distinguish report from inference
  analyst: code episodes, compare cases and maintain evidence state
  RIC_contact: recruit or coordinate RIC/client participants only within authorized relationship boundaries
  repository: process-owned canonical products; derived coding table must trace to the exact ArtifactVersion and must not become an independent semantic authority
responsibilities_and_authorities:
  owner:
    authority: approve use of the plan, changes to scope and any external communication or incentive commitment
  interviewer:
    authority: collect only consented research information; no authority to promise product changes or interpret interview statements as requirements
  analyst:
    authority: assign provisional codes and evidence classes; no authority to accept stakeholder needs or product requirements
  participant:
    authority: describe own episode and interpretation; statements about organizational policy or outcomes are evidence only within the participant's known scope
participant_interfaces:
  client_to_interviewer: recent episode narrative, decision context and perceived product/service contribution
  RIC_to_interviewer: service episode, intervention and observed client response
  interviewer_to_analysis: de-identified structured episode record plus evidence-class tags
  analysis_to_TECH_BMA_TECH_STK: confirmed/contradicted hypotheses and evidence-backed candidate needs/gaps; no automatic requirement promotion
risk_assessment_and_mitigation:
  - {risk: feature-led interviewing produces confirmation bias, mitigation: reconstruct episode and decision before mentioning ConsultantPlus contribution}
  - {risk: respondents describe general habits instead of a real episode, mitigation: require a recent identifiable trigger, sequence and action/status for a valid episode}
  - {risk: RIC description is mistaken for client evidence, mitigation: classify RIC account separately and triangulate with client evidence where possible}
  - {risk: business outcome is attributed to the product without causal basis, mitigation: record only participant-perceived contribution and episode-level observable result}
  - {risk: sensitive client facts or personal data enter the record, mitigation: minimize data, use coded participant/organization IDs and exclude unnecessary names/case details}
  - {risk: small sample is treated as statistically representative, mitigation: label wave as qualitative purposive evidence and report coverage rather than population estimates}
  - {risk: interviewer coding drifts, mitigation: use fixed code definitions and second-review a sample of records before synthesis}
quality_and_effectiveness_measures:
  quality_criteria:
    - every valid episode has trigger, participant role, decision, evidence path, action/status and evidence-class tags
    - product contribution and RIC contribution are separate fields
    - interviewer inference is never stored as direct participant fact
    - each conclusion in synthesis can trace to one or more episode IDs
  effectiveness_signals:
    - at least 25 valid episodes across all four first-wave groups
    - at least one materially distinct confirmed or contradicted hypothesis per client-side group, or explicit evidence insufficiency
    - no unresolved ambiguity about C versus P level coding in the analyzed set
  noncriterion: absence of new themes is a useful saturation signal but is not treated as statistical proof
environment_infrastructure_security:
  environment: authorized client/RIC interviews plus MOZ1961/consultantplus process-owned persistence
  infrastructure: interview channel, structured recording template and analysis representation
  privacy_security:
    - use coded participant and organization identifiers by default
    - do not persist unnecessary personal data, credentials, client secrets or privileged case materials
    - direct quotations require explicit consent; paraphrase is the default research record
    - audio recording is optional and requires explicit consent and a defined retention decision
  safety: no legal advice or correctness judgment about the participant's substantive decision is provided by the research interview
training:
  interviewer_orientation:
    - distinguish episode fact, participant judgment and interviewer inference
    - avoid feature prompting before episode reconstruction
    - do not convert stated pain points directly into requirements
    - use the same core sequence across roles and only then apply role probes
technical_management_review_reporting:
  pilot_review: owner or designated reviewer checks whether questions are neutral and whether records can be coded consistently
  structural_review: exact external client information-product worker
  semantic_review: TECH-VER of plan against the refined BMA model and evidence boundaries
  future_reporting: after data collection TM-MEAS measurement report plus updated TECH-BMA/TECH-STK products as warranted
related_plans_and_task_descriptions:
  refined_model: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-REFINEMENT-20260905-001-V1
  stakeholder_identification: ARTVER-CPLUS-STK-CLIENT-DECISION-STAKEHOLDER-IDENTIFICATION-20260905-001-V1
  next_expected_products_after_execution:
