    - TM-MEAS measurement report for cross-case findings
    - TECH-BMA report update for confirmed/contradicted value hypotheses
    - TECH-STK products only where direct evidence supports stakeholder needs
interview_protocol:
  duration_target: 35-45 minutes
  common_core:
    - step: opening
      prompt: Коротко обозначить цель как изучение того, как человек решает реальные рабочие задачи; не презентовать гипотезу ценности.
    - step: select_episode
      prompt: Вспомните последний конкретный случай, когда изменение нормы, требование, спорная ситуация или профессиональный вопрос заставили вас принимать значимое решение. Что произошло?
    - step: decision
      prompt: Какое именно решение или действие от вас требовалось и к какому сроку?
    - step: consequence
      prompt: Что могло произойти, если решение оказалось бы неверным или запоздало?
    - step: information_path
      prompt: Какую информацию и основания вы искали, где искали и в какой последовательности?
    - step: uncertainty
      prompt: В какой момент оставалась наибольшая неопределенность и что помогло ее уменьшить?
    - step: participants
      prompt: Кто еще участвовал, согласовывал, исполнял или зависел от решения?
    - step: action_and_evidence
      prompt: Что в итоге сделали и какое основание решения сохранилось или могло быть показано другому человеку?
    - step: consultantplus_role
      prompt: На каких этапах использовался КонсультантПлюс? Что конкретно он позволил сделать, а чего не позволил?
    - step: ric_role
      prompt: Обращались ли к РИЦ или использовали обучение/сопровождение? Что изменилось благодаря этому, если изменилось?
    - step: counterfactual
      prompt: Если бы в этот момент КонсультантПлюс был недоступен, что вы сделали бы иначе? Это не считается доказательством причинности и фиксируется как оценка участника.
    - step: recurrence
      prompt: Как часто возникают похожие ситуации и насколько они типичны для вашей роли?
    - step: value_language
      prompt: Если объяснять коллеге одним предложением, за что именно здесь была ценность продукта или сервиса, как бы вы это сказали?
    - step: gap
      prompt: Что было самым трудным или недостающим в этом эпизоде?
  role_specific_probes:
    G1_professional_end_user:
      - что стало достаточным основанием для действия или позиции
      - приходилось ли сравнивать несколько норм, версий, разъяснений или практик
    G2_functional_owner:
      - было ли решение единичным или потребовало изменить правило работы команды
      - как решение передавалось сотрудникам и как контролировалось повторное применение
    G3_buyer_sponsor:
      - какое решение о покупке, продлении, составе комплекта, доступе, обучении или сервисе реально принималось
      - какие рабочие сценарии считались достаточно значимыми, чтобы за них платить
    G4_RIC_client_facing:
      - с каким клиентским решением или затруднением пришел клиент
      - какое действие РИЦ было предпринято и какое изменение поведения/результата наблюдалось
      - что осталось предположением РИЦ без прямого подтверждения клиента
episode_record_template:
  required_fields:
    episode_id: coded unique identifier
    interview_id: coded identifier
    participant_group: G1|G2|G3|G4
    participant_role: free controlled text without personal name
    organization_context: sector/size/use-maturity at non-identifying level where useful
    trigger: concise factual trigger
    decision_or_action_required: concise decision statement
    decision_level: C1|C2|C3|C4|C5|C6|P1|P2|unresolved
    deadline_or_time_pressure: none|low|medium|high|critical|not_established
    consequence_if_wrong_or_late: participant description plus ordinal criticality code
    participants_involved: role list
    information_needed: evidence/information sought
    sources_used: source classes
    uncertainty_point: main unresolved point in episode
    consultantplus_contribution: none|find|applicability|interpret|compare|justify|monitor|other plus narrative
    ric_contribution: none|setup|training|consultation|support|other plus narrative
    action_or_status: decided|implemented|pending|abandoned|other
    retained_basis: what evidence or rationale could be reproduced
    recurrence: participant-reported frequency or qualitative class
    gap_type: information|search|interpretation|workflow|access|training|service|other|none
    counterfactual_without_product: participant judgment, not causal fact
    value_wording_verbatim_or_paraphrase: consent-dependent
    evidence_class_by_field: direct_episode_fact|participant_judgment|interviewer_inference|RIC_account|not_established
    interviewer_notes: explicitly non-factual unless supported
measures:
  - {id: M01, name: decision_level, operational_definition: code the principal decision owner/object as C1-C6 or provider response P1-P2; unresolved when evidence is insufficient}
  - {id: M02, name: episode_validity, operational_definition: valid only when trigger, decision/action, sequence/evidence path and action/status are reconstructable}
  - {id: M03, name: consequence_criticality, operational_definition: participant-reported consequence if wrong/late coded low-medium-high-critical with narrative retained}
  - {id: M04, name: recurrence, operational_definition: participant-reported occurrence frequency preserved as exact statement and optionally coded one_off-rare-monthly-weekly-daily_or_more}
  - {id: M05, name: consultantplus_contribution_role, operational_definition: classify reported contribution as find/applicability/interpret/compare/justify/monitor/other/none}
  - {id: M06, name: RIC_contribution_role, operational_definition: classify reported service contribution as setup/training/consultation/support/other/none}
  - {id: M07, name: retained_basis_reproducibility, operational_definition: yes/partial/no/not_established based on whether participant can describe a reproducible basis for the decision}
  - {id: M08, name: gap_type, operational_definition: dominant remaining gap coded information/search/interpretation/workflow/access/training/service/other/none}
  - {id: M09, name: hypothesis_support, operational_definition: supported/contradicted/mixed/not_tested for H1-H5 with episode IDs as evidence}
data_collection_and_storage:
  collection:
    - interviewer completes one episode record per distinct episode immediately after or during interview
    - raw audio is not required; if used it requires consent and separate retention decision
    - direct quotation is optional; paraphrase is default
  storage:
    canonical_future_state: de-identified episode data must be persisted through a TM-MEAS measurement register or another exact canonical O resolved before persistence
    temporary_notes: may be used only as transient working material and must not become an unclassified persistent semantic carrier
    identifiers: coded IDs; no personal names required in the canonical measurement record
analysis_interpretation_reporting:
  analysis:
    - first inspect within each participant group, then compare across groups
    - compare client and RIC accounts without treating one as substitute for the other
    - trace every hypothesis disposition and reported pattern to episode IDs
    - distinguish frequency in the sample from population prevalence
    - record contradictory cases rather than averaging them away
  interpretation_rules:
    - one episode can reveal a scenario but cannot establish market prevalence
    - participant counterfactual is perception evidence, not causal proof
    - repeated high-criticality scenarios can justify further BMA/STK analysis but not automatic requirements
  reporting:
    - report confirmed, contradicted, mixed and untested hypotheses separately
    - report uncovered decision scenarios by level and participant group
    - report product and RIC contribution separately
    - carry unresolved evidence explicitly forward
responsibilities_resources_tools_schedule:
  responsibilities: see responsibilities_and_authorities
  resources: interviewer, analyst, participant access, authorized repository and coding representation
  tools: interview guide, episode record, controlled coding representation
  schedule: pilot -> one controlled revision -> main wave -> synthesis; calendar dates pending participant availability
measurement_process_evaluation:
  after_pilot:
    - check whether participants can reliably identify a concrete recent episode without product prompting
    - check whether C/P level coding is unambiguous enough for two reviewers
    - remove or rewrite leading or duplicative prompts while versioning material measure changes
  after_main_wave:
    - assess percentage of interviews yielding at least one valid episode
    - assess proportion of required episode fields left not_established
    - assess reviewer agreement on a sample of decision-level and contribution-role codes
    - identify measures that did not affect any decision or hypothesis and consider retiring them in a successor plan
change_procedure_and_history:
  procedure: any material change to sample scope, core interview sequence, measure definition, evidence classes or privacy rules requires a new ArtifactVersion and renewed TECH-VER as applicable
  history: initial V1 created from the refined decision-value model before pilot
completion_process:
  plan_completion: this plan is complete when structurally verified and semantically reviewed; execution remains future work
  wave_completion_candidate:
    - pilot completed and any material revision versioned
    - all four first-wave groups represented or explicit recruitment gap recorded
    - target at least 25 valid episodes or explicit evidence-insufficiency stop decision
    - every analyzed claim traces to episode IDs
    - synthesis separates confirmed, contradicted, mixed and unresolved hypotheses
  next_gate: owner decides whether evidence is sufficient to update BMA/STK and whether a second wave is justified
glossary:
  critical_incident_style_interview: semi-structured reconstruction of a concrete meaningful episode rather than general attitude questioning
  valid_episode: episode with enough concrete sequence and decision evidence to support coding
  measure: operationally defined field or classification used consistently across episodes
  provider_response: RIC/Network action taken in response to a client scenario, not a client decision level
  purposive_sample: intentionally selected qualitative sample for variation and hypothesis testing, not a statistical population sample
