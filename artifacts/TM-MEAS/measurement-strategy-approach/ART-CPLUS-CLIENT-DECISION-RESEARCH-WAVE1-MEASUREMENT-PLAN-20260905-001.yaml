    - TM-MEAS measurement report for cross-case positioning findings
    - TECH-BMA report successor for confirmed/contradicted positioning hypotheses if material
    - TM-DEC decision register only after an actual authorized positioning decision
interview_protocol:
  duration_target: 40-50 minutes
  common_core:
    - {step: opening, prompt: 'Изучаем, как решаются реальные рабочие задачи и как в них используются информационные источники и сервис; кандидатное позиционирование заранее не показывать.'}
    - {step: select_episode, prompt: 'Вспомните последний конкретный случай, когда изменение нормы, требование, спорная ситуация или профессиональный вопрос заставили вас принимать значимое решение. Что произошло?'}
    - {step: decision, prompt: 'Какое именно решение или действие от вас требовалось и к какому сроку?'}
    - {step: consequence, prompt: 'Что могло произойти при ошибке или задержке — только в пределах того, что вы реально знаете или ожидали?'}
    - {step: information_path, prompt: 'Какую информацию и основания вы искали, где и в какой последовательности?'}
    - {step: category_unaided, prompt: 'Как вы сами называете класс инструмента или помощи, который нужен был в этой ситуации?'}
    - {step: alternatives_unaided, prompt: 'Что еще вы реально использовали или рассматривали вместо этого или вместе с этим?'}
    - {step: criteria, prompt: 'По каким признакам вы понимали, что источник или инструмент достаточно хорош для этой задачи?'}
    - {step: parity, prompt: 'Какие свойства для вас здесь обязательны — без них вариант вообще не подходит?'}
    - {step: difference, prompt: 'Что в КонсультантПлюс в этом эпизоде реально отличалось или было особенно полезно?'}
    - {step: reason_to_believe, prompt: 'Из чего вы сделали вывод, что этому свойству или результату можно доверять?'}
    - {step: consultantplus_role, prompt: 'Что конкретно позволил сделать КонсультантПлюс, а чего он не решил?'}
    - {step: ric_role, prompt: 'Был ли вклад РИЦ, обучения или сопровождения? Что именно изменилось благодаря этому, если изменилось?'}
    - {step: counterfactual, prompt: 'Если бы КонсультантПлюс был недоступен, что бы вы сделали? Ответ фиксируется как ваша оценка, не как доказательство причинности.'}
    - {step: spontaneous_value_language, prompt: 'Если объяснить коллеге одним предложением, в чем здесь была ценность КонсультантПлюс и отдельно РИЦ?'}
    - {step: aided_PT2, prompt: 'Насколько к этому эпизоду подходит смысл «понять, что это значит и что делать»? Что подходит и что нет?'}
    - {step: aided_PT3, prompt: 'Насколько подходит смысл «иметь актуальную и проверяемую основу профессионального решения»? Что подходит и что нет?'}
    - {step: aided_PT6, prompt: 'Насколько подходит смысл «система дает правовую основу, РИЦ помогает применять ее в рабочих сценариях»? Где граница вклада каждого?'}
    - {step: aided_PT7, prompt: 'Насколько достаточно обычного объяснения через полную и актуальную правовую базу, аналитику и профессиональные инструменты? Чего в нем не хватает или что лишнее?'}
    - {step: distinguishability, prompt: 'Какое из этих объяснений, если какое-то, действительно отличает решение от ваших реальных альтернатив? Почему?'}
    - {step: gap, prompt: 'Что было самым трудным или недостающим в эпизоде и какое обещание продукта здесь было бы неправдоподобным?'}
  role_specific_probes:
    G1_professional_end_user: [что стало достаточным основанием действия или позиции, какие источники приходилось сопоставлять, что означало доверие к ответу]
    G2_functional_owner: [потребовалось ли менять правило работы команды, как решение передавалось и контролировалось, что требуется для воспроизводимости]
    G3_buyer_sponsor: [что реально влияло на покупку или продление, какие сценарии оправдывают комплект доступ обучение или сервис, какие альтернативы рассматривались]
    G4_RIC_client_facing: [с каким клиентским затруднением пришли, какое действие РИЦ было выполнено, что клиент мог бы сделать без РИЦ, где РИЦ не должен приписывать себе результат]
measures:
  - {id: M01, name: participant_role_and_context, operational_definition: coded participant group plus organization-context descriptors without unnecessary identifiers}
  - {id: M02, name: decision_level, operational_definition: C1-C6 or P1 with explicit not_established option}
  - {id: M03, name: episode_trigger_and_required_action, operational_definition: reported trigger plus concrete decision/action and timing}
  - {id: M04, name: frame_of_reference, operational_definition: participant unaided category wording plus analyst normalized code kept separately}
  - {id: M05, name: actual_alternatives, operational_definition: alternatives actually used/considered/counterfactually stated; no researcher-invented default set}
  - {id: M06, name: choice_criteria, operational_definition: participant-stated criteria and their role-specific importance}
  - {id: M07, name: points_of_parity, operational_definition: criteria participant treats as mandatory for any acceptable option in frame}
  - {id: M08, name: points_of_difference_candidate, operational_definition: participant-stated or analyst-coded differentiating property with evidence-class tag}
  - {id: M09, name: reason_to_believe, operational_definition: evidence or experience cited as basis for believing the claimed property}
  - {id: M10, name: consultantplus_contribution, operational_definition: episode-level participant-described contribution of CP separated from total outcome}
  - {id: M11, name: RIC_contribution, operational_definition: episode-level participant/RIC-described contribution of service separated from CP and client}
  - {id: M12, name: spontaneous_value_language, operational_definition: unaided participant wording captured before candidate territory presentation}
  - {id: M13, name: territory_relevance, operational_definition: qualitative fit plus rationale for PT2/PT3/PT6/PT7; not a standalone adoption score}
  - {id: M14, name: territory_believability, operational_definition: participant judgment of credibility and cited reason to believe}
  - {id: M15, name: territory_distinctiveness, operational_definition: participant comparison against actual alternatives with explicit not_established}
  - {id: M16, name: hypothesis_support, operational_definition: supported/contradicted/mixed/role_specific/not_tested per territory with episode IDs}
  - {id: M17, name: evidence_boundary_flags, operational_definition: unsupported causal financial legal or market-generalization claims encountered during analysis}
episode_record_template:
  required_fields:
    - episode_id
    - participant_group
    - role_context
    - trigger
    - decision_or_action
    - C_or_P_code
    - information_path
    - frame_of_reference_unaided
    - actual_alternatives
    - choice_criteria
    - points_of_parity
    - points_of_difference_candidates
    - reasons_to_believe
    - consultantplus_contribution
    - RIC_contribution
    - other_contributions
    - action_or_status
    - remaining_uncertainty
    - spontaneous_value_language
    - PT2_reaction
    - PT3_reaction
    - PT6_reaction
    - PT7_reaction
    - distinctiveness_against_actual_alternatives
    - evidence_classes
    - interviewer_inferences
    - unresolved
  validity_rule: >-
    episode is valid for core analysis only when trigger, role, decision/action, information path and action/status are concrete;
    positioning-specific frame/alternative fields may be not_established but may not be silently filled by analyst
  separation_rules:
    - participant wording and analyst normalized code are distinct fields
    - aided and unaided value language are distinct
    - CP and RIC contribution are distinct
    - counterfactual is perception evidence only
    - provider official claim is never reclassified as client fact
data_collection_and_storage:
  collection:
    - one episode record per distinct episode during or immediately after interview
    - raw audio not required; if used requires consent and separate retention decision
    - direct quotation optional; paraphrase default
  storage:
    canonical_future_state: de-identified episode data must be persisted through TM-MEAS measurement register or another exact canonical O resolved before persistence
    temporary_notes: transient only and must not become unclassified persistent semantic carrier
    identifiers: coded IDs; personal names not required in canonical measurement record
analysis_interpretation_reporting:
  analysis:
    - analyze within each participant group before cross-group comparison
    - reconstruct frames and alternatives before scoring territory support
    - compare client and RIC accounts without substitution
    - trace every territory disposition to episode IDs
    - distinguish sample frequency from population prevalence
    - preserve contradictory cases and alternative frames
    - separate official product facts, participant facts, participant judgments and analyst inference
  interpretation_rules:
    - one episode can reveal a scenario/frame/alternative but cannot establish market prevalence
    - aided message preference cannot replace spontaneous language or actual episode evidence
    - participant counterfactual is perception evidence, not causal proof
    - repeated high-criticality scenarios can justify further analysis but not automatic requirements or adoption
    - relative superiority is not established without explicit comparison evidence
  reporting:
    - report supported, contradicted, mixed, role-specific and untested territories separately
    - report observed frames and actual alternatives by role/context
    - report PoP/PoD/RTB with evidence classes
    - report CP and RIC contribution separately
    - carry unresolved evidence explicitly forward
responsibilities_resources_tools_schedule:
  responsibilities: see responsibilities_and_authorities
  resources: interviewer, analyst, participant access, authorized repository and coding representation
  tools: interview guide, episode record, controlled coding representation
  schedule: pre-pilot TECH-VER -> pilot -> controlled revision -> main wave -> measurement report; dates pending authorization and availability
measurement_process_evaluation:
  after_pilot:
    - check whether participants can identify concrete episode without product prompting
    - check whether unaided frame and alternatives can be elicited without excessive interviewer interpretation
    - check whether aided territory module changes or contaminates earlier answers
    - check reviewer agreement on C/P, frame, alternative, contribution and territory-support coding
    - rewrite leading/duplicative prompts while versioning material changes
  after_main_wave:
    - assess share of interviews yielding valid episodes
    - assess share of frame/alternative fields left not_established
    - assess second-review agreement on sampled codes
    - identify territories that are consistently redundant, implausible or role-specific
    - identify whether any new territory emerges repeatedly from spontaneous value language
change_procedure_and_history:
  procedure: any material change to sample scope, core interview sequence, measure definitions, territory set, evidence classes or privacy rules requires a new ArtifactVersion and renewed TECH-VER as applicable
  history: V2 materially expands V1 from decision-value testing to comparative positioning validation
completion_process:
  plan_completion: this V2 plan is complete only when structurally verified and semantically reviewed; execution remains separate future work
  wave_completion_candidate:
    - pilot completed and material revision versioned
    - all four first-wave groups represented or explicit recruitment gap recorded
    - target at least 25 valid episodes or explicit evidence-insufficiency stop decision
    - every analyzed claim and territory disposition traces to episode IDs
    - synthesis separates supported contradicted mixed role-specific and unresolved hypotheses
  next_gate: owner decides whether evidence is sufficient for BMA update and whether an actual positioning choice should enter TM-DEC
glossary:
  critical_incident_style_interview: semi-structured reconstruction of a concrete meaningful episode rather than general attitude questioning
  frame_of_reference: participant category or competitive frame used to understand the solution
  actual_alternative: option actually used considered or explicitly named by participant, not a researcher-prescribed competitor list
  point_of_parity: property treated as necessary for acceptable participation in a category
  point_of_difference: candidate differentiating property whose relevance and evidence must be tested
  reason_to_believe: basis for believing a claimed difference
  aided_message_test: reaction after candidate wording is shown; stored separately from spontaneous value language
  purposive_sample: intentionally selected qualitative sample for variation and hypothesis testing, not statistical population sample
change_history:
  - {version: V1, date: '2026-09-05', change: establish first-wave episode-based measurement plan for decision-value model}
  - {version: V2, date: '2026-09-07', change: add comparative positioning dimensions, actual alternatives, PoP/PoD/RTB and aided territory test after unaided episode reconstruction}
