artifact_instance_purpose: >-
  Материально расширить первую волну исследования реальных клиентских решений так, чтобы она проверяла
  не только decision-centric модель ценности C1-C6/P1-P2, но и сравнительные гипотезы позиционирования:
  сегмент и роль, конкретный эпизод, frame of reference, фактические альтернативы, points of parity,
  points of difference, reason to believe, язык ценности, отдельный вклад КонсультантПлюс и РИЦ и
  реакцию на альтернативные территории после нейтральной реконструкции эпизода.
