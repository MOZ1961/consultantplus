introduction:
  purpose: >-
    Получить у руководителя РИЦ проверяемые сведения о реальной управленческой работе, клиентско-сервисных
    эпизодах, используемых основаниях и разрывах, а затем отдельно проверить полезность предлагаемого взаимодействия.
  audience: [руководитель РИЦ, owner, interviewer, analyst, subsequent TECH-BMA, subsequent TM-MEAS]
  coverage: [управленческие решения, конкретный эпизод, основания, неопределенность, фактические альтернативы, вклад КонсультантПлюс, вклад РИЦ, наблюдаемый результат, повторяемость, управленческая применимость, доверие, границы обещаний, условия пилота]
  nonpurpose: [не продажный скрипт, не рыночная валидация, не замена клиентским интервью, не официальный выбор позиционирования]
planned_activities_and_tasks:
  - завершить Q01-Q17 до показа объяснения взаимодействия
  - получить один конкретный недавний эпизод или явно зафиксировать недостаточность данных
  - получить фактические альтернативы без заданного исследователем списка
  - раздельно зафиксировать вклад КонсультантПлюс РИЦ клиента и других источников
  - показать exact director-facing view только после unaided части
  - провести Q18-Q26 о полезности доверии границах и условиях пилота
  - после интервью проверить наведение пропуски смешение классов доказательств и приватность
  - реальные ответы сохранять только через будущий TM-MEAS measurement register
tools_methods_techniques:
  method: semi-structured director interview with critical-episode reconstruction and unaided-before-aided value testing
  techniques:
    - one concrete recent case before generalization
    - neutral chronological reconstruction
    - open question before candidate categories where feasible
    - actual alternatives before provider prompts
    - facts judgments criteria alternatives aided reactions pilot intent and analyst inference stored separately
    - ConsultantPlus RIC client and other contributions coded separately
    - explicit not_established instead of analyst completion
    - management usefulness separated from liking the idea and pilot intent
  tools: [interview channel, embedded questionnaire, structured coding representation, future TM-MEAS measurement register]
schedule:
  sequencing:
    - {stage: exact_head_structural_verification, status: required before readiness claim}
    - {stage: director_interview_part_A, duration: approximately 20-30 minutes}
    - {stage: show_interaction_view, duration: approximately 3-5 minutes}
    - {stage: director_interview_part_B, duration: approximately 10-15 minutes}
    - {stage: reviewer_check, status: after interview}
    - {stage: persistence_and_synthesis, status: only after actual data}
  dates: not_established
budget_and_cost_estimate:
  state: no_external_cost_committed
  estimate: preparation is internal; participant incentives travel and other external costs are not authorized or assumed
resources_and_allocation:
  owner: scope external-use and acceptance authority
  director_participant: voluntary evidence from own work
  interviewer: neutral questioning and sequence control
  analyst: evidence-class coding and bounded inference
  repository: process-owned products and future measurement records
responsibilities_and_authorities:
  owner: {authority: authorize external use participant contact acceptance and any later positioning decision}
  interviewer: {authority: ask and clarify; no authority to promise product changes or approved positioning}
  analyst: {authority: provisional coding and evidence-bounded inference only}
  director_participant: {authority: describe own decisions and experience; market or Network claims bounded by own knowledge}
participant_interfaces:
  director_to_interviewer: management decisions episode facts evidence gaps alternatives criteria value language and pilot conditions
  interviewer_to_analysis: de-identified structured responses with evidence-class tags
  analysis_to_TECH_BMA: supported contradicted mixed and unresolved positioning hypotheses
  analysis_to_TM_DEC: no automatic decision; evidence only if an authorized decision is later requested
risk_assessment_and_mitigation:
  - {risk: опрос подтверждает нашу презентацию, mitigation: PART_A полностью завершается до показа view}
  - {risk: общие мнения вместо реального случая, mitigation: concrete recent episode or explicit not_established}
  - {risk: исследователь придумывает альтернативы, mitigation: unaided elicitation and no default competitor set}
  - {risk: мнение РИЦ превращается в клиентское доказательство, mitigation: separate evidence class and later client-side wave}
  - {risk: интерес к пилоту становится доказательством пользы, mitigation: separate pilot_intent from management_usefulness}
  - {risk: возникает неподтвержденное причинное или финансовое утверждение, mitigation: prohibit ROI prevented fines and general-effect attribution}
  - {risk: в интервью попадают чувствительные данные, mitigation: de-identification and no CRM dump names credentials correspondence or margin by default}
quality_and_effectiveness_measures:
  quality_criteria:
    - PART_A completed before view exposure
    - concrete management decision and episode or explicit insufficiency recorded
    - actual alternatives participant-stated or not_established
    - facts and judgments distinguishable
    - ConsultantPlus and RIC contributions separate
    - management usefulness and pilot intent separate
    - aided reactions trace to exact view
    - no sensitive data required for validity
  effectiveness_signals:
    - interview yields at least one actionable evidence gap or explicit finding that the method adds no useful management information
    - director can name a management decision that would or would not use the result
    - trust and stop/continue criteria are explicit
  noncriteria: [willingness to talk, one positive interview, aided preference]
environment_infrastructure_security:
  environment: authorized RIC director interview plus MOZ1961/consultantplus persistence
  infrastructure: interview channel and structured response representation
  privacy_security:
    - role and context instead of personal identifiers by default
    - no client names contacts credentials raw CRM exports confidential correspondence or margin by default
    - direct quotations only with consent
    - audio only with explicit consent and retention decision
  safety: interview makes no legal tax professional or client decision
training:
  interviewer_orientation:
    - do not show view until Q17 is completed
    - ask one question at a time where feasible
    - probe concrete examples without forcing an answer
    - distinguish evidence classes
    - preserve disagreement and negative responses
technical_management_review_reporting:
  pre_use_review: exact-head structural verification plus subject TECH-VER composition review
  post_interview_review: question-order contamination missing fields coding drift privacy and evidence-class integrity
  structural_review: generic-SE external-client information-product worker
  future_reporting: TM-MEAS measurement report only after actual data; TECH-BMA successor only if evidence materially changes hypotheses
related_plans_and_task_descriptions:
  positioning_report: ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V3
  broad_wave_plan: ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V2
  pilot_plan: ARTVER-CPLUS-RIC-POSITIONING-PILOT-MEASUREMENT-PLAN-20260907-001-V1
  existing_director_offer: ARTVER-CPLUS-RIC-EXPRESS-SERVICE-EPISODE-PROPOSAL-20260906-001-V4
  standard_product_rule: questionnaire is a view inside this TM-MEAS Plan and is not a standalone persistent product
measurement_needs_and_information_requirements:
  primary_questions:
    - какие управленческие решения руководитель реально принимает и каких оснований ему не хватает
    - какой конкретный недавний эпизод показывает клиентское решение и действие РИЦ
    - какие альтернативы и источники реально использовались
    - что отдельно дали КонсультантПлюс РИЦ клиент и другие участники
    - какой результат наблюдался и что осталось неизвестным
    - какие повторяющиеся сценарии подтверждены примерами
    - какой аналитический результат реально пригоден для управленческого решения
    - какие требования к доверию границам обещаний и пилоту существенны для директора
  evidence_unit: конкретное утверждение руководителя, привязанное к роли, реальному эпизоду или явной реакции на показанное объяснение, с классом доказательства
  evidence_classes: [director_reported_episode_fact, director_interpretation_or_judgment, director_stated_management_decision, director_stated_choice_or_trust_criterion, director_stated_actual_alternative, director_reaction_to_interaction_view, director_pilot_intent_or_condition, interviewer_coding_or_inference, provider_existing_claim, not_established]
questionnaire:
  instructions_to_interviewer:
    - объяснить что задача понять реальную управленческую работу а не подтвердить лозунг
    - завершить PART_A до показа interaction-benefit view
    - при общем ответе запросить один недавний конкретный пример
    - допускать not_established и не заполнять пробелы за участника
  PART_A_unaided_real_management_and_episode:
    - {id: Q01, question: 'Какие 2–3 решения о клиентах, сервисе или использовании КонсультантПлюс вам как руководителю РИЦ приходится принимать регулярно?'}
    - {id: Q02, question: 'Какое из этих решений в последний раз было реально важным или трудным? Возьмем один конкретный недавний случай.'}
    - {id: Q03, question: 'Что произошло и что стало сигналом, что решение нужно принимать?'}
    - {id: Q04, question: 'Что именно требовалось решить или изменить и к какому сроку?'}
    - {id: Q05, question: 'На какие факты, данные, отчеты, разговоры или наблюдения вы реально опирались?'}
    - {id: Q06, question: 'Чего вам не хватало для уверенного решения? Что осталось неизвестным?'}
    - {id: Q07, question: 'Какие другие варианты действий или источники информации вы реально рассматривали?'}
    - {id: Q08, question: 'Был ли в этом случае конкретный клиентский эпизод? Какое решение или действие требовалось самому клиенту?'}
    - {id: Q09, question: 'Что в этом эпизоде конкретно позволил сделать КонсультантПлюс, а чего он сам не решил?'}
    - {id: Q10, question: 'Что конкретно сделал РИЦ: консультация, обучение, сопровождение, настройка, эскалация или другое?'}
    - {id: Q11, question: 'Что сделал сам клиент и какие еще люди или источники повлияли на результат?'}
    - {id: Q12, question: 'Чем эпизод закончился на тот момент? Какой результат или статус можно было наблюдать?'}
    - {id: Q13, question: 'Что осталось нерешенным, спорным или неясным?'}
    - {id: Q14, question: 'Насколько похожие случаи повторяются? На чем основано ваше мнение — можете привести еще один реальный пример?'}
    - {id: Q15, question: 'Какое управленческое решение сегодня труднее всего принять по обычным данным CRM, статистике обращений, продаж или обучения?'}
    - {id: Q16, question: 'Что должно быть в доказательстве, чтобы вы реально использовали его в управленческом решении: воспроизводимость, связь с конкретным случаем, сравнение, скорость, другое?'}
    - {id: Q17, question: 'Какой анализ клиентских случаев был бы для вас бесполезным или даже вводящим в заблуждение?'}
  PART_B_after_showing_interaction_and_benefit_view:
    view_ref: ARTVER-CPLUS-RIC-DIRECTOR-INTERACTION-BENEFIT-SUPPLY-RESPONSE-20260907-001-V2
    questions:
      - {id: Q18, question: 'Что в этом способе взаимодействия полезно именно для ваших управленческих решений, если полезно вообще?'}
      - {id: Q19, question: 'Что звучит слишком общо, неправдоподобно или не соответствует работе вашего РИЦ?'}
      - {id: Q20, question: 'Какие решения вы могли бы принимать лучше, если бы разобрали 3–5 таких обезличенных эпизодов?'}
      - {id: Q21, question: 'Какой результат такого анализа вы реально использовали бы на совещании: короткий вывод, типовые сценарии, подтвержденные разрывы, рекомендации, другое?'}
      - {id: Q22, question: 'Что вам нужно увидеть, чтобы доверять выводам: исходный эпизод, трассу к фактам, независимую проверку, повторяемость, сравнение, другое?'}
      - {id: Q23, question: 'Где для вас проходит граница ответственности КонсультантПлюс, РИЦ и самого клиента?'}
      - {id: Q24, question: 'Какое обещание о пользе такого взаимодействия мы точно не должны давать?'}
      - {id: Q25, question: 'Имеет ли смысл проверить подход на одном реальном обезличенном случае? Если да — какой участник и какой тип случая подходят лучше всего; если нет — почему?'}
      - {id: Q26, question: 'Какой результат первого пилота будет для вас достаточным основанием продолжить на 3–5 случаях, а какой — основанием остановиться?'}
measures:
  - {id: M01, name: director_management_decision, operational_definition: concrete recurring management decision plus recent instance}
  - {id: M02, name: decision_evidence_base, operational_definition: data facts conversations or observations actually used}
  - {id: M03, name: evidence_gap, operational_definition: missing uncertain or unavailable decision information}
  - {id: M04, name: actual_alternatives, operational_definition: participant-stated alternatives; not_established allowed}
  - {id: M05, name: client_decision_episode, operational_definition: concrete client-side required decision or action when known}
  - {id: M06, name: consultantplus_contribution, operational_definition: participant-described contribution separated from total outcome}
  - {id: M07, name: RIC_contribution, operational_definition: RIC intervention separated from ConsultantPlus client and others}
  - {id: M08, name: observable_result_and_uncertainty, operational_definition: episode status or result plus unresolved uncertainty}
  - {id: M09, name: recurrence_evidence, operational_definition: repeated-case claim plus example or explicit weak basis}
  - {id: M10, name: management_usefulness, operational_definition: concrete management decision that would use or reject proposed analysis}
  - {id: M11, name: trust_criterion, operational_definition: evidence feature required for reliance}
  - {id: M12, name: unacceptable_promise, operational_definition: director-stated credibility boundary}
  - {id: M13, name: pilot_intent_and_condition, operational_definition: yes no or conditional pilot interest and rationale}
  - {id: M14, name: continuation_stop_criterion, operational_definition: evidence threshold to continue or stop}
data_collection_and_storage:
  collection:
    - one structured response set per director
    - one concrete episode preferred; multiple examples remain distinguishable
    - paraphrase by default; direct quote only with consent
  storage:
    canonical_future_state: actual responses become TM-MEAS measurement register rows after data exist
    temporary_notes: transient only and not parallel semantic authority
    sensitive_data: unnecessary identifiers and confidential details excluded
analysis_interpretation_reporting:
  analysis:
    - analyze PART_A before PART_B reactions
    - distinguish episode facts from general director judgments
    - preserve not_established contradictions and negative evidence
    - compare recurrence claims with actual examples
    - separate management usefulness from pilot intent
    - separate ConsultantPlus RIC client and other contributions
  interpretation_rules:
    - one director is not Network prevalence
    - aided preference does not replace unaided evidence
    - pilot intent is not proof of usefulness or willingness to pay
    - no relative superiority claim without comparison evidence
  reporting:
    - classify hypotheses as supported contradicted mixed or unresolved
    - preserve evidence class and source for each material finding
    - recommend next measurement only where a management decision or evidence gap is explicit
measurement_process_evaluation:
  after_first_interview:
    - test whether Q01-Q17 can be completed without revealing our proposed value frame
    - test whether a concrete case rather than only strategic generalization is obtained
    - inspect whether Q18-Q26 create acquiescence or sales pressure
    - version material question or measure changes
  after_three_director_interviews_if_authorized:
    - compare evidence yield and recurrent gaps
    - assess coding consistency for contribution usefulness and trust
    - decide whether to integrate the director instrument into the broader wave
change_procedure_and_history:
  procedure: material change to sequence evidence classes questions measures privacy or interpretation rules requires successor ArtifactVersion and renewed TECH-VER as applicable
  history: V2 makes the ГОСТ/PPR normative composition explicit without converting the questionnaire into a standalone product
completion_process:
  plan_completion: standard composition candidate is structurally complete in this ArtifactVersion; exact-head worker and subject TECH-VER remain separate evidence gates
  interview_completion_candidate:
    - PART_A before view
    - concrete decision and episode or explicit insufficiency
    - PART_B reactions trust and stop criteria
    - privacy and evidence-class rules followed
  next_gate: actual response data -> TM-MEAS measurement register -> measurement report; official positioning only via separate decision
