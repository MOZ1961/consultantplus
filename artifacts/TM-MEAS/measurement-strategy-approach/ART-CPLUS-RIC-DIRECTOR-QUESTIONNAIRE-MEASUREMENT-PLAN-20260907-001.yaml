scope: >-
  Интервью руководителя РИЦ ориентировочно 35–50 минут. Часть A собирает сведения без показа нашей модели;
  часть B после показа точного director-facing объяснения проверяет управленческую применимость, доверие,
  границы обещаний и условия пилота. План не измеряет рыночную долю, ROI, юридическую правильность решений
  или распространенность мнения одного руководителя на Сеть.
