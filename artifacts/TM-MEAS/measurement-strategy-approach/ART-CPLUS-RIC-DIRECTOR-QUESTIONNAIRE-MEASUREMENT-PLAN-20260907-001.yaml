glossary:
  director_interview: interview focused on real RIC management decisions and evidence needs
  unaided: response elicited before candidate explanation is shown
  aided: response elicited after the exact candidate explanation is shown
  management_usefulness: support for a concrete management decision rather than liking the idea
  pilot_intent: willingness or condition to try the method; not adoption evidence
  evidence_gap: materially relevant unavailable uncertain or untraceable information
  standard_composition: applicable generic and specific normative content plus owner-product requirements and explicit traceability
change_history:
  - {version: V1, date: '2026-09-07', change: create director-specific positioning and interaction questionnaire inside standard measurement plan}
  - {version: V2, date: '2026-09-07', change: materialize explicit standard composition for ГОСТ §7.3 + §10.46, bind current owner request and prepare exact composition verification}
