artifact_instance_purpose: >-
  Подготовить для руководителя РИЦ нейтральный доказательный опросник как часть стандартного Плана измерений:
  сначала получить без подсказок факты о реальных управленческих решениях, клиентских и сервисных эпизодах,
  используемых основаниях, разрывах и фактических альтернативах, затем отдельно проверить понятность и полезность
  предлагаемого взаимодействия и кандидатных формулировок ценности. Не превращать интерес к пилоту в доказательство
  рыночного принятия и не требовать персональные данные или выгрузку CRM по умолчанию.
