scope: >-
  Интервью руководителя РИЦ продолжительностью ориентировочно 35–50 минут. Первая часть реконструирует
  реальные решения и эпизоды без показа нашей модели; вторая часть после краткого объяснения взаимодействия
  проверяет управленческую применимость, доверие, границы обещаний и условия пилота. Опросник не измеряет
  рыночную долю, статистическую распространенность мнений, ROI или юридическую правильность решений.
