artifact_instance_purpose: >-
  Установить стандартный состав Плана измерений для интервью руководителя РИЦ и сохранить опросник как
  представление внутри этого process-owned продукта. План должен полностью покрывать типовой состав плана
  по ГОСТ Р 58609-2019 §7.3 и специальный состав плана измерений §10.46, требования владельца PPR-001..012,
  парную ISO/ГОСТ-трассировку и доказательные границы: сначала независимая реконструкция реальных решений
  и эпизодов, затем отдельно реакция на показанное объяснение взаимодействия и пользы.
