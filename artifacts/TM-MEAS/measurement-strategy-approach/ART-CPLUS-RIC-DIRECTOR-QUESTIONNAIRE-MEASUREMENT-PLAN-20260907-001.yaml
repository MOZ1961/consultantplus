scope: >-
  Интервью руководителя РИЦ ориентировочно 35–50 минут. Часть A реконструирует реальные решения и эпизоды
  без показа нашей модели; часть B после краткого объяснения взаимодействия проверяет управленческую применимость,
  доверие, границы обещаний и условия пилота. Опросник не измеряет рыночную долю, ROI или юридическую правильность решений.
