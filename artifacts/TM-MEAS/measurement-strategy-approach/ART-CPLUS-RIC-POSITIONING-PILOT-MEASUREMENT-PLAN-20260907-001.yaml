glossary:
  RIC_side_pilot: pilot interview where evidence comes from the provider/RIC side and cannot substitute for direct client evidence
  client_side_pilot: pilot interview with a real client-side participant after participant resolution and authority
  unaided: participant answer captured before showing candidate positioning wording
  aided: participant reaction after candidate positioning wording is shown
  valid_episode: concrete episode meeting the core validity rule
  representation: section/table/form/schema inside a process-owned information product, not an independent durable semantic product
