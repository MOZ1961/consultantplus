responsibilities_and_authorities:
  owner:
    responsibilities: [choose whether to answer pilot questions, authorize external client-side contact if later needed, accept or reject pilot findings]
    authority: owner only
  interviewer:
    responsibilities: [ask neutral questions, preserve ordering, avoid selling candidate territories before unaided section]
    authority: no authority to adopt positioning or make external commitments
  analyst:
    responsibilities: [code only supported content, preserve not_established, identify instrument defects]
    authority: no authority to promote pilot observations to market facts or requirements automatically
  participant:
    responsibilities: [describe own concrete episode and own interpretation]
    authority: statements are bounded to participant knowledge and role
participant_interfaces:
  owner_to_interviewer: answers about one concrete RIC-side episode
  interviewer_to_owner: one question at a time followed by explicit reconstruction checks when needed
  future_client_to_interviewer: client-side episode only after a specific participant is defined and contact is authorized
  interviewer_to_register: only de-identified factual/coded fields after a valid episode exists
  register_to_report: cross-episode synthesis only after at least two valid pilot rows or explicit insufficiency disposition
risk_assessment_and_mitigation:
  - {risk: vague continuation request is mistaken for external-contact authority, mitigation: current plan prepares and may run only the owner RIC-side pilot; external client contact remains separate until a recipient is resolved}
  - {risk: current owner role biases RIC-side account, mitigation: classify as RIC-side evidence and never substitute for client evidence}
  - {risk: interviewer leads participant toward PT2/PT3/PT6, mitigation: no territory wording before episode/frame/alternatives/spontaneous-value capture}
  - {risk: generic recollection replaces a concrete episode, mitigation: require identifiable trigger, role, required action, sequence and outcome/status}
  - {risk: participant names confidential client facts, mitigation: ask for de-identified description and omit unnecessary names or privileged details}
  - {risk: analyst invents missing competitors or reasons, mitigation: use not_established and explicit evidence classes}
  - {risk: one pilot is over-generalized, mitigation: pilot result evaluates instrument and hypothesis directions only, not market prevalence}
quality_and_effectiveness_measures:
  quality_criteria:
    - RIC-side episode is valid only with role, trigger, required decision/action, information path and action/status
    - frame and alternatives are participant-provided or explicitly not_established
    - spontaneous value language precedes aided territory reactions
    - CP and RIC contributions remain separate
    - analyst inference is explicitly tagged
    - no market-general claim is produced from pilot evidence
  effectiveness_signals:
    - first participant can answer core episode sequence without material clarification loops
    - unaided category and actual alternatives can be elicited before territory prompts
    - at least one interpretable reaction to PT2/PT3/PT6/PT7 can be linked to the same episode
    - reviewer can reproduce primary coding from the recorded answer set
  stop_conditions:
    - no concrete episode can be established after two clarification attempts
    - participant cannot safely de-identify sensitive facts
    - leading wording materially contaminates unaided answers
    - role boundary makes participant evidence unsuitable for the intended measure
environment_infrastructure_security:
  environment: current owner ChatGPT dialogue plus controlled repository persistence
  infrastructure: ChatGPT interaction, GitHub client repository, exact ArtifactVersion references
  privacy_security:
    - default to de-identified episode description
    - do not request names of client employees or confidential document contents
    - no audio recording in current chat pilot
    - persistent data only after measurement register is created under TM-MEAS
  safety: no legal advice or substantive correctness judgment of participant decisions is part of the interview
training:
  interviewer_orientation:
    - use the common core verbatim enough to preserve construct order, but allow neutral clarification
    - ask one question at a time in pilot mode
    - do not show PT2/PT3/PT6/PT7 until spontaneous value language is captured
    - code facts, judgments, alternatives and inference separately
technical_management_review_reporting:
  before_execution: supporting TECH-VER checks completeness, neutrality, authority boundaries and register/report transition rule
  after_first_episode: reviewer checks valid-episode criteria and prompt contamination
  after_second_episode: reviewer checks cross-role comparability and disposition
  structural_review: external client information-product worker through generic SE operation report
  future_reporting: measurement register after first valid episode; measurement report only after sufficient pilot rows or explicit insufficiency stop
related_plans_and_task_descriptions:
  parent_measurement_plan: ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V2
  positioning_report: ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V3
  standard_product_rule: interview guide, question set, coding table and territory comparison are representations inside this plan, not standalone products
  future_products:
    - TM-MEAS measurement register after actual episode data exist
    - TM-MEAS measurement report after pilot synthesis
    - TECH-BMA business or mission analysis report successor only if evidence materially changes positioning hypotheses
    - TM-DEC decision register only after an actual authorized positioning decision
measurement_needs_and_information_requirements:
  needs:
    - verify whether the interview instrument yields concrete, traceable episode evidence
    - verify whether frame, alternatives and spontaneous value can be elicited without aided contamination
    - verify whether RIC contribution can be separated from product/client contribution
    - identify pilot-level evidence for or against PT2, PT3, PT6 and PT7 without adoption inference
  information_requirements:
    - participant role and context
    - episode trigger and required decision/action
    - information path and actual alternative set
    - frame of reference in participant wording
    - choice criteria and mandatory parity properties
    - candidate differentiators and reason to believe
    - CP/RIC/other contribution separation
    - spontaneous value language
    - aided territory reactions and distinctiveness rationale
measures:
  - {id: PM01, name: episode_validity, operational_definition: role+trigger+decision/action+information_path+action/status all present}
  - {id: PM02, name: frame_elicitation, operational_definition: participant unaided category wording or explicit not_established}
  - {id: PM03, name: actual_alternatives, operational_definition: participant-named used/considered/substitute options or explicit not_established}
  - {id: PM04, name: spontaneous_value_language, operational_definition: participant wording captured before any territory prompt}
  - {id: PM05, name: contribution_separation, operational_definition: distinct CP, RIC, client and other contribution fields}
  - {id: PM06, name: territory_reaction, operational_definition: relevance/believability/distinctiveness rationale for PT2/PT3/PT6/PT7 linked to episode}
  - {id: PM07, name: prompt_contamination, operational_definition: reviewer judgment whether aided content influenced earlier unaided answers}
  - {id: PM08, name: coding_reproducibility, operational_definition: second-review agreement on role, episode validity, frame, alternatives and contribution codes}
interview_protocol:
  order_rule: do not show candidate territories before steps Q01-Q12 are complete
  common_core:
    - {id: Q01, prompt: 'В какой роли вы были в этом конкретном случае: руководитель/собственник, руководитель функции, специалист, сотрудник РИЦ или другая роль?'}
    - {id: Q02, prompt: 'Вспомните один недавний конкретный рабочий случай. Что именно произошло и что запустило необходимость что-то решать или делать?'}
    - {id: Q03, prompt: 'Какое именно решение или действие требовалось и к какому сроку, если срок был существенен?'}
    - {id: Q04, prompt: 'Какой результат считался приемлемым и что могло пойти не так — только в пределах того, что вы реально знали тогда?'}
    - {id: Q05, prompt: 'Какую информацию или основания искали и где, в какой последовательности?'}
    - {id: Q06, prompt: 'Как вы сами называете класс инструмента или помощи, который был нужен в этой ситуации?'}
    - {id: Q07, prompt: 'Что еще реально использовали, рассматривали или использовали бы вместо КонсультантПлюс либо вместе с ним?'}
    - {id: Q08, prompt: 'По каким признакам понимали, что источник или инструмент достаточно хорош для этого случая?'}
    - {id: Q09, prompt: 'Какие свойства здесь обязательны для любого приемлемого варианта?'}
    - {id: Q10, prompt: 'Что в КонсультантПлюс в этом случае реально отличалось или было особенно полезно и из чего вы это заключили?'}
    - {id: Q11, prompt: 'Что конкретно дал сам КонсультантПлюс, что отдельно дал РИЦ, а что обеспечили вы или другие источники?'}
    - {id: Q12, prompt: 'Если объяснить коллеге одним предложением, в чем была ценность КонсультантПлюс и отдельно РИЦ в этом случае?'}
  aided_module:
    - {id: Q13_PT2, prompt: 'Насколько к этому случаю подходит смысл «понять, что это значит и что делать»? Что подходит и что нет?'}
    - {id: Q14_PT3, prompt: 'Насколько подходит смысл «иметь актуальную и проверяемую основу профессионального решения»? Что подходит и что нет?'}
    - {id: Q15_PT6, prompt: 'Насколько подходит смысл «КонсультантПлюс дает информационную основу, РИЦ помогает применять ее в рабочих сценариях»? Где проходит граница вклада каждого?'}
    - {id: Q16_PT7, prompt: 'Насколько достаточно обычного объяснения через полную и актуальную правовую базу, аналитику и профессиональные инструменты? Чего в нем не хватает или что лишнее?'}
    - {id: Q17, prompt: 'Какое из этих объяснений, если какое-то, действительно отличает решение от ваших реальных альтернатив? Почему?'}
    - {id: Q18, prompt: 'Какое обещание КонсультантПлюс или РИЦ в этом случае было бы неправдоподобным или слишком сильным?'}
episode_record_schema:
  future_register_row_fields:
    - episode_id
    - participant_type
    - participant_role
    - organization_context_code
    - trigger
    - required_decision_or_action
    - expected_result
    - known_consequence
    - information_path
    - frame_unaided
    - actual_alternatives
    - choice_criteria
    - parity_properties
    - difference_candidates
    - reasons_to_believe
    - consultantplus_contribution
    - RIC_contribution
    - other_contributions
    - action_or_status
    - spontaneous_value_language
    - PT2_reaction
    - PT3_reaction
    - PT6_reaction
    - PT7_reaction
    - distinctiveness_rationale
    - evidence_classes
    - analyst_inferences
    - unresolved
  validity_rule: core episode is valid only when participant_role, trigger, required_decision_or_action, information_path and action_or_status are concrete
  persistence_rule: schema is a view inside this Plan; rows are not persisted until actual participant data exist and a canonical measurement register is created
data_collection_and_storage:
  collection_method: one-question-at-a-time interview with immediate neutral clarification only when required for validity
  storage_method: no permanent episode row before actual data; after first valid episode create TM-MEAS measurement register with de-identified row
  temporary_state: conversation context only until canonical register persistence is authorized by existence of real data
  identifiers: coded participant and organization identifiers; unnecessary names are excluded
analysis_interpretation_reporting:
  analysis_method:
    - assess pilot instrument usability before evaluating territory support
    - preserve participant wording and analyst normalization separately
    - evaluate each territory only against the same concrete episode and participant-stated alternatives
    - treat RIC-side account as provider-side evidence only
  interpretation_rules:
    - pilot can reveal method defects and hypothesis directions but not market prevalence
    - one participant preference is not positioning adoption evidence
    - not_established is a valid result
    - unsupported causal, financial, legal or market-general claims are excluded
  reporting_method: after actual data, register each episode first; then issue a pilot measurement report if at least two valid rows or an explicit insufficiency stop exists
responsibilities_resources_tools_schedule:
  responsibilities: owner/interviewer/analyst/future participant as defined above
  resources: current dialogue, participant time, repository, exact upstream ArtifactVersions
  tools: ChatGPT interaction and GitHub persistence
  schedule: subject TECH-VER -> RIC-side pilot -> reviewer check -> participant resolution -> client-side pilot -> disposition
measurement_process_evaluation:
  after_RIC_side_pilot:
    - check question clarity and number of clarification loops
    - check whether Q06-Q07 are genuinely unaided
    - check whether Q12 captures value language before candidate territories
    - check whether CP/RIC contribution can be separated
    - check whether episode can be coded without inventing missing information
  after_two_pilots:
    - compare validity and coding difficulty across RIC-side and client-side evidence
    - identify leading, duplicate or ambiguous prompts
    - decide instrument_ok, revise_before_main_wave or stop_due_to_invalid_measurement
change_procedure_and_history:
  procedure: any material change to question order, measure definition, validity rule, privacy rule or territory set requires a successor ArtifactVersion and renewed TECH-VER
  history: V1 narrows the broader first-wave plan into an execution-ready two-participant pilot while keeping all interview/coding views inside the standard Plan
completion_process:
  plan_completion: complete after structural worker PASS and supporting TECH-VER PASS_WITH_LIMITATIONS or stronger
  pilot_completion: two valid pilot episodes or explicit insufficiency/stop disposition plus reviewer checks
  next_outputs: measurement register after first valid episode; measurement report after pilot synthesis
  blocked_until_data: measurement register, measurement report and BMA evidence update cannot be fabricated before participant answers
