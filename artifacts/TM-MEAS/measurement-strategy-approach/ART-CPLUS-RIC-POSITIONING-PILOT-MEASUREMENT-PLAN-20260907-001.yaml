introduction:
  purpose: >-
    проверить на двух реальных ролях, что порядок episode-first → unaided frame/alternatives/value → aided territory test
    дает пригодные данные без наведения на заранее выбранное позиционирование
  audience: [owner, interviewer, analyst, future client-side participant, subsequent TM-MEAS measurement register, subsequent TM-MEAS measurement report]
  coverage: [RIC-side pilot, client-side pilot, episode validity, neutrality, coding reproducibility, privacy, stop rules, handoff to future register/report]
  nonpurpose:
    - не принимать официальное позиционирование
    - не утверждать универсальный набор конкурентов
    - не доказывать ROI, предотвращенные штрафы, общее снижение риска или общую эффективность
    - не выдавать ответы РИЦ за ответы клиента
    - не создавать measurement register до фактического появления измерительных данных
planned_activities_and_tasks:
  - провести первый RIC-side пилот в текущем диалоге только после явного ответа участника на вопросы эпизода
  - определить роль участника и один конкретный недавний эпизод до показа кандидатных территорий
  - зафиксировать unaided frame of reference, реальные альтернативы и спонтанный язык ценности
  - после unaided части проверить реакции на PT2, PT3, PT6 и контрольную PT7
  - проверить различимость вклада КонсультантПлюс, РИЦ, клиента и иных источников
  - после первого эпизода выполнить reviewer check на нейтральность, полноту и необходимость корректировки инструмента
  - только после определения конкретного client-side участника провести второй пилот тем же общим ядром
  - не создавать постоянные episode rows до появления фактических ответов; после первого валидного эпизода открыть TM-MEAS measurement register
  - после двух пилотных эпизодов принять одно из решений: instrument_ok, revise_before_main_wave, stop_due_to_invalid_measurement
  - не создавать TM-DEC decision register, пока нет фактического решения уполномоченного лица о позиционировании
tools_methods_techniques:
  method: semi-structured critical-episode interview with unaided-before-aided positioning test
  techniques:
    - chronological episode reconstruction
    - one-question-at-a-time interaction for the pilot
    - separate participant wording from analyst coding
    - explicit not_established instead of analyst completion
    - actual-alternative elicitation before candidate territory prompts
    - contribution separation for ConsultantPlus, RIC, client and other sources
    - evidence-class tagging
    - post-episode reviewer check for leading wording and coding drift
  tools:
    - current ChatGPT conversation as interview channel for the RIC-side pilot
    - structured fields defined inside this plan
    - repository-backed TM-MEAS measurement register only after actual episode data exist
schedule:
  sequencing:
    - {stage: subject_TECH_VER, status: required_before_claiming_pilot_readiness}
    - {stage: RIC_side_pilot, status: may_start_in_current_dialogue_after_owner_answer}
    - {stage: reviewer_check_1, status: after_first_valid_episode}
    - {stage: client_side_participant_resolution, status: unresolved}
    - {stage: client_side_pilot, status: blocked_until_real_participant_is_defined}
    - {stage: reviewer_check_2, status: after_second_valid_episode}
    - {stage: disposition, status: choose_instrument_ok_or_revision_or_stop}
  dates: not_established
budget_and_cost_estimate:
  state: no_external_cost_committed
  estimate: current RIC-side chat pilot requires no new external spend; client-side incentives/travel/other costs are not authorized or assumed
resources_and_allocation:
  owner_participant: may provide one RIC-side episode in current dialogue and retains pilot/acceptance authority
  interviewer: ChatGPT engineering actor under this plan
  analyst: ChatGPT engineering actor with evidence-class separation
  future_client_participant: unresolved_not_selected
