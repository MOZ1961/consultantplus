    - {id: SRC-CPLUS-HISTORY, url: 'https://www.consultant.ru/about/company/history/system/', authority: official_ConsultantPlus_site, retrieved: '2026-09-05', external_exact_version: unavailable_web_page_not_content_addressed}
  target_endpoints:
    - {id: TGT-PROBLEM, artifact_version_id: ARTVER-CPLUS-BMA-PROBLEM-OPPORTUNITY-20260904-001-V2, path: artifacts/TECH-BMA/problem-or-opportunity-statement/ART-CPLUS-BMA-PROBLEM-OPPORTUNITY-20260904-001.yaml}
    - {id: TGT-ALTS, artifact_version_id: ARTVER-CPLUS-BMA-ALTERNATIVE-SOLUTION-CLASSES-20260904-001-V2, path: artifacts/TECH-BMA/alternative-solution-classes/ART-CPLUS-BMA-ALTERNATIVE-SOLUTION-CLASSES-20260904-001.yaml}
    - {id: TGT-CONCEPT, artifact_version_id: ARTVER-CPLUS-BMA-LIFE-CYCLE-CONCEPTS-20260904-001-V1, path: artifacts/TECH-BMA/life-cycle-concepts/ART-CPLUS-BMA-LIFE-CYCLE-CONCEPTS-20260904-001.yaml}
  relations:
    - id: TR-CPLUS-001
      source: SRC-CPLUS-STRUCTURE
      target: TGT-PROBLEM
      target_fields: [context_and_assumptions.official_mission, body.evaluated_need_or_opportunity.sourced_current_situation]
      relation_type: directly_supports
      semantics: mission, central/RIC responsibilities, service network and user classes
      status: active_source_trace
      rationale: source explicitly states these public operating-model facts
      impact_relevance: changes to source wording require re-check of mission/roles assertions
    - id: TR-CPLUS-002
      source: SRC-CPLUS-ABOUT
      target: TGT-PROBLEM
      target_fields: [body.proposed_system_and_intended_use, body.evaluated_need_or_opportunity.sourced_current_situation]
      relation_type: directly_supports
      semantics: developer/product content, delivery variants, individualized rights/cost basis
      status: active_source_trace
      rationale: source explicitly describes product and delivery forms
      impact_relevance: changes can affect system boundary and delivery constraints
    - id: TR-CPLUS-003
      source: SRC-CPLUS-PURCHASE
      target: TGT-PROBLEM
      target_fields: [body.evaluated_need_or_opportunity.sourced_current_situation, body.technical_strategic_economic_market_basis]
      relation_type: directly_supports
      semantics: several automatic updates per day, mobile/online access, package/user pricing parameters
      status: active_source_trace
      rationale: current purchase page describes these product characteristics
      impact_relevance: changes affect current-state operational characteristics
    - id: TR-CPLUS-004
      source: SRC-CPLUS-HISTORY
      target: TGT-PROBLEM
      target_fields: [body.evaluated_need_or_opportunity.sourced_current_situation, body.improvements_deficiencies_constraints_alternatives.confirmed_improvement_activity]
      relation_type: directly_supports
      semantics: ongoing product evolution and 2026 AI/digital features
      status: active_source_trace
      rationale: official product history records releases/features
      impact_relevance: supports only evolution/current capability, not preferred future strategy
    - id: TR-CPLUS-005
      source: [SRC-CPLUS-STRUCTURE, SRC-CPLUS-ABOUT, SRC-CPLUS-PURCHASE, SRC-CPLUS-HISTORY]
      target: TGT-ALTS
      target_fields: [body.current_solution_class, body.candidate_classes]
      relation_type: bounded_analytical_derivation
      semantics: sources establish current characteristics; candidate classes are analyst-created hypotheses, not source assertions
      status: active_inference_trace
      rationale: each candidate records supporting observation and explicit non-selection status
      impact_relevance: internal objectives/metrics may invalidate or reprioritize candidates
    - id: TR-CPLUS-006
      source: [SRC-CPLUS-STRUCTURE, SRC-CPLUS-RIC, SRC-CPLUS-ABOUT, SRC-CPLUS-PURCHASE, SRC-CPLUS-HISTORY]
      target: TGT-CONCEPT
      target_fields: [body.operation_from_user_perspective, body.interfaces_and_impacts, body.cost_criticality_feasibility, body.scenarios_and_context_of_use, body.current_future_comparison]
      relation_type: directly_supports_current_state_plus_explicit_gap_analysis
      semantics: current operation/use is source-backed; future state and internal interfaces remain unresolved
      status: active_source_trace
      rationale: exact future target is not inferred from current public evidence
      impact_relevance: source or internal-evidence changes require concept revision
  limitations:
    - external web sources are referenced by URL/retrieval date rather than content-addressed immutable snapshots
    - direct public evidence does not establish internal targets, KPIs, economics, service-quality variance or future architecture
    - semantic verification is separate from structural field coverage
