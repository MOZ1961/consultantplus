body:
  operation_from_user_perspective:
    mission_context: broad dissemination of legal information among the population of Russia
    supported_user_classes: [бухгалтеры, юристы, аудиторы, финансовые специалисты, руководители организаций, ученые, преподаватели, студенты, школьники]
    user_value_mechanism_supported_by_sources:
      - receive access to selected legal-information banks, judicial practice, analytical materials, consultations and commentary
      - use local, network or remote-internet delivery variants according to package/usage parameters
      - receive automatic information updates; official purchase page states several updates per day
      - receive service support through RICs and partners; available public service model includes consultation/training/technical-support routes
      - use online/mobile access where applicable; 2026 product history confirms continuing development of digital and AI-assisted functions
    user_need_boundary: published user classes and product/service capabilities are facts; specific prioritized stakeholder needs are not public and require TECH-STK
  interfaces_and_impacts:
    public_interfaces:
      - relation: Coordination_Center_to_RICs_and_partners
        source_supported_semantics: strategy, network management/interaction, product technology/content and service-quality standard on the central side; delivery/support and regional-content work on the regional side
      - relation: RICs_and_partners_to_users
        source_supported_semantics: supply, service support, maintenance/contact for product and service conditions
      - relation: ConsultantPlus_system_to_users
        source_supported_semantics: legal-information access/search/use through multiple delivery variants and continuing updates
    organizational_impacts_of_current_model:
      - central and regional responsibilities are interdependent in delivering the end-user service
      - changes to product technology/content can have downstream implications for regional delivery/support, but internal release/change mechanisms are not public
    interfaces_not_publicly_resolved: [internal technical APIs/data exchange, contractual governance between central and regional organizations, operational SLAs, internal content-production workflow, detailed identity/access architecture]
  cost_criticality_feasibility:
    cost:
      sourced_fact: product package/right-to-use cost is determined individually and depends on package/user parameters
      internal_economics: unknown
    criticality:
      status: analyst_inference_not_owner_accepted
      interpretation: currentness, reliable access and service continuity are plausibly important to legal-information work, but no formal criticality class is publicly established
    feasibility:
      current_state: demonstrated by actual published operation of network/product/service channels
      future_change: cannot be assessed without internal resources, architecture, costs, constraints and target outcomes
  scenarios_and_context_of_use:
    - id: SC-CPLUS-01
      name: select_and_receive_solution
      source_support: official_about_purchase_RIC_pages
      flow: user/organization defines specialist/user/package needs -> contacts ConsultantPlus/RIC -> receives individually selected package and delivery/access form
    - id: SC-CPLUS-02
      name: perform_legal_information_work
      source_support: official_about_purchase_pages
      flow: user searches/reads legal and judicial materials and uses analytical/practical materials; system content is updated during operation
    - id: SC-CPLUS-03
      name: receive_service_support
      source_support: official_structure_RIC_pages
      flow: user interacts with RIC/partner for support, maintenance, consultation and other service routes
    - id: SC-CPLUS-04
      name: work_online_or_mobile
      source_support: official_purchase_and_history_pages
      flow: eligible user accesses online package and/or mobile application; current product history shows continuing evolution of online/mobile/AI-assisted functions
  current_future_comparison:
    current_state: published distributed network and multi-variant legal-information service described above
    future_state: unresolved_no_owner_accepted_target_concept
    candidate_change_space_ref: ARTVER-CPLUS-BMA-ALTERNATIVE-SOLUTION-CLASSES-20260904-001-V2
    known_change_problem: no specific business problem is established by public sources
    assumptions:
      - official public pages are sufficient to describe visible roles/capabilities but not internal process performance
      - no source-backed evidence is available here for target architecture or reallocation of central/regional authority
    constraints:
      - preserve distinction between official facts and analyst inference
      - do not derive stakeholder/system requirements before owner-backed need/problem evidence
summary: >-
  Текущая концепция использования может быть описана достаточно уверенно: распределенная Сеть объединяет центральную
  разработку/контент/стратегию и региональную поставку/сервис; пользователи получают правовую информацию через несколько
  вариантов доступа с регулярным обновлением и сервисной поддержкой. Целевое будущее состояние из открытых источников не следует.
