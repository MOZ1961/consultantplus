artifact_instance_purpose: >-
  Описать полный связанный жизненный цикл продукта «Диагностика клиентского случая РИЦ» одновременно
  в двух контурах: как продукта, производимого SE-средой для клиентской системы, и как приобретаемого,
  принимаемого, используемого, изменяемого и выводимого из применения продукта конкретного РИЦ.
  Разделить уже достигнутые состояния, планируемые переходы и переходы, заблокированные отсутствием
  конкретного РИЦ, получателя, реального эпизода или решения клиента.
