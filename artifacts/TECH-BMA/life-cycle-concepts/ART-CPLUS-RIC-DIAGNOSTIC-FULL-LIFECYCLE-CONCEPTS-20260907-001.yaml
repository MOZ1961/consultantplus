  Описать интегрированный жизненный цикл продукта «Диагностика клиентского случая РИЦ» так, чтобы в одном
  управляемом контуре были связаны клиенты РИЦ, сам РИЦ, Сеть КонсультантПлюс/Координационный центр и
  SE-среда, при этом организационные заинтересованные стороны не смешивались с обеспечивающей инженерной
  системой, а их полномочия, решения, свидетельства и переходы жизненного цикла оставались раздельными.
