objectives_scope_applicability:
  objectives:
    - connect the client engineering contour before client product persistence
    - establish only source-supported BMA state available from official public sources
    - preserve explicit unknowns instead of filling them by model inference
  applicability: current owner request and public ConsultantPlus operating/product evidence
  excluded: internal financials, nonpublic governance/contracts, detailed architecture, acceptance of change, deployment or baseline
selected_approach_methods_decision_rules:
  source_priority: current official consultant.ru pages; other sources may supplement only if provenance and authority are explicit
  statement_classes: [source_supported_fact, analyst_inference_candidate, unresolved_internal_information]
  decision_rules:
    - do not promote official self-characterization such as market leadership into independent market fact
    - do not infer a business problem from ordinary product evolution or existence of a distributed network
    - do not select an alternative without owner-backed objectives, comparison criteria, internal evidence and decision authority
    - do not derive accepted stakeholder/system requirements until the need/problem/opportunity is sufficiently established
    - preserve exact source URL/retrieval date and exact target ArtifactVersion traceability
roles_resources_enabling_conditions:
  owner: acceptance and business-decision authority
  engineering_actor: source review, classification, product construction and gap registration
  generic_SE_environment: provides interface, canonical process/output contracts, normative composition controls and workers
  client_repository: MOZ1961/consultantplus is client authority surface
criteria_measures_tailoring_change_control:
  quality_criteria: [official-source traceability, fact/inference separation, canonical ProcessType/O ownership, explicit unresolved fields]
  readiness_criteria: internal evidence required for problem acceptance, alternative selection and requirements derivation
  tailoring: no market-wide independent benchmarking was requested; public official-source evidence is sufficient only for current-state context
  change_control: material new internal evidence or generic interface change requires new exact ArtifactVersion and, where applicable, TM-CM rebind
error_and_problem_resolution:
  - missing public evidence -> record unresolved_not_publicly_supported rather than guess
  - conflicting sources -> preserve both with provenance and defer reconciliation to TECH-VER/owner evidence
  - inferred change idea -> classify as analyst_inference_candidate and prohibit selection
  - client/generic ownership ambiguity -> client lifecycle product remains in MOZ1961/consultantplus; generic contract remains in MOZ1961/se
glossary:
  source_supported_fact: statement directly supportable by identified official source
  analyst_inference_candidate: bounded analytic proposition requiring later evidence/decision
  readiness_criterion: condition for making a later decision; not a claim that the condition is currently met
change_history:
