glossary:
  benefit_claim: ограниченное проверяемое утверждение о пользе продукта
  evidence_ladder: уровни силы доказательств от design-only до повторных наблюдений
  decision_use: фактическое использование результата для конкретного решения, включая обоснованное no-action
  post_decision_observation: наблюдение после решения, пригодное для сопоставления с заранее определенной базой/критерием
  self_validating_metric: показатель, который объявляет продукт полезным только потому, что продукт/отчет был создан
  insufficient_evidence: требуемые данные отсутствуют/неполны/несопоставимы; это не равно supported или not_supported
