  current_dialogue_branch_purpose: 'для продукта «Диагностика клиентского случая РИЦ» пройти полный жизненный цикл как продукта SE-среды и как продукта клиентской системы «Сеть КонсультантПлюс»: декомпозировать ЖЦ, определить метрики и критерии переходов и на их основе получить проверяемые доказательства того, в какой мере продукт полезен РИЦ, создает клиентскую ценность и приводит к наблюдаемым результатам, включая границы и случаи неподтверждения этих утверждений; свести каждый результат к каноническому ProcessType/O и стандартному информационному продукту с полным применимым составом по ГОСТ Р 58609, персистировать результаты и проверки до фактических блокеров.'
  exact_owner_input: 'смерджи все пр в кплюс и продолжай'
  current_client_main_before_this_product: 858b3c5afff5edd91e5592b917c939045e239c3a
