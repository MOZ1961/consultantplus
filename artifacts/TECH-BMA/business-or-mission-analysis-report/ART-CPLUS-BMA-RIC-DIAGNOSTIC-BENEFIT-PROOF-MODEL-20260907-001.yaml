glossary:
  benefit_claim: ограниченное проверяемое утверждение о пользе продукта
  evidence_ladder: уровни силы доказательств от design-only до реального decision-use и повторных наблюдений
  RIC_decision_use: фактическое использование/отклонение/недостаточность результата для конкретного решения РИЦ
  Network_decision_use: фактическое C16 использование/отклонение/дублирование/недостаточность сигнала уполномоченным участником Сети в конкретном решении
  post_decision_observation: наблюдение после решения, пригодное для сопоставления с заранее определенной базой или критерием
  self_validating_metric: показатель, который объявляет продукт полезным только потому, что продукт или отчет был создан
  insufficient_evidence: требуемые данные отсутствуют, неполны или несопоставимы; это не равно supported или not_supported
