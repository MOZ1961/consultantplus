  Превратить цель «доказать полезность через метрики» в фальсифицируемую доказательную модель продукта
  «Диагностика клиентского случая РИЦ»: связать каждое существенное утверждение о пользе с уже установленными
  S/C/G-метриками, требуемым уровнем реального доказательства, допустимыми отрицательными исходами и
  переходом к TECH-VAL, не считая создание отчета или прохождение структурного worker доказательством пользы.
