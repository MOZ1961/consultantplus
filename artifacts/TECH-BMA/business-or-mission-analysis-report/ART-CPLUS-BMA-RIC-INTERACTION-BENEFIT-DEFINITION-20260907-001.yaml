glossary:
  terminal_result: latest observable result of one interaction cycle that is not merely an intermediate analytical artifact
  terminal_benefit: stakeholder-useful effect demonstrated in the intended RIC context, not inferred from artifact creation
  decision_use: recorded use of the analytical result to make, retain or defer a concrete RIC service decision
  observed_effect: post-decision evidence collected under the defined measurement approach; may be positive, neutral or adverse
  R0_R4: staged evidence states separating product creation from verified, accepted, used and validated benefit
change_history:
