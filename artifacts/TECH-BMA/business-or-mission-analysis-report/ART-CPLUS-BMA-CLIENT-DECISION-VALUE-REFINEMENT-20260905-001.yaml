  methodic_instance: {methodic_id: METH-TECH-BMA-DECISION-VALUE-REFINEMENT, methodic_version_id: METHVER-CPLUS-TECH-BMA-DECISION-VALUE-REFINEMENT-V1, methodic_version: runtime-provisional-v1, status: provisional_runtime_not_adopted}
