artifact_instance_purpose: >-
  Сохранить синтаксически корректную и нормативно полную версию уточненной кандидатной модели смысла
  КонсультантПлюс через решения клиента: разделить клиентские решения C1-C6 и ответные решения поставщика P1-P2,
  сохранить доказательную границу и подготовить модель к проверке реальными эпизодами.
