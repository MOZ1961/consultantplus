artifact_instance_purpose: >-
  Сохранить уточненную кандидатную модель смысла КонсультантПлюс через решения клиента и устранить
  структурный YAML-разрыв V1 без изменения исследовательской гипотезы: клиентские решения C1-C6
  отделены от ответных решений РИЦ/Сети P1-P2, а наблюдаемые результаты ограничены уровнем эпизода.
