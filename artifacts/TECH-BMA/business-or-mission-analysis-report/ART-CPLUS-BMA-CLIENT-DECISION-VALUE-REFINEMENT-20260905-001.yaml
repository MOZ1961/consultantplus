glossary:
  client_decision: решение участника клиентской организации в конкретном рабочем контексте
  provider_response: решение РИЦ или Сети о способе ответа на выявленную клиентскую ситуацию или разрыв
  decision_episode: конкретный случай от триггера до действия или позиции и ее основания
  organizational_meta_capability: способность организации повторяемо поддерживать класс решений
  observable_result_boundary: граница результатов фиксируемых без недоказанной финансовой атрибуции
