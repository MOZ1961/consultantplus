glossary:
  candidate_delivery_product: participant-facing engineering result inside this BMA report; not a new canonical lifecycle output and not an official ConsultantPlus product name
  reciprocal_offer: engagement in which participant evidence is exchanged for a concrete useful engineering result
  decision_episode: recent identifiable situation with trigger, decision, evidence path, action/status and product/service contribution
  provider_response: P1/P2 supplier-side action or decision responding to client evidence, distinct from C1-C6 client decisions
  evidence_class: explicit classification distinguishing participant report, participant judgment, RIC account, analyst inference and not-established state
  data_minimization: collect only information needed for the stated participant result and evidence question
change_history:
  - {version: V1, date: '2026-09-05', change: initial participant offer, product/service and information-exchange model}
subject_unresolved:
  - participant willingness to exchange information for the proposed outputs
  - which candidate products participants actually value
  - actual internal RIC and Network service/product boundaries
  - pricing and economic value of any future packaged service
  - owner authority for external contact and any commercial positioning
owner_product_request:
  exact_visible_text: 'сделай соотв. предложения от нашей среды участникам. какие продукты и услуги. какая инфа мб нужна от них'
  request_specific_requirements:
    - provide participant-specific proposals from the engineering environment
    - identify candidate products and services for each participant group
    - identify information that may be needed from each group
    - distinguish minimum, useful and optional-sensitive information
    - preserve the difference between candidate engineering offer and official ConsultantPlus/RIC commercial offer
    - do not infer stakeholder requirements or external-contact authority
