artifact_instance_purpose: >-
  Сформировать кандидатные предложения инженерной среды для участников модели клиентской ценности КонсультантПлюс:
  какие результаты и услуги среда может вернуть каждому участнику, какую информацию имеет смысл получить от него,
  какой минимальный обмен достаточен для старта и какие данные не следует запрашивать без отдельной необходимости.
