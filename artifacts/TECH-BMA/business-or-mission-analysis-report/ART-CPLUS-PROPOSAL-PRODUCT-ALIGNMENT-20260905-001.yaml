    - {id: S02, service_ru: Диагностика решений роли или подразделения, executing_processes: [TM-MEAS, TECH-BMA, TECH-VER, TECH-OP], durable_products: ['TM-MEAS → measurement register','TM-MEAS → measurement report','TECH-BMA → business or mission analysis report','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S03, service_ru: Диагностика покрытия КонсультантПлюс и сервисом РИЦ, executing_processes: [TM-MEAS, TECH-BMA, TECH-VER, TECH-OP], durable_products: ['TM-MEAS → measurement report','TECH-BMA → business or mission analysis report','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S04, service_ru: Проектирование сценарного обучения и сопровождения, executing_processes: [TECH-BMA, TECH-IMP, OPE-HR, TECH-VER, TECH-OP], durable_products: ['TECH-BMA → life cycle concepts','TECH-IMP → training materials when produced','OPE-HR → training documentation when produced','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S05, service_ru: Проектирование организационного контура повторяемых решений, executing_processes: [TECH-BMA, TECH-STK, TECH-VER, TECH-OP], durable_products: ['TECH-BMA → business or mission analysis report','TECH-STK → stakeholder needs and requirements when warranted by evidence','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S06, service_ru: Измерение и сбор доказательств ценности, executing_processes: [TM-MEAS, TECH-VER, TECH-OP], durable_products: ['TM-MEAS → measurement register','TM-MEAS → measurement report','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S07, service_ru: Синтез обратной связи для РИЦ и Сети, executing_processes: [TM-MEAS, TECH-BMA, TECH-VER, TECH-OP], durable_products: ['TM-MEAS → measurement report','TECH-BMA → business or mission analysis report','TECH-VER → verification report','TECH-OP → operation report']}
    - {id: S08, service_ru: Разбор ограничений доступа и эксплуатации, executing_processes: [TECH-BMA, TECH-STK, TECH-SYSREQ, TECH-VER, TECH-OP], durable_products: ['TECH-BMA → business or mission analysis report','TECH-STK → stakeholder needs and requirements when evidenced','TECH-SYSREQ → system requirements when allocated to the system','TECH-VER → verification report','TECH-OP → operation report']}
