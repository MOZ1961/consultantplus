artifact_instance_purpose: >-
  Продолжить кандидатное позиционирование КонсультантПлюс для РИЦ не как одну decision-centric формулу,
  а как проверяемую сравнительную модель: определить факторы, от которых зависит позиционирование,
  явно понизить C1-C6 до одной кодировочной оси, сформировать альтернативные территории позиционирования,
  связать каждую с целевыми ролями, конкурентной рамкой, точками паритета и различия, доказательствами,
  ролью РИЦ и рисками обещания и подготовить решение для последующей эмпирической проверки.
