scope: >-
  Позиционирование КонсультантПлюс в работе РИЦ: сегменты и роли, конкретные эпизоды и решения,
  конкурентная категория и фактические альтернативы, точки паритета и различия, причины доверия,
  вклад СПС и РИЦ, доказательные границы, семь кандидатных территорий и приоритеты их проверки.
issuing_organization: owner-authorized MOZ1961/consultantplus client engineering environment
participants: [owner, ChatGPT engineering actor]
summary: >-
  V3 исправляет методический перекос V2: C1-C6 сохраняются как полезная классификация решений клиента,
  но больше не трактуются как достаточная модель позиционирования. Позиционирование зависит как минимум
  от сегмента и роли в организационном выборе, конкретной рабочей ситуации, конкурентной рамки, реально
  используемых альтернатив, необходимых точек паритета, доказуемых точек различия, reason to believe,
  текущих ассоциаций бренда и отдельного вклада РИЦ. Сформированы семь альтернативных территорий.
  На desk-analysis уровне наиболее содержательно подготовлены к проверке три: «От информации к действию»,
  «Основание профессионального решения» и «КонсультантПлюс + РИЦ как система применения»; это не выбор
  победителя и не официальное позиционирование. Эмпирические альтернативы клиента, относительная сила
  формулировок и принятие рынком остаются не установленными.
introduction:
  evaluated_object: способ позиционирования КонсультантПлюс в работе РИЦ относительно клиентских ролей, задач и альтернатив
  evaluation_context: >-
    successor V3 after owner challenged the sufficiency of C1-C6 and requested alternative positioning plus method/source grounding;
    current request requires every durable result to resolve to standard products with ГОСТ composition
  criteria_basis:
    - позиционирование должно иметь установленную конкурентную рамку или явный разрыв по ней
    - целевая аудитория и роль в организационном выборе должны быть отделены от типа решения C1-C6
    - точки паритета и точки различия должны описываться раздельно
    - отличие должно быть релевантным целевой роли и иметь reason to believe
    - реальные альтернативы клиента нельзя подменять заранее выбранным списком конкурентов
    - вклад КонсультантПлюс и вклад РИЦ должны кодироваться раздельно
    - сильное обещание не может быть сильнее доказательной базы
    - единое ядро может иметь ролевые сообщения, но их совместимость должна проверяться
  purpose: дать РИЦ управляемый набор альтернатив позиционирования и точную схему их проверки без преждевременного принятия
  audience: [руководители РИЦ, клиентские менеджеры РИЦ, специалисты сопровождения и обучения, участники продуктовой обратной связи Сети]
  nonpurpose: [не утверждает официальное рыночное позиционирование, не является рекламным скриптом, не устанавливает цены, не доказывает ROI, не объявляет превосходство над ненаблюдавшимися альтернативами]
context_and_assumptions:
  predecessor_model_state:
    positioning_report: ARTVER-CPLUS-BMA-RIC-POSITIONING-20260906-001-V2
    client_decisions: [C1, C2, C3, C4, C5, C6]
    provider_responses: [P1, P2]
    evidence_state: candidate_model_pending_direct_client_and_RIC_episodes
  C1_C6_disposition:
    status: retained_as_one_research_coding_dimension_not_complete_positioning_model
    meaning: >-
      C1-C6 отвечают на вопрос «какое решение принимается вокруг продукта», но сами по себе не отвечают
      на вопросы «для кого», «в какой ситуации выбора», «по отношению к какой категории и альтернативам»,
      «в чем допустимое отличие» и «почему обещанию следует верить».
  decision_axis:
    individual: [знать, понять, решить]
    organizational_meta_capability: {name: организовать, meaning: сделать критичные решения повторяемыми распределенными по ролям обучаемыми и контролируемыми, status: hypothesis_requires_validation}
  current_observable_result_boundary:
    supported: [решение или действие сформулировано, основание найдено и воспроизводимо, оставшаяся неопределенность зафиксирована, вклад КонсультантПлюс и РИЦ описан раздельно]
    unsupported_attribution: [предотвращенные штрафы или убытки, ROI продукта, общее снижение риска, общий рост эффективности или производительности]
  source_register: ARTVER-CPLUS-RIC-POSITIONING-METHOD-SOURCE-REGISTER-20260907-001-V1
  evidence_limitation: >-
    Реальные клиентские и РИЦ-эпизоды еще не устанавливают частоту и критичность сценариев, фактический
    язык ценности, эмпирический набор альтернатив, относительную привлекательность территорий и причинный
    вклад продукта/сервиса.
body:
  evaluation_method_and_evidence:
    method_name: Positioning evidence synthesis v2
    method_status: provisional_runtime_not_adopted
    method_sequence:
      - {step: M1, action: определить сегмент организации и роль участника, result: target_context}
      - {step: M2, action: реконструировать конкретный недавний эпизод задачи и решения до продуктовых подсказок, result: episode_and_job_context}
      - {step: M3, action: установить категорию или frame of reference, в которой участник воспринимал решение, result: frame_or_explicit_gap}
      - {step: M4, action: зафиксировать фактически рассматривавшиеся или использованные альтернативы, result: empirical_alternative_set_or_not_established}
      - {step: M5, action: определить обязательные точки паритета для легитимного участия в категории, result: points_of_parity}
      - {step: M6, action: сформулировать кандидатные точки различия и проверить их релевантность роли, result: points_of_difference_candidates}
      - {step: M7, action: для каждого отличия установить reason to believe и класс доказательства, result: evidence_bounded_claim}
      - {step: M8, action: раздельно кодировать вклад КонсультантПлюс, РИЦ, клиента и иных источников, result: contribution_map}
      - {step: M9, action: сопоставить территорию с C1-C6 только как дополнительной осью решения, result: decision_level_fit}
      - {step: M10, action: сравнить территории по ролям и эпизодам и сохранить противоречащие случаи, result: comparative_positioning_evidence}
    evidence:
      - {artifact_version_id: ARTVER-CPLUS-RIC-POSITIONING-METHOD-SOURCE-REGISTER-20260907-001-V1, use: positioning method source-to-claim trace}
      - {artifact_version_id: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-MODEL-20260905-001-V1, use: исходное ядро ценности и decision-value chain}
      - {artifact_version_id: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-REFINEMENT-20260905-001-V2, use: C1-C6/P1-P2 и observable-result boundary}
      - {artifact_version_id: ARTVER-CPLUS-BMA-PARTICIPANT-OFFER-INFORMATION-EXCHANGE-20260905-001-V1, use: DB01-DB05/PB01-PB03 role interfaces}
      - {artifact_version_id: ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V1, use: existing episode-based empirical design to be extended}
      - {artifact_version_id: ARTVER-CPLUS-RIC-PILOT-METHOD-SOURCE-REGISTER-20260907-001-V1, use: critical-incident, decision reconstruction, journey and contribution method basis}
  positioning_dependency_model:
    dimensions:
      - {id: D1, name: segment_and_role, question: для какой организации и какого участника организационного выбора}
      - {id: D2, name: episode_and_job, question: в какой конкретной ситуации и для какого требуемого прогресса}
      - {id: D3, name: decision_level, question: какое C1-C6 решение принимается; вспомогательная ось}
      - {id: D4, name: frame_of_reference, question: к какой категории участник относит решение и что считает нормой категории}
      - {id: D5, name: actual_alternatives, question: что участник реально использовал или рассматривал вместо КонсультантПлюс или вместе с ним}
      - {id: D6, name: points_of_parity, question: какие свойства обязательны, чтобы решение вообще считалось приемлемым в категории}
      - {id: D7, name: points_of_difference, question: какое отличие может быть значимым и отличительным}
      - {id: D8, name: reason_to_believe, question: чем подтверждается заявляемое отличие}
      - {id: D9, name: brand_association_and_existing_message, question: с чем КонсультантПлюс уже связывается официально и фактически}
      - {id: D10, name: CP_RIC_contribution, question: что дает СПС и что отдельно делает РИЦ}
      - {id: D11, name: evidence_boundary, question: какие обещания допустимы при текущей силе доказательств}
  findings:
    - {id: F1, result: correction_required, finding: 'C1-C6 полезны для кодирования решений, но недостаточны как полная модель позиционирования.', impact: 'V3 использует C1-C6 только как D3 среди нескольких независимых измерений.'}
    - {id: F2, result: supported_by_method_sources, finding: 'Позиционирование требует конкурентной рамки, точек паритета и точек различия, а не только общего обещания ценности.', impact: 'Каждая территория получает frame/PoP/PoD/reason-to-believe поля.'}
    - {id: F3, result: supported_by_B2B_method_source, finding: 'Для B2B нельзя сводить позиционирование к конечному пользователю: участники организационного выбора могут иметь разные критерии.', impact: 'Ролевые формулировки проверяются отдельно при общем ядре.'}
    - {id: F4, result: official_source_supported_not_customer_validated, finding: 'Официальное описание КонсультантПлюс уже объединяет справочную правовую систему, профессиональные профили, аналитику и язык практического действия.', impact: 'Несколько территорий правдоподобны; официальный источник не выбирает победителя.'}
    - {id: F5, result: evidence_gap, finding: 'Фактическая конкурентная рамка и набор альтернатив клиентов пока не установлены.', impact: 'Нельзя считать интернет-поиск, ИИ, коллег, другие СПС или внутренние базы универсальными конкурентами без эпизодных данных.'}
    - {id: F6, result: analytical_shortlist_not_market_fact, finding: 'На текущем desk-analysis наиболее полезно сравнивать территории «От информации к действию», «Основание профессионального решения» и «КП + РИЦ как система применения».', impact: 'Они переходят в измерительный план как гипотезы, не как принятое позиционирование.'}
    - {id: F7, result: defensive_baseline, finding: 'Территория «полная и актуальная правовая база + аналитика + профессиональный поиск» нужна как контрольная и доказательная база категории.', impact: 'Ее следует измерять наряду с более смысловыми территориями, а не заранее исключать как устаревшую.'}
  positioning_territories:
    - id: PT1
      name: Надежный профессиональный помощник
      candidate_formulation: Надежный помощник специалиста в работе с законодательством.
      primary_roles: [DB04, DB03]
      frame_candidate: профессиональная справочная правовая система
      parity_candidate: [актуальная правовая информация, профессиональный поиск, применимость к рабочим задачам]
      difference_candidate: доверие к привычной профессиональной среде и целостность сопровождения задачи
      reason_to_believe_state: official_provider_messaging_plus_product_capability; client_perception_pending
      strength: близость к существующим ассоциациям и низкая стоимость объяснения
      risk: слабая дифференциация и высокая общность слова помощник
      evidence_need: прямой язык клиента о доверии и сравнении альтернатив
    - id: PT2
      name: От информации к действию
      candidate_formulation: Помогает понять, что изменилось, что это значит и что делать.
      primary_roles: [DB04, DB03]
      frame_candidate: профессиональная среда решения регулируемых рабочих задач
      parity_candidate: [актуальная информация, поиск, аналитические материалы]
      difference_candidate: связанный путь от основания к практическому действию
      reason_to_believe_state: official_action_oriented_materials_plus_decision_model; direct_episode_validation_pending
      strength: конкретная пользовательская ценность и понятная связь с эпизодом
      risk: может сузить образ до реактивной работы с изменениями
      evidence_need: эпизоды, где продукт изменил или ускорил понимание следующего действия без причинной гиперболы
    - id: PT3
      name: Основание профессионального решения
      candidate_formulation: Актуальная и проверяемая основа для профессионального решения.
      primary_roles: [DB04, DB03, DB01]
      frame_candidate: профессиональная информационная среда для обоснования решений
      parity_candidate: [достоверный источник, актуальность, поиск, аналитика]
      difference_candidate: воспроизводимость основания и возможность показать путь к источникам и позиции
      reason_to_believe_state: decision_model_plus_product_source_structure; client_relative_preference_pending
      strength: сильная связь с ответственностью специалиста и руководителя функции
      risk: рациональная и абстрактная формула; различимость относительно других профессиональных источников не доказана
      evidence_need: случаи, где воспроизводимое основание является явным критерием выбора
    - id: PT4
      name: Работа с изменениями
      candidate_formulation: Помогает организации вовремя превращать изменения законодательства в действия.
      primary_roles: [DB03, DB01]
      frame_candidate: мониторинг и применение регуляторных изменений
      parity_candidate: [оперативное обновление, уведомление об изменениях, доступ к нормам]
      difference_candidate: переход от изменения к организованной реакции
      reason_to_believe_state: analytical_candidate; organizational_effect_not_established
      strength: регулярный и потенциально критичный триггер
      risk: не охватывает значимую часть задач, не вызванных изменением нормы
      evidence_need: реальные C3/C4 эпизоды и подтверждение роли КонсультантПлюс в организационной реакции
    - id: PT5
      name: Организационный контур регулируемой работы
      candidate_formulation: Единая информационная основа, чтобы организация одинаково понимала требования и действовала согласованно.
      primary_roles: [DB03, DB01, DB05]
      frame_candidate: организационная инфраструктура регулируемой деятельности
      parity_candidate: [общий доступ к актуальным источникам, управляемость доступа, профессиональные материалы]
      difference_candidate: согласованная общая информационная основа для нескольких ролей
      reason_to_believe_state: hypothesis_only_without_organizational_outcome_evidence
      strength: стратегическая B2B-территория выше уровня отдельного пользователя
      risk: легко обещать больше, чем реально контролируют СПС и РИЦ в процессах клиента
      evidence_need: C3/C4/C6 эпизоды с несколькими ролями и доказательство фактической координационной функции
    - id: PT6
      name: КонсультантПлюс плюс РИЦ как система применения
      candidate_formulation: КонсультантПлюс дает актуальную правовую основу, РИЦ помогает применять возможности системы в реальных рабочих сценариях клиента.
      primary_roles: [DB02, DB03, DB04, PB01, PB02]
      frame_candidate: информационно-сервисное B2B-решение
      parity_candidate: [правовая база, поиск, обновление, поддержка пользователя]
      difference_candidate: связка продукта с локальным сопровождением, настройкой, обучением и диагностикой сценариев
      reason_to_believe_state: provider_response_hypothesis_plus_RIC_service_evidence; client_incremental_value_pending
      strength: использует распределенный сервисный слой РИЦ и связывает продукт с применением
      risk: качество обещания зависит от фактической способности конкретного РИЦ и может размыть ядро бренда
      evidence_need: парные клиентские и РИЦ-эпизоды с раздельной оценкой вкладов
    - id: PT7
      name: Доказательная база категории
      candidate_formulation: Полная и актуальная правовая база, аналитика и профессиональные инструменты для работы с законодательством.
      primary_roles: [DB04, DB03, DB02]
      frame_candidate: справочная правовая система
      parity_candidate: [полнота, актуальность, поиск, профессиональные материалы]
      difference_candidate: specific_relative_difference_not_established
      reason_to_believe_state: strong_provider_product_evidence_for_capabilities; comparative_superiority_not_established
      strength: высокая доказуемость состава возможностей и понятность категории
      risk: feature-centric формула может не выражать конечную ценность и не доказывает превосходство
      evidence_need: критерии покупки/продления и реальные относительные сравнения
  comparative_test_priority:
    priority_hypotheses: [PT2, PT3, PT6]
    control_or_defensive_baseline: PT7
    secondary_hypotheses: [PT1, PT4, PT5]
    priority_basis: >-
      PT2, PT3 и PT6 охватывают соответственно переход к действию, качество основания решения и
      дополнительную сервисную роль РИЦ. Они достаточно различны, чтобы эмпирическое сравнение было
      информативным; PT7 нужен как контрольный вариант категории. Приоритет не является принятием.
  message_architecture:
    layers:
      - {layer: L1, content: category_or_engineering_core, rule: стабильное ядро не должно отрицать официальную категорию без доказательства}
      - {layer: L2, content: role_specific_promise, rule: формулировка зависит от роли и критериев решения}
      - {layer: L3, content: concrete_episode_or_job, rule: сообщение связывается с реальной задачей}
      - {layer: L4, content: parity_difference_reason_to_believe, rule: различие не заявляется без основания}
      - {layer: L5, content: CP_RIC_contribution, rule: вклад продукта и сервиса разделяется}
      - {layer: L6, content: evidence_boundary, rule: нижний слой не может усиливать причинное или финансовое обещание сверх доказательств}
  candidate_positioning_model:
    status: owner_directed_analyst_candidate_not_official_positioning
    category_candidate: {formulation: справочная правовая система и профессиональная информационная среда для регулируемых решений, evidence_state: analytical_bridge_pending_client_frame_validation}
    engineering_core:
      formulation: КонсультантПлюс — рабочая среда поддержки актуальных и обоснованных профессиональных решений в изменяющейся правовой среде.
      provenance: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-MODEL-20260905-001-V1
      evidence_state: existing_candidate_hypothesis_not_market_validated
    current_client_translation_candidate:
      formulation: Не просто найти информацию — понять, что делать, и иметь основание для решения.
      provenance: analyst_translation_of_existing_decision_model
      evidence_state: candidate_wording_not_direct_client_quote_not_validated
    authority_boundary: >-
      КонсультантПлюс и РИЦ поддерживают информационную основу и прохождение сценария, но не принимают
      профессиональное или управленческое решение вместо участника и не гарантируют его правильность.
  role_positioning_view:
    rule: роли являются представлением внутри этого Отчета и не самостоятельными продуктами
    roles:
      - {participant_id: DB04, role: конечный профессиональный пользователь, primary_decisions: [C1, C2], likely_territories_to_test: [PT2, PT3, PT7]}
      - {participant_id: DB03, role: руководитель регулируемой функции, primary_decisions: [C2, C3, C4], likely_territories_to_test: [PT2, PT3, PT4, PT5, PT6]}
      - {participant_id: DB01, role: руководитель или собственник, primary_decisions: [C4, C5], likely_territories_to_test: [PT3, PT4, PT5, PT6]}
      - {participant_id: DB02, role: экономический заказчик или закупщик, primary_decisions: [C5], likely_territories_to_test: [PT6, PT7]}
      - {participant_id: DB05, role: ИТ или администратор доступа, primary_decisions: [C6], likely_territories_to_test: [PT5, PT7]}
  deficiencies_risks_and_trends:
    - empirical frame of reference is not established by role or episode
    - real alternative set is not established and must be elicited rather than prescribed
    - role boundaries may blur in small organizations
    - official provider messaging is not evidence of client perception or preference
    - relative superiority, ROI, avoided losses, general risk reduction and general efficiency remain unsupported
    - PT5 and PT6 can over-attribute organizational outcomes to product or RIC unless contribution evidence is separated
    - short slogan testing without episode context can produce preference statements that are unstable or constructed by the interview task
  decision_support:
    supported_now:
      - retain C1-C6 as one coding dimension only
      - use D1-D11 as the positioning research frame
      - carry PT1-PT7 into controlled empirical comparison with priority PT2/PT3/PT6 and PT7 control
      - preserve product-versus-RIC contribution separation and evidence boundaries
      - use existing official positioning as category evidence, not as client-validation evidence
    not_supported_now:
      - select an official winning positioning
      - declare a universal competitor set or market frame for all roles
      - state relative superiority over alternatives without direct comparison evidence
      - promise ROI, prevented fines, general risk reduction or general organizational efficiency
      - treat candidate wording as direct client language
conclusions_and_recommendations:
  conclusion: >-
    Позиционирование КонсультантПлюс для РИЦ должно исследоваться как многомерная система выбора, а не
    выводиться только из C1-C6. V3 дает стандартный TECH-BMA Отчет с семьью альтернативными территориями,
    единой методикой их сравнения и явными доказательными границами. Ни одна территория пока не принята.
  recommendation: >-
    Материально расширить существующий TM-MEAS План первой волны: помимо решения и вклада продукта
    собирать frame of reference, фактические альтернативы, критерии выбора, PoP/PoD, reason to believe и
    реакцию на PT2/PT3/PT6/PT7 после нейтральной реконструкции эпизода. После данных выпустить TM-MEAS
    Отчет и только затем решать вопрос о принятии позиционирования через TM-DEC.
