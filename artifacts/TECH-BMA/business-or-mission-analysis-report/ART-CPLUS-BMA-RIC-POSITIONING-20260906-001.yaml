glossary:
  positioning: проверяемая модель места и смысла предложения для целевой аудитории относительно категории и альтернатив
  frame_of_reference: категория или конкурентная рамка, в которой участник оценивает предложение
  point_of_parity: свойство, необходимое для легитимного участия в выбранной категории
  point_of_difference: потенциально значимое отличие от других вариантов в выбранной рамке
  reason_to_believe: доказательная причина считать заявляемое отличие правдоподобным
  positioning_territory: согласованная гипотеза о категории, обещании, отличии, доказательстве и целевой роли; представление внутри Отчета, не самостоятельный продукт
  decision_episode: конкретный случай от триггера через информационный путь к действию или позиции
  provider_response: решение РИЦ или Сети о способе ответа на клиентскую ситуацию или разрыв
  view: представление части содержания канонического продукта, не самостоятельный информационный продукт
