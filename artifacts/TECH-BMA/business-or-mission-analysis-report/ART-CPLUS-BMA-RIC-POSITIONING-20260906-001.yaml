  - ARTVER-SE-GOST58609-NORMATIVE-FIRST-OUTPUT-CROSSWALK-20260904-001-V3
context_and_assumptions:
  predecessor_model_state:
    client_decisions: [C1, C2, C3, C4, C5, C6]
    provider_responses: [P1, P2]
    evidence_state: candidate_model_pending_direct_client_and_RIC_episodes
  decision_axis:
    individual: [знать, понять, решить]
    organizational_meta_capability:
      name: организовать
      meaning: >-
        Сделать критичные решения повторяемыми, распределенными по ролям, обучаемыми и контролируемыми.
      status: hypothesis_requires_validation
  current_observable_result_boundary:
    supported_episode_level_observables:
      - решение или действие сформулировано
      - основание найдено и может быть воспроизведено
      - оставшаяся неопределенность зафиксирована
      - вклад КонсультантПлюс и вклад РИЦ описаны участником раздельно
    unsupported_outcome_attribution:
      - предотвращенные штрафы или убытки
      - ROI продукта
      - общее снижение правового или иного риска
      - общий рост эффективности или производительности организации
  evidence_limitation: >-
    Реальные клиентские и РИЦ-эпизоды, частота и критичность сценариев, фактический язык ценности,
    эмпирический набор альтернатив и причинный вклад продукта/сервиса еще не установлены.
body:
  evaluation_method_and_evidence:
    method: >-
      Синтезировать существующую decision-centric BMA-модель, уточнение C/P, модель участников,
      правила разрешения представлений в канонические продукты и план первой волны измерений;
      оценить кандидатное позиционирование по критериям внутренней непротиворечивости,
      ролевой применимости, проверяемости на эпизоде и доказательной ограниченности.
    exact_evidence:
      - artifact_version_id: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-MODEL-20260905-001-V1
        use: исходное единое ядро ценности и цепочка от ситуации к решению
      - artifact_version_id: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-REFINEMENT-20260905-001-V2
        use: разделение C1-C6 и P1-P2, границы наблюдаемого результата
      - artifact_version_id: ARTVER-CPLUS-BMA-PARTICIPANT-OFFER-INFORMATION-EXCHANGE-20260905-001-V1
        use: роли DB01-DB05 и PB01-PB03 и их decision interfaces
      - artifact_version_id: ARTVER-CPLUS-PROPOSAL-PRODUCT-ALIGNMENT-20260905-001-V2
        use: D01-D10 как представления существующих канонических продуктов, а не самостоятельные продукты
      - artifact_version_id: ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V1
        use: классы доказательств и будущая проверка формулировок на реальных эпизодах
    criteria:
      - одна смысловая ось должна быть применима к разным ролям без превращения в разные несвязанные обещания
      - позиционирование должно начинаться от решения и ситуации участника, а не от перечня функций
      - вклад продукта и вклад РИЦ должны быть разделены
      - любое сильное утверждение должно иметь определимую единицу доказательства
      - производные сообщения не должны обещать результат сильнее, чем позволяет доказательство
      - схема должна позволять РИЦ перейти от общего смысла к конкретному клиентскому сценарию
  findings:
    - id: F1
      result: supported_by_current_model
      finding: >-
        Решение участника и путь к его основанию являются наиболее непротиворечивой общей осью,
        связывающей C1-C6 и уже сформированную value hypothesis.
      impact: >-
        Центр позиционирования целесообразно строить вокруг профессионального решения, а функции
        КонсультантПлюс трактовать как средства прохождения соответствующего сценария.
    - id: F2
      result: analytical_conclusion_not_market_fact
      finding: >-
        Формулы уровня «доступ к правовой информации» или «найти ответ» уже, чем текущая модель C1-C6:
        они не покрывают выбор профессиональной позиции, воспроизводимость правила работы,
        организационную реакцию, конфигурацию решения и управляемый доступ.
      impact: >-
        Такие формулы могут использоваться как частные описания этапов, но не рекомендуются как
        единый верхнеуровневый смысл без дополнительного обоснования.
    - id: F3
      result: supported_by_role_decomposition
      finding: >-
        Одной короткой фразы недостаточно для практической работы РИЦ: смысл должен быть инвариантен,
        но ролевое обещание и пример сценария должны меняться в зависимости от решения участника.
      impact: >-
        Требуется слоистая архитектура сообщения, а не набор независимых ролевых лозунгов.
    - id: F4
      result: evidence_boundary
      finding: >-
        Вклад РИЦ не должен сливаться с возможностями СПС. P1 описывает ответ РИЦ на конкретную
        клиентскую ситуацию, но его фактическая полезность пока требует прямых сервисных и клиентских эпизодов.
      impact: >-
        Внешнее сообщение должно различать «что дает информационная среда» и «что делает РИЦ,
        чтобы клиент применил ее к значимому сценарию».
    - id: F5
      result: evidence_gap
      finding: >-
        Текущие артефакты не устанавливают эмпирический набор альтернатив, с которыми клиент
        сравнивает КонсультантПлюс в конкретной ситуации.
      impact: >-
        Нельзя выдавать заранее выбранный список конкурентов или заменителей за установленный факт;
        фактические альтернативы должны собираться в TM-MEAS по реальным эпизодам.
    - id: F6
      result: preserved_model_boundary
      finding: >-
        «Организовать» является организационной мета-способностью, а не универсальным четвертым
        шагом после «знать → понять → решить» для каждого пользователя.
      impact: >-
        Организационные обещания нельзя механически переносить в сообщение конечному специалисту.
    - id: F7
      result: current_evidence_limit
      finding: >-
        Существующая доказательная база не позволяет приписывать КонсультантПлюс или РИЦ ROI,
        предотвращенные штрафы, общее снижение риска или общий рост эффективности.
      impact: >-
        Такие утверждения исключаются из кандидатного позиционирования до отдельного доказательного дизайна.
  candidate_positioning_model:
    status: owner_directed_analyst_candidate_not_official_positioning
    category_candidate:
      formulation: рабочая информационная среда поддержки профессиональных решений
      evidence_state: analytical_category_candidate_pending_client_language_validation
    engineering_core:
      formulation: >-
        КонсультантПлюс — рабочая среда поддержки актуальных и обоснованных профессиональных
        решений в изменяющейся правовой среде.
      provenance: ARTVER-CPLUS-BMA-CLIENT-DECISION-VALUE-MODEL-20260905-001-V1
      evidence_state: existing_candidate_hypothesis_not_market_validated
    client_translation_candidate:
      formulation: >-
        Не просто найти информацию — понять, что делать, и иметь основание для решения.
      provenance: analyst_translation_of_existing_decision_model
      evidence_state: candidate_wording_not_direct_client_quote_not_validated
    RIC_link_candidate:
      formulation: >-
        КонсультантПлюс дает информационную основу решения; РИЦ помогает превратить возможности
        системы в реально работающие для клиента сценарии.
      provenance: analyst_synthesis_of_C_decisions_and_P1_provider_response
      evidence_state: provider_response_hypothesis_requires_client_and_RIC_validation
    semantic_invariant:
      - возникла ситуация, изменение или неопределенность
      - участнику требуется конкретное решение, действие, позиция или организационная реакция
      - требуется установить применимость и значение информации для ситуации
      - формируется действие или позиция и ее основание
      - результат и основание должны быть воспроизводимы в допустимых границах роли
    authority_boundary: >-
      КонсультантПлюс и РИЦ поддерживают информационную основу и прохождение сценария, но не принимают
      профессиональное или управленческое решение вместо уполномоченного участника и не гарантируют его правильность.
  role_positioning_view:
    rule: >-
      Все ролевые формулировки являются производными от единого engineering_core и не являются
      самостоятельными позиционированиями или доказанными клиентскими цитатами.
    roles:
      - participant_id: DB04
        role: конечный профессиональный пользователь
        primary_decisions: [C1, C2]
        candidate_promise: >-
          Понять, что делать в конкретной ситуации, и иметь актуальное основание для действия или позиции.
        proof_needed: recent_client_episode_C1_or_C2
      - participant_id: DB03
        role: руководитель регулируемой функции
        primary_decisions: [C2, C3, C4]
        candidate_promise: >-
          Сформировать обоснованный порядок реакции и сделать его воспроизводимым для команды
          в повторяющихся регулируемых ситуациях.
        proof_needed: recent_client_episode_showing_team_rule_or_organizational_response
      - participant_id: DB01
        role: руководитель или собственник организации
        primary_decisions: [C4, C5]
        candidate_promise: >-
          Понять, какое изменение или риск требует реакции организации, кто отвечает за реакцию
          и на какой информационной основе она строится.
        proof_needed: recent_client_episode_C4_and_when_applicable_C5
      - participant_id: DB02
        role: экономический заказчик или закупщик
        primary_decisions: [C5]
        candidate_promise: >-
          Выбрать комплект, доступ, обучение и сервис исходя из критичных рабочих сценариев организации.
        proof_needed: recent_purchase_or_configuration_decision_episode
      - participant_id: DB05
        role: ИТ, информационная безопасность или администратор доступа
        primary_decisions: [C6]
        candidate_promise: >-
          Обеспечить управляемый, надежный и допустимый доступ к среде, необходимой участникам
          для профессиональных решений.
        proof_needed: recent_access_or_administration_episode
      - participant_id: PB01_PB02
        role: клиентский менеджер, специалист сопровождения или обучения РИЦ
        primary_decisions: [P1]
        candidate_promise: >-
          Диагностировать критичный сценарий клиента, определить затруднение и подобрать сопровождение,
          настройку или обучение, которые помогают участнику пройти этот сценарий.
        proof_needed: paired_RIC_and_client_service_episode_where_possible
      - participant_id: PB03
        role: руководство РИЦ или участник продуктовой обратной связи
        primary_decisions: [P1, P2]
        candidate_promise: >-
          Собирать повторяющиеся сценарии и разрывы как доказательную основу для приоритизации
          сервисных и продуктовых улучшений.
        proof_needed: repeated_episode_synthesis_not_single_anecdote
  message_architecture_view:
    layers:
      - id: L1
        name: единое смысловое ядро
        content_rule: одна стабильная формула о поддержке профессионального решения
      - id: L2
        name: ролевое обещание
        content_rule: конкретизирует, какое решение или класс решений значим для данного участника
      - id: L3
        name: сценарий
        content_rule: начинается с реальной ситуации/триггера и заканчивается наблюдаемым действием или позицией
      - id: L4
        name: доказательство
        content_rule: связывает утверждение с одним или несколькими идентифицируемыми эпизодами и классом доказательства
    strengthening_rule: >-
      Ни один нижний слой не может вводить причинное, финансовое, правовое или результативное
      утверждение сильнее, чем позволяют связанные с ним доказательства.
    RIC_usage_sequence:
      - определить роль участника и недавнюю значимую ситуацию
      - установить, какое решение требовалось принять
      - восстановить информационный путь и точку неопределенности
      - показать релевантные возможности КонсультантПлюс внутри этого сценария, а не вне его
      - отдельно определить возможный вклад РИЦ
      - зафиксировать наблюдаемый результат и оставшийся разрыв
  positioning_map_view:
    classification: D01_D02_D03_D04_D05_D06_views_inside_TECH_BMA_report
    required_fields:
      - participant
      - trigger_or_situation
      - client_decision_C_level
      - uncertainty_or_consequence
      - required_information_or_basis
      - ConsultantPlus_contribution
      - RIC_contribution_if_any
      - observable_episode_result
      - gap_or_workaround
      - evidence_class
      - evidence_state
    example_template_only_not_evidence:
      participant: DB04 professional user
      trigger_or_situation: recent regulated work situation
      client_decision_C_level: C1 or C2
      uncertainty_or_consequence: to be established from episode
      required_information_or_basis: to be established from episode
      ConsultantPlus_contribution: to be reconstructed from episode
      RIC_contribution_if_any: to be reconstructed separately
      observable_episode_result: to be established
      gap_or_workaround: to be established
      evidence_class: not_established
      evidence_state: template_only
  evidence_contract:
    unit: one recent concrete decision episode
    claim_chain: positioning_claim_to_role_to_scenario_to_episode_evidence
    evidence_classes:
      - direct_episode_fact_reported_by_participant
      - participant_interpretation_or_judgment
      - interviewer_coding_or_inference
      - RIC_account_of_client_episode
      - not_established
    claim_states:
      - confirmed_by_available_episode_evidence
      - contradicted_by_available_episode_evidence
      - partially_supported
      - participant_judgment_only
      - RIC_account_only
      - analyst_inference_only
      - not_established
    minimum_rule: >-
      Формулировка не повышается до подтвержденного позиционирования только потому, что она логически
      согласуется с моделью или нравится участникам РИЦ; требуется трассировка к прямым эпизодам.
  alternatives_and_competition:
    current_state: not_established_by_current_evidence
    prohibited_inference: >-
      Не фиксировать список альтернатив клиента как факт на основании общих представлений о рынке.
    measurement_action: >-
      В каждом валидном эпизоде фиксировать, что участник реально использовал или рассматривал вместо
      или вместе с КонсультантПлюс, и только после повторяемых наблюдений синтезировать карту альтернатив.
  promise_boundaries:
    allowed_now:
      - описывать роль КонсультантПлюс как информационной поддержки решения при явной маркировке кандидатного статуса общей формулировки
      - показывать конкретные функции только внутри подтвержденного или явно гипотезного сценария
      - раздельно описывать вклад КонсультантПлюс и вклад РИЦ
      - фиксировать наблюдаемые результаты уровня эпизода
    do_not_say_without_additional_evidence:
      - КонсультантПлюс гарантирует правильность профессионального или управленческого решения
      - КонсультантПлюс или РИЦ предотвращает штрафы или убытки
      - продукт имеет установленный ROI или срок окупаемости
      - продукт в целом снижает правовые или иные риски на установленную величину
      - продукт в целом повышает эффективность или производительность организации
      - текущая кандидатная формулировка уже является принятой рынком или клиентами
  representation_and_product_boundary:
    views_inside_this_report:
      - D01 карта решений роли или подразделения
      - D02 паспорт критичного сценария решения
      - D03 карта покрытия сценария КонсультантПлюс и сервисом РИЦ
      - D04 карта разрывов, задержек и обходных путей
      - D05 матрица ролей передачи и контроля решений
      - D06 рекомендации по комплекту, доступу, сервису и обучению от сценариев
    not_separate_products: >-
      Указанные D01-D06 являются представлениями содержания TECH-BMA report и не создают новые canonical O.
    products_outside_current_report:
      - {view_or_need: доказательная синтеза по серии эпизодов, canonical_output: 'TM-MEAS → measurement report', status: future_after_measurement_execution}
      - {view_or_need: материалы применения позиционирования сотрудниками РИЦ, canonical_output: 'TECH-IMP → training materials', status: future_after_positioning_validation}
      - {view_or_need: принятое управленческое решение о позиционировании, canonical_output: 'TM-DEC → decision register', status: only_after_actual_decision}
  decision_support:
    supported_now:
      - использовать данный Отчет как внутреннюю кандидатную рамку для подготовки и проведения проверки позиционирования в РИЦ
      - строить обсуждение с клиентом от конкретного решения и сценария, а не от полного перечня функций
      - различать единую смысловую ось, ролевую конкретизацию, сценарий и доказательство
      - использовать promise_boundaries как обязательный контроль формулировок до получения новых доказательств
    not_supported_now:
      - объявлять engineering_core официальным рыночным позиционированием
      - массово внедрять client_translation_candidate или RIC_link_candidate как утвержденные рекламные слоганы
      - считать ролевые формулировки прямыми высказываниями клиентов
      - утверждать эмпирическую карту конкурентов или заменителей
      - выводить ROI, цену ошибки, частотность или причинное влияние из текущего набора артефактов
  deficiencies_risks_and_trends:
    - id: R1
      deficiency: отсутствуют прямые клиентские и РИЦ-эпизоды для текущей кандидатной формулировки
      impact: wording_and_claim_strength_not_validated
      treatment: execute_existing_TM_MEAS_wave1_plan
    - id: R2
      risk: сотрудник РИЦ может превратить decision-centric рамку обратно в feature pitch
      impact: потеря связи между продуктом и решением клиента
      treatment: future training materials must preserve L1-L4 trace and start from episode
    - id: R3
      risk: вклад РИЦ может быть переоценен по собственным рассказам РИЦ
      impact: provider_self_attribution_bias
      treatment: compare RIC accounts with client accounts where possible and keep evidence classes separate
    - id: R4
      risk: в малой организации одна персона совмещает несколько DB-ролей
      impact: role labels may not map one-to-one to people
      treatment: code actual decision and authority rather than job title only
    - id: R5
      deficiency: фактический язык ценности клиентов не установлен
      impact: client_translation_candidate may be semantically correct but linguistically weak
      treatment: capture participant value_language in each valid episode before wording adoption
    - id: R6
      trend_or_watch_item: >-
        Если в серии эпизодов повторяется переход от единичного решения к изменению правил работы,
        организационная meta-capability «организовать» может стать сильным дифференцирующим уровнем.
      evidence_state: hypothesis_to_test_not_current_fact
conclusions_and_recommendations:
  conclusion: >-
    Текущая decision-centric модель позволяет сформировать внутренне непротиворечивое кандидатное
    позиционирование РИЦ: КонсультантПлюс следует объяснять через профессиональное решение и путь к
    его актуальному и воспроизводимому основанию, а не через каталог функций. При этом ни engineering_core,
    ни клиентский перевод, ни связка с РИЦ пока не имеют статуса принятого рыночного позиционирования.
  recommendation: >-
    Использовать этот Отчет как базовую гипотезную рамку и следующим предметным шагом исполнить уже
    существующий ARTVER-CPLUS-CLIENT-DECISION-RESEARCH-WAVE1-MEASUREMENT-PLAN-20260905-001-V1.
    По результатам сформировать TM-MEAS measurement report и successor TECH-BMA report, где каждое
    ключевое утверждение будет помечено как подтвержденное, опровергнутое или недостаточно доказанное.
glossary:
  positioning: >-
    В данном Отчете — проверяемая модель того, какое место и смысл КонсультантПлюс занимает
    относительно решений конкретных участников; не синоним рекламного лозунга.
  engineering_core: стабильное кандидатное смысловое ядро, от которого выводятся ролевые формулировки
  client_translation_candidate: краткая пользовательская формулировка, требующая проверки языком реальных клиентов
  role_promise: конкретизация единого ядра относительно решения и ответственности роли
  decision_episode: конкретный недавний случай от триггера через информационный путь к действию или позиции
  provider_response: решение РИЦ или Сети о способе ответа на выявленную клиентскую ситуацию или разрыв
  evidence_contract: правило связи утверждения позиционирования с классом и состоянием доказательства
  view: представление части содержания канонического продукта, не самостоятельный информационный продукт
change_history:
  - version: V1
    date: '2026-09-06'
    change: >-
      Синтезировано первое кандидатное позиционирование для РИЦ из существующей decision-centric модели;
      добавлены ролевые формулировки, четырехслойная архитектура сообщения, доказательный контракт,
      границы обещаний и явный запрет на недоказанную карту альтернатив.
