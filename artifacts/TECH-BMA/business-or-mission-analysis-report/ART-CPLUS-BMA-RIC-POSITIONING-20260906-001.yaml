artifact_instance_purpose: >-
  Сформировать кандидатное позиционирование КонсультантПлюс для практической работы РИЦ,
  связывающее единое ядро смысла с решениями клиента C1-C6, ответом РИЦ P1, ролевыми
  формулировками, сценарными доказательствами и явными границами обещаний; сохранить
  позиционирование как проверяемую гипотезу до прямой клиентской и РИЦ-валидации.
