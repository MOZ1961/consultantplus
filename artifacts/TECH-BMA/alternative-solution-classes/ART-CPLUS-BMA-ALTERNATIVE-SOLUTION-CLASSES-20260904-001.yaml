identifier: CPLUS-BMA-ALTERNATIVE-SOLUTION-CLASSES-V2
body:
  current_solution_class:
    id: ALT-CPLUS-00
    status: sourced_current_state_baseline
    description: >-
      Distributed service-network model: Coordination Center defines network strategy, develops/improves the system,
      manages content/legal processing and quality-standard development; RICs supply the system, provide service support
      and participate in regional content; users can receive network, local or remote-internet versions.
    source_refs: [SRC-CPLUS-STRUCTURE, SRC-CPLUS-ABOUT]
  candidate_classes:
    - id: ALT-CPLUS-01
      name: maintain_and_incrementally_improve_current_distributed_model
      evidence_class: analyst_inference_candidate
      description: preserve central/RIC responsibility structure and continue product/service improvement within it
      supporting_observation: official sources explicitly describe continuous product/technology improvement and ongoing service-standard development
      decision_status: not_evaluated_no_internal_problem_metrics_or_economics
    - id: ALT-CPLUS-02
      name: increase_digital_access_and_self_service_with_RIC_service_retained
      evidence_class: analyst_inference_candidate
      description: expand online/mobile/self-service routes while retaining RIC delivery/support functions
      supporting_observation: official sources confirm remote internet delivery, online/mobile access and continuing RIC service
      decision_status: not_evaluated_no_demand_service_outcome_or_cost_evidence
    - id: ALT-CPLUS-03
      name: strengthen_central_regional_quality_and_information_flow_standardization
      evidence_class: analyst_inference_candidate
      description: make consistency of product/content/service flows between Coordination Center and RICs the main improvement object
      supporting_observation: official structure distributes service/content responsibilities while assigning network management and quality-standard development centrally
      decision_status: hypothesis_only_no_variance_nonconformance_or_bottleneck_data
    - id: ALT-CPLUS-04
      name: segment_specific_product_and_service_evolution
      evidence_class: analyst_inference_candidate
      description: evolve packages/functions/service by professional user segment while preserving the common legal-information platform
      supporting_observation: official pages distinguish professional user groups, package composition and user-count parameters; product history shows continuing specialized product development
      decision_status: not_evaluated_no_segment_economics_or_outcome_metrics
  comparison_dimensions_for_future_analysis:
    - mission contribution to broad distribution of legal information
    - accessibility and workflow fit by user class
    - information currentness and practical usability
    - service consistency across the RIC network
    - cost and economic effect
    - feasibility and impact on Coordination Center/RIC responsibilities
    - risk, transition burden and reversibility
  exclusion_and_decision_rules:
    - none of ALT-CPLUS-01..04 is selected or recommended by this product
    - no architecture replacement is justified without a source-backed problem and internal decision criteria
    - current 2026 AI functions are evidence of product evolution, not evidence that an AI-centric transformation is the preferred alternative
    - internal contractual, financial and technical architecture is not assumed from public materials
summary: >-
  Four bounded analyst-generated alternative classes are retained for later comparison. ALT-CPLUS-01 is the nearest
  continuation of the published current model; ALT-CPLUS-02..04 are hypotheses. Selection is blocked until internal
  objectives, problem evidence, measures, constraints, costs and stakeholder needs are available.
glossary:
  alternative_solution_class: broad class of possible response considered before selecting a specific solution
  sourced_current_state_baseline: source-supported existing model used as comparison baseline
  analyst_inference_candidate: analysis-derived candidate not asserted by source and not accepted by owner
