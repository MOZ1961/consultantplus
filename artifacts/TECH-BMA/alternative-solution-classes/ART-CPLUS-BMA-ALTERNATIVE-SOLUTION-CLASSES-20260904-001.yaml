identifier: CPLUS-BMA-ALTERNATIVE-SOLUTION-CLASSES-V1
body:
  current_solution_class:
    id: ALT-CPLUS-00
    status: sourced_current_state_not_candidate_change
    description: >-
      Distributed service-network model: Coordination Center develops/improves the system, manages network strategy and content/legal processing;
      RICs supply the system, provide full service support and contribute regional legal/judicial content; users receive local/network/remote variants.
    source_refs: [SRC-CPLUS-STRUCTURE, SRC-CPLUS-ABOUT]
  candidate_classes:
    - id: ALT-CPLUS-01
      name: maintain_and_incrementally_improve_current_distributed_model
      evidence_class: analyst_inference_candidate
      description: preserve the central + RIC operating architecture and focus changes on existing product/service processes without structural redistribution of authority
      why_admissible: official sources explicitly show continuous product and service-standard improvement within the current network
      decision_status: not_evaluated_no_internal_problem_or_metrics
    - id: ALT-CPLUS-02
      name: increase_digital_self_service_with_regional_service_retained
      evidence_class: analyst_inference_candidate
      description: increase online/mobile/self-service access while retaining RIC sales/service and regional-content responsibilities
      why_admissible: official sources establish remote internet access, mobile access, online functions and continuing RIC service
      decision_status: not_evaluated_no_demand_cost_or_service_quality_evidence
    - id: ALT-CPLUS-03
      name: strengthen_central_regional_quality_and_information_flow_standardization
      evidence_class: analyst_inference_candidate
      description: treat consistency of product/content/service flows between Coordination Center and RICs as the principal improvement object
      why_admissible: official structure assigns network management and service-quality standard improvement centrally while service/content work is distributed
      decision_status: hypothesis_only_no_nonconformance_or_variance_data
    - id: ALT-CPLUS-04
      name: segment_specific_product_and_service_evolution
      evidence_class: analyst_inference_candidate
      description: evolve product/service packages by professional user segment while preserving common legal-information platform capabilities
      why_admissible: official product and purchase pages distinguish specialist groups and individualized product package parameters
      decision_status: not_evaluated_no_segment_economics_or_outcome_metrics
  comparison_dimensions_for_future_analysis:
    - mission contribution to broad distribution of legal information
    - user accessibility and workflow fit by user class
    - quality/currentness and legal-information traceability
    - service consistency across RIC network
    - cost and economic effect
    - feasibility and impact on central/RIC responsibilities
    - risk and transition burden
  exclusions:
    - no recommendation to replace the current network architecture
    - no AI-specific solution class is promoted without a separately evidenced problem/need and requirements process
    - no internal organizational, contractual or technical architecture is assumed beyond published material
summary: >-
  Four analyst-generated classes are retained for future comparison. None is selected. ALT-CPLUS-01 is closest to the published current operating model;
  ALT-CPLUS-02..04 are bounded hypotheses derived from observed delivery/service/product characteristics and require internal evidence before evaluation.
glossary:
  alternative_solution_class: broad class of possible response considered before selecting a specific solution
  sourced_current_state_not_candidate_change: source-supported existing model included as comparison baseline
  analyst_inference_candidate: candidate produced by analysis rather than explicitly stated by source
change_history: [{version: V1, date: '2026-09-04', change: initial source-bounded alternative classes}]
